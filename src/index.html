        // options (re-marking the selection also refreshes the trigger label),
        // redraw any visible compare table (its !table guard skips arenas on a
        // demo) and re-render the info bar of every arena showing an editor —
        // that refreshes its star pill along with the rest of its badges.
        function toggleStar(path) {
            const slug = slugFromPath(path);
            if (starredSlugs.has(slug)) starredSlugs.delete(slug); else starredSlugs.add(slug);
            storage.set(STARRED_KEY, JSON.stringify([...starredSlugs]));
            arenas.forEach(arena => {
                arena.dropdown.setOptions(visibleEditors(), { withCompare: true });
                if (arena.currentPath && !arena.dropdown.setSelected(arena.currentPath)) {
                    // A deep-linked editor hidden from the menu — label it directly.
                    arena.dropdown.label.innerHTML = optionRowHtml(editorsByPath.get(arena.currentPath));
                }
                refreshCompareTable(arena);
                if (arena.currentPath) renderInfo(arena, arena.currentPath);
            });
        }

        // The code/demo toggle is global, and it mirrors a #code marker on the
        // URL so the browser's Back button exits the code view. While the view
        // is on, the current history entry is always `<route>#code` sitting
        // directly on top of `<route>` — turning it on pushes that entry, and
        // every navigation leaves the mode first (see renderSelection) — so
        // "View demo" can simply go back, identical to pressing Back; the
        // popstate handler re-renders the demos.
        function toggleCode() {
            if (codeView) {
                history.back();
            } else {
                history.pushState(history.state, '', location.pathname + location.search + '#code');
                applyCodeView(true);
            }
        }

        // Apply the global mode to every arena: relabel each visible toggle,
        // add/remove its comments badge and swap the viewport between the demo
        // iframe and the fetched source.
        function applyCodeView(on, { except } = {}) {
            codeView = on;
            arenas.forEach(arena => {
                if (arena === except) return;
                const btn = arena.infoPanel.querySelector('.view-code-btn');
                if (btn) {
                    btn.textContent = on ? 'View demo' : 'View code';
                    const commentsBtn = arena.infoPanel.querySelector('.comments-btn');
                    if (on && !commentsBtn) {
                        btn.insertAdjacentHTML('afterend', commentsBtnHtml());
                        btn.nextElementSibling.addEventListener('click', toggleComments);
                    } else if (!on && commentsBtn) {
                        commentsBtn.remove();
                    }
                }
                if (!arena.currentPath) return;   // arena is on the comparison table
                if (on) showCode(arena); else loadEditor(arena, arena.currentPath);
            });
            syncInfoPanelHeights();   // the comments badge can change a panel's wrap
        }

        async function showCode(arena) {
            const path = arena.currentPath;
            const full = fullEditors;   // the source variant this fetch is for
            try {
                const response = await fetch(demoPath(path));
                const htmlText = await response.text();
                // The mode (code/demo or minimal/full) or this arena's selection
                // may have changed while the source was in flight — don't clobber
                // the newer view.
                if (!codeView || arena.currentPath !== path || fullEditors !== full) return;

                teardownDemo(arena);
                const code = document.createElement('code');
                // textContent escapes the markup
                code.textContent = commentsHidden ? stripComments(htmlText) : htmlText;
                const pre = document.createElement('pre');
                pre.className = 'code-view';
                pre.appendChild(code);
                arena.viewport.appendChild(pre);
                highlightCode(code);   // lazy-loads highlight.js from a CDN on first use
            } catch (err) {
                arena.viewport.innerHTML = `<p style="color:red;">Could not load source: ${err.message}</p>`;
            }
        }

        // Strip the comments from a demo's source for the code view: HTML
        // comments in markup, // and /* */ in <script>, /* */ in <style>.
        // A scanner (not a parser) walks the text tracking just enough state
        // to not mangle code: JS/CSS strings (URLs contain //), template
        // literals and regex literals are copied through untouched, and
        // <script>/<style> bodies end at their close tag exactly like HTML
        // itself parses them. A line a removal leaves empty is dropped whole.
        function stripComments(src) {
            const n = src.length;
            let out = '';
            let i = 0;
            let mode = 'html';   // 'html' | 'js' | 'css'

            // Resume after a removed comment: if the rest of its line is blank,
            // drop the whole line (rewind out's tail, swallow the newline).
            const resume = (next) => {
                let o = out.length;
                while (o > 0 && (out[o - 1] === ' ' || out[o - 1] === '\t')) o--;
                if ((o === 0 || out[o - 1] === '\n') && src[next] === '\n') {
                    out = out.slice(0, o);
                    return next + 1;
                }
                return next;
            };
            // Copy a quoted string (or template literal) through verbatim.
            const copyString = () => {
                const q = src[i];
                let j = i + 1;
                while (j < n) {
                    if (src[j] === '\\') { j += 2; continue; }
                    if (src[j] === q) { j++; break; }
                    if (q !== '`' && src[j] === '\n') break;   // unterminated — bail
                    j++;
                }
                out += src.slice(i, j);
                i = j;
            };
            // A `/` starts a regex (not division) when what precedes it can't
            // end an expression: an operator/punctuation, or a keyword.
            const regexAllowed = () => {
                const m = out.match(/(\S)\s*$/);
                if (!m) return true;
                if (/[\w$]/.test(m[1])) return /(^|[^\w$])(return|typeof|instanceof|in|of|new|void|delete|case|do|else|yield|await)\s*$/.test(out);
                return !/[)\]}'"`]/.test(m[1]);
            };

            while (i < n) {
                const c = src[i];
                if (mode === 'html') {
                    if (src.startsWith('<!--', i)) {
                        const end = src.indexOf('-->', i + 4);
                        i = resume(end === -1 ? n : end + 3);
                        continue;
                    }
                    const open = /^<(script|style)[\s>]/i.exec(src.slice(i, i + 8));
                    if (open) {
                        mode = open[1].toLowerCase() === 'script' ? 'js' : 'css';
                        const gt = src.indexOf('>', i);
                        const end = gt === -1 ? n : gt + 1;
                        out += src.slice(i, end);
                        i = end;
                        continue;
                    }
                    out += c; i++;
                    continue;
                }
                // <script>/<style> bodies end at the close tag no matter the
                // inner state — hand it back to the html branch above.
                const close = mode === 'js' ? '<\/script' : '<\/style';
                if (c === '<' && src.slice(i, i + close.length).toLowerCase() === close) {
                    mode = 'html';
                    continue;
                }
                if (src.startsWith('/*', i)) {
                    const end = src.indexOf('*/', i + 2);
                    i = resume(end === -1 ? n : end + 2);
                    continue;
                }
                if (mode === 'js') {
                    if (src.startsWith('//', i)) {
                        const end = src.indexOf('\n', i);
                        i = resume(end === -1 ? n : end);
                        continue;
                    }
                    if (c === '"' || c === "'" || c === '`') { copyString(); continue; }
                    if (c === '/' && regexAllowed()) {
                        let j = i + 1, inClass = false;
                        while (j < n && src[j] !== '\n') {
                            if (src[j] === '\\') { j += 2; continue; }
                            if (src[j] === '[') inClass = true;
                            else if (src[j] === ']') inClass = false;
                            else if (src[j] === '/' && !inClass) { j++; break; }
                            j++;
                        }
                        out += src.slice(i, j);
                        i = j;
                        continue;
                    }
                } else if (c === '"' || c === "'") { copyString(); continue; }
                out += c; i++;
            }
            // Trailing-comment removals leave dangling spaces — tidy line ends.
            return out.split('\n').map(l => l.trimEnd()).join('\n');
        }

        /* ---------- Lazy syntax highlighting (code view) ---------- */
        // highlight.js is fetched from a CDN only the FIRST time a code view is
        // opened — never on the initial page load. The module and its theme are
        // cached in `hljsPromise` and reused for every later code view.
        const HLJS_VERSION = '11.11.1';
        let hljsPromise = null;
        function loadHighlighter() {
            if (!hljsPromise) {
                const theme = document.createElement('link');
                theme.rel = 'stylesheet';
                theme.href = `https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@${HLJS_VERSION}/build/styles/github.min.css`;
                document.head.appendChild(theme);
                // The "common" ES build bundles ~37 languages (incl. xml/css/js), so
                // the demo's embedded <style>/<script> get sub-highlighted too.
                hljsPromise = import(`https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@${HLJS_VERSION}/build/es/highlight.min.js`)
                    .then(mod => mod.default)
                    .catch(err => { hljsPromise = null; throw err; });   // allow a retry on the next click
            }
            return hljsPromise;
        }

        // Syntax-highlight an already-filled <code> element in place. The source is
        // a whole HTML document, so we highlight with the xml grammar. Progressive
        // enhancement: if the CDN import fails, the plain escaped source stays put.
        async function highlightCode(codeEl) {
            const source = codeEl.textContent;
            try {
                const hljs = await loadHighlighter();
                if (!codeEl.isConnected) return;   // user already switched back to the demo
                codeEl.classList.add('hljs', 'language-xml');
                codeEl.innerHTML = hljs.highlight(source, { language: 'xml' }).value;
            } catch (err) {
                /* leave the un-highlighted (already escaped) source in place */
            }
        }

        /* ---------- Markdown-support score ---------- */
        // Each editor's `markdown` metadata (in editors.json) rates three abilities
        // on a support ladder; the score is their average. The components, with
        // links to the docs / 3rd-party libraries behind each claim, are revealed
        // in a modal when a score is clicked.

        // Support ladder: points feed the score; label/cls drive the modal pills.
        const MD_LEVELS = {
            'native':         { points: 100, label: 'Native',           cls: 'md-level--native' },
            'native-partial': { points: 75,  label: 'Native (partial)', cls: 'md-level--native-partial' },
            'library':        { points: 60,  label: '3rd Party',        cls: 'md-level--library' },
            'paid':           { points: 60,  label: 'Paid add-on',      cls: 'md-level--paid' },
            'custom':         { points: 30,  label: 'Custom Code',      cls: 'md-level--custom' },
            'none':           { points: 0,   label: 'None',             cls: 'md-level--none' },
        };
        const MD_DIMENSIONS = [
            { key: 'input',  label: 'Markdown → editor' },
            { key: 'output', label: 'Editor → Markdown' },
            { key: 'live',   label: 'Format as you type' },
        ];

        function markdownScore(editor) {
            const md = editor.markdown;
            if (!md) return null;
            const points = MD_DIMENSIONS.map(d => (MD_LEVELS[md[d.key]?.level] || MD_LEVELS.none).points);
            return Math.round(points.reduce((a, b) => a + b, 0) / points.length);
        }

        /* ----- Editor type (WYSIWYG vs Code) ----- */
        // WYSIWYG is a "B" rendered as text (styled like the Demo pill); Code is
        // Bootstrap's < > code icon. Both use currentColor so they tint to their context.
        const WYSIWYG_ICON = `<span>B</span>`;
        const CODE_ICON = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.854 4.854a.5.5 0 1 0-.708-.708l-3.5 3.5a.5.5 0 0 0 0 .708l3.5 3.5a.5.5 0 0 0 .708-.708L2.707 8zm4.292 0a.5.5 0 0 1 .708-.708l3.5 3.5a.5.5 0 0 1 0 .708l-3.5 3.5a.5.5 0 0 1-.708-.708L13.293 8z"/></svg>`;

        const EDITOR_TYPES = [
            { name: 'WYSIWYG', icon: WYSIWYG_ICON, blurb: 'What You See Is What You Get — the editor formats Markdown as you type: <code>**bold**</code> turns into <strong>bold</strong> text.' },
            { name: 'Code', icon: CODE_ICON, blurb: 'A source editor — you edit the raw Markdown and it is syntax-highlighted as you type: <code>**bold**</code> stays as <code>**bold**</code>, coloured but not rendered.' },
        ];
        const typeInfo = (name) => EDITOR_TYPES.find(t => t.name === name);

        function typeModalHtml() {
            const rows = EDITOR_TYPES.map(t => `
                <li class="md-row">
                    <div class="type-head"><span class="badge badge--type">${t.icon}</span><span class="type-head__name">${t.name}</span></div>
                    <p class="md-row__note">${t.blurb}</p>
                </li>`).join('');
            return `
                <button type="button" class="md-modal__close">×</button>
                <h2 class="md-modal__title">Editor types</h2>
                <ul class="md-breakdown">${rows}</ul>`;
        }

        /* ----- Modal (shared by the Markdown breakdown and the editor-type help) ----- */
        const mdModal = document.getElementById('md-modal');
        const mdModalCard = mdModal.querySelector('.md-modal__card');

        function markdownModalHtml(editor) {
            const score = markdownScore(editor);
            const rows = MD_DIMENSIONS.map(d => {
                const c = editor.markdown[d.key] || { level: 'none' };
                const lvl = MD_LEVELS[c.level] || MD_LEVELS.none;
                const link = c.via
                    ? (c.url
                        ? ` <a class="compare-link" href="${c.url}" target="_blank" rel="noopener">${c.via} ↗</a>`
                        : ` <span>${c.via}</span>`)
                    : '';
                return `
                    <li class="md-row">
                        <div class="md-row__head">
                            <span class="md-row__dim">${d.label}</span>
                            <span class="md-level ${lvl.cls}">${lvl.label}</span>
                        </div>
                        <p class="md-row__note">${c.note ? c.note + '.' : ''}${link}</p>
                    </li>`;
            }).join('');
            return `
                <button type="button" class="md-modal__close">×</button>
                <h2 class="md-modal__title">
                    ${editor.icon ? `<img src="${editor.icon}" alt="" />` : ''}${editor.name}
                    <span class="md-modal__score">Markdown ${score}/100</span>
                </h2>
                <ul class="md-breakdown">${rows}</ul>
                <details class="md-calc">
                    <summary class="md-calc__summary">How is this scored?</summary>
                    <p class="md-calc__body">The score averages the three abilities above. Support levels — Native 100 · Native (partial) 75 · 3rd party 60 · Custom code 30 · None 0. (Highlighting Markdown natively rather than rendering it still counts as full Native.)</p>
                </details>`;
        }

        function openModal(html) {
            mdModalCard.innerHTML = html;
            mdModalCard.querySelector('.md-modal__close').addEventListener('click', closeModal);
            mdModal.hidden = false;
            mdModalCard.focus();
        }
        function closeModal() {
            mdModal.hidden = true;
            mdModalCard.innerHTML = '';
        }
        function openMarkdownModal(path) {
            const editor = editorsByPath.get(path);
            if (editor && editor.markdown) openModal(markdownModalHtml(editor));
        }
        function openTypeModal() { openModal(typeModalHtml()); }

        // Dismiss on backdrop click or Escape.
        mdModal.querySelector('.md-modal__backdrop').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !mdModal.hidden) closeModal();
        });

        /* ---------- Comparison table (all editors at once) ---------- */
        // Active = a release within the last 365 days, measured by `lastAnyRelease`:
        // the core npm package's most recent ship of ANY version — including dev /
        // nightly builds and maintenance releases on older major lines (e.g.
        // CodeMirror's codemirror@5.65.x) — which the shown version's `lastRelease`
        // can miss. Every editor carries this field.
        const ONE_YEAR_MS = 365 * 24 * 60 * 60 * 1000;
        const isActive = (editor) => {
            const released = new Date(editor.lastAnyRelease);
            return !isNaN(released) && (Date.now() - released.getTime()) <= ONE_YEAR_MS;
        };

        // The editor set used by both the compare tables and the dropdown menus.
        const visibleEditors = () => showInactive ? editorList : editorList.filter(isActive);

        // The framework names for an editor, joined for the Frameworks column's
        // alphabetical tie-break among editors that support the same count.
        const frameworkNames = (editor) =>
            Array.isArray(editor.frameworks) ? editor.frameworks.map(fw => fw.name).join(', ') : '';

        /* ---------- Badges: the single shared order ---------- */
        // ONE list drives BOTH the comparison table (a column per entry, in this
        // order) and the per-editor info bar (the same badges, same order). To
        // reorder either view, reorder this array. Each entry:
        //   key     — column id: its data-col (compact toggle) and its sort key
        //   th      — table header label (HTML; '' for the icon-only end columns)
        //   thClass — header + cell alignment class ('is-numeric' | 'is-center')
        //   sort    — how the column sorts, omit to make it unsortable:
        //             { type, dir?, value(editor), tiebreak? }
        //   make    — editor -> badge() options, an array of them (one per
        //             framework), or null for an empty cell / no info-bar badge
        //   textInTable — in the TABLE, render just the text (a plain link if the
        //             badge has one, else bare) to save width; the info bar is
        //             unaffected and still shows the full pill
        const BADGES = [
            {
                key: 'downloads', th: NPM_ICON, thClass: 'is-numeric', textInTable: true,
                sort: { type: 'number', value: e => e.npmWeeklyDownloads },
                make: e => ({ icons: NPM_ICON, text: `${compact(e.npmWeeklyDownloads)}/wk`, link: e.npm }),
            },
            {
                key: 'stars', th: `${GITHUB_ICON} ★`, thClass: 'is-numeric', textInTable: true,
                sort: { type: 'number', value: e => e.githubStars },
                make: e => ({ icons: GITHUB_ICON, prefix: "★ ", text: compact(e.githubStars), link: e.github }),
            },
            {
                key: 'markdown', th: 'Markdown', thClass: 'is-numeric',
                sort: { type: 'number', value: e => markdownScore(e) ?? 0 },
                // A button, not a link: it opens the score-breakdown modal (wired
                // by wireBadges through data-modal).
                make: e => {
                    const score = markdownScore(e);
                    return score == null ? null
                        : { text: String(score), button: true, attrs: { 'data-modal': 'markdown', 'data-path': e.path } };
                },
            },
            {
                key: 'type', th: 'Type', thClass: 'is-center',
                sort: { type: 'number', dir: 'asc', value: e => e.type === 'WYSIWYG' ? 0 : 1 },   // ▲ B (WYSIWYG) then Code
                make: e => {
                    const t = typeInfo(e.type);
                    return t ? { icons: t.icon, button: true, className: 'badge--type', attrs: { 'data-modal': 'type' } } : null;
                },
            },
            {
                key: 'maintainer', th: 'Developer', textInTable: true,
                sort: { type: 'text', value: e => e.maintainer?.name || '' },
                make: e => e.maintainer?.name ? { prefix: "by ", text: e.maintainer.name, link: e.maintainer.url } : null,
            },
            {
                key: 'price', th: 'Price', textInTable: true,
                sort: { type: 'text', value: e => e.paidAddons ? 'Paid' : 'Free' },
                make: e => e.paidAddons ? { text: 'Paid add-on', link: e.paidAddonsUrl } : { text: 'Free' },
            },
            {
                key: 'status', th: 'Status', textInTable: true,
                sort: { type: 'number', dir: 'asc', value: e => isActive(e) ? 0 : 1 },   // ▲ Active then Inactive
                make: e => e.lastRelease ? { text: isActive(e) ? 'Active' : 'Inactive', link: `${e.npm}?activeTab=versions` } : null,
            },
            {
                key: 'frameworks', th: 'Frameworks', textInTable: true,
                sort: {
                    type: 'number', value: e => Array.isArray(e.frameworks) ? e.frameworks.length : 0,
                    // Equal counts: order alphabetically by the framework names
                    // shown (identical lists fall through to the downloads tie-break).
                    tiebreak: (a, b) => frameworkNames(a).localeCompare(frameworkNames(b), 'en', { sensitivity: 'base' }),
                },
                // One badge per framework; an editor's own integration doc wins
                // over the framework's generic home page (frameworkHref).
                make: e => Array.isArray(e.frameworks)
                    ? e.frameworks.map(fw => ({ text: fw.name, link: frameworkHref(fw), attrs: frameworkTitle(fw) ? { title: frameworkTitle(fw) } : {} }))
                    : null,
            },
            {
                key: 'math', th: 'Math', textInTable: true,
                sort: { type: 'number', value: e => (MD_LEVELS[e.math?.level] || MD_LEVELS.none).points },
                make: e => {
                    const lvl = e.math && MD_LEVELS[e.math.level];
                    return (!lvl || lvl === MD_LEVELS.none) ? null
                        : { prefix: "Math ", text: lvl.label, link: e.math.url };
                },
            },
            {
                key: 'license', th: 'License', textInTable: true,
                sort: { type: 'text', value: e => e.license || '' },
                make: e => e.license ? { text: e.license, link: e.licenseUrl } : null,
            },
            {
                key: 'basedOn', th: 'Based on', textInTable: true,
                sort: { type: 'text', value: e => e.basedOn?.name || '' },
                // The base editor is itself in our list, so link to its website.
                make: e => {
                    const base = e.basedOn;
                    if (!base?.name) return null;
                    return { prefix: 'Based on ', text: base.name, link: editorsByPath.get(base.path)?.website };
                },
            },
            { key: 'website',    th: '', make: e => ({ icons: WEBSITE_ICON, link: e.website }) },
            { key: 'docs',       th: '', make: e => ({ icons: DOCS_ICON, link: e.docs }) },
            { key: 'playground', th: '', make: e => e.playground ? { icons: PLAYGROUND_ICON, link: e.playground } : null },
            // Pop-out to the demo's current variant (full in Full mode, else
            // minimal); data-path keeps the canonical path so toggleEditorMode
            // can re-point links already rendered in the info bars and tables.
            { key: 'standalone', th: '', make: e => ({ icons: STANDALONE_ICON, link: demoUrl(e.path), className: 'badge--standalone', attrs: { 'data-path': e.path } }) },
        ];
        /* ---------- Column sorting ---------- */
        // Each sortable column declares how to read its value and its type, so the
        // comparator sorts numbers numerically and text alphabetically. The badge
        // columns bring their own `sort` (above); the Editor-name column is the one
        // sortable column that isn't a badge.
        const COMPARE_SORTS = {
            name: { type: 'text', value: e => e.name },
            ...Object.fromEntries(BADGES.filter(b => b.sort).map(b => [b.key, b.sort])),
        };

        // Header cells, in column order: the three leading columns (sortable Editor
        // name, the starred ★ marker, then the Demo button) followed by one header
        // per badge. Stays in step with compareRowsHtml(), which walks the same
        // [Editor, Star, Demo, …BADGES].
        const COMPARE_HEAD = [
            { label: 'Editor', sort: 'name' },
            { label: '<span class="sr-only">Starred</span>', cls: 'star-col' },
            { label: '<span class="sr-only">Demo</span>' },
            ...BADGES.map(b => ({ label: b.th, sort: b.sort ? b.key : undefined, cls: b.thClass, col: b.key })),
        ];

        // (Each arena carries its own sortState — see the arena objects.)
        // The two toggles live only under the primary arena's table but are
        // GLOBAL settings: they apply to every arena's compare table, current
        // and future (a fresh trimmed table renders to the state below).
        // Both persist in localStorage ('1' = on) so a reload keeps them.
        // "Show inactive" toggle is off by default, so only active editors
        // appear in every compare table AND in every dropdown menu.
        let showInactive = storage.get('show-inactive') === '1';
        // "Compact view" toggle state — off by default (all columns shown). When on,
        // each table gets an `is-compact` class that hides the lower-priority columns.
        let compactView = storage.get('compact-view') === '1';

        function editorComparator(key, dir) {
            const sort = COMPARE_SORTS[key] || COMPARE_SORTS.downloads;
            const mul = dir === 'asc' ? 1 : -1;
            return (a, b) => {
                const va = sort.value(a), vb = sort.value(b);
                let cmp;
                if (sort.type === 'number') cmp = (Number(va) || 0) - (Number(vb) || 0);
                else cmp = String(va).localeCompare(String(vb), 'en', { sensitivity: 'base' });
                if (cmp) return cmp * mul;
                // A column may define its own fixed tie-break for equal primary
                // values (e.g. Frameworks orders equal counts alphabetically by
                // framework name). Fixed, not flipped with dir, so tied rows keep a
                // stable order whichever way the primary column is sorted.
                if (sort.tiebreak) {
                    const tb = sort.tiebreak(a, b);
                    if (tb) return tb;
                }
                // Same primary value: break the tie by npm weekly downloads (most
                // first), then A→Z by editor name as a last resort. Both are fixed
                // (not flipped with dir) so tied rows keep the same order whichever
                // way the primary column is sorted.
                const dl = (Number(b.npmWeeklyDownloads) || 0) - (Number(a.npmWeeklyDownloads) || 0);
                if (dl) return dl;
                return a.name.localeCompare(b.name);
            };
        }

        // Clicking a header: the same column toggles direction; a new column starts at
        // its natural default (text A→Z, numbers/dates high→low). Each arena's
        // table sorts independently, so this only redraws the clicked one.
        function setSort(arena, key) {
            if (!COMPARE_SORTS[key]) return;
            const sortState = arena.sortState;
            if (sortState.key === key) {
                sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.key = key;
                sortState.dir = COMPARE_SORTS[key].dir || (COMPARE_SORTS[key].type === 'text' ? 'asc' : 'desc');
            }
            refreshCompareTable(arena);
        }

        function compareHeadHtml(arena) {
            const sortState = arena.sortState;
            return COMPARE_HEAD.map(col => {
                const sortable = !!col.sort;
                const active = sortable && col.sort === sortState.key;
                const classes = [col.cls, sortable ? 'is-sortable' : '', active ? 'is-sorted' : ''].filter(Boolean).join(' ');
                const parts = ['scope="col"'];
                if (classes) parts.push(`class="${classes}"`);
                if (col.col) parts.push(`data-col="${col.col}"`);
                if (sortable) parts.push(`data-sort="${col.sort}"`, 'tabindex="0"');
                const arrow = active ? `<span class="sort-ind">${sortState.dir === 'asc' ? '▲' : '▼'}</span>` : '';
                return `<th ${parts.join(' ')}>${col.label}${arrow}</th>`;
            }).join('');
        }

        // Re-draw just the header + rows (whatever sits below stays put).
        function refreshCompareTable(arena) {
            const table = arena.viewport.querySelector('.compare-table');
            if (!table) return;
            table.querySelector('thead tr').innerHTML = compareHeadHtml(arena);
            table.querySelector('tbody').innerHTML = compareRowsHtml(arena);
            wireCompareTable(arena);
        }

        // (Re)attach the header sort handlers, then the shared badge handlers.
        function wireCompareTable(arena) {
            arena.viewport.querySelectorAll('.compare-table th[data-sort]').forEach(th => {
                th.addEventListener('click', () => setSort(arena, th.dataset.sort));
                th.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSort(arena, th.dataset.sort); }
                });
            });
            wireBadges(arena.viewport, arena);
        }

        // Wire the interactive badges within a container (a table or an info
        // bar). Which badge does what is declared by its data-* attribute in
        // BADGES/renderInfo, so both views share one wiring pass: Demo opens the
        // editor in the arena OWNING the container (through the router for the
        // primary, directly for an extra arena), the score/type badges open
        // their explanatory modal — shared, so they work the same from any arena.
        function wireBadges(root, arena) {
            root.querySelectorAll('[data-open]').forEach(el =>
                el.addEventListener('click', () => arena === arenas[0]
                    ? selectByPath(el.dataset.open)
                    : renderExtraSelection(arena, el.dataset.open)));
            root.querySelectorAll('[data-modal="markdown"]').forEach(el =>
                el.addEventListener('click', () => openMarkdownModal(el.dataset.path)));
            root.querySelectorAll('[data-modal="type"]').forEach(el =>
                el.addEventListener('click', openTypeModal));
            // Only the info bar's star pill carries data-star — the table's and
            // dropdown's read-only ★ markers never get this handler.
            root.querySelectorAll('[data-star]').forEach(el =>
                el.addEventListener('click', () => toggleStar(el.dataset.star)));
        }

        // One row: the sticky Editor name, the starred ★ marker, the Demo button,
        // then every badge in BADGES order — rendered through the same
        // badge()/badgesHtml() the info bar uses, so the two views stay identical.
        function compareRowsHtml(arena) {
            // Show-inactive is a global setting — visibleEditors() filters every
            // arena's rows; only the sort order is per-arena.
            return visibleEditors().slice()
                .sort(editorComparator(arena.sortState.key, arena.sortState.dir))
                .map(editor => `
                    <tr>
                        <td><span class="compare-name">${editor.icon ? `<img src="${editor.icon}" alt="" />` : ''}${editor.name}</span></td>
                        <td class="star-col">${starMarkHtml(editor)}</td>
                        <td>${badge({ text: 'Demo', button: true, attrs: { 'data-open': editor.path } })}</td>
                        ${BADGES.map(b => `<td${b.thClass ? ` class="${b.thClass}"` : ''} data-col="${b.key}">${(b.textInTable ? badgeText : badgesHtml)(b.make(editor))}</td>`).join('')}
                    </tr>`).join('');
        }

        // Editors that exist but aren't shipped as a runnable demo here (e.g. a
        // commercial-only core, or too new to have Markdown support). Rendered under
        // the table; each carries its own `reason` for being left out, plus optional
        // licence / website links. Driven by editors.json's optional `omitted` list.
        function omittedSectionHtml() {
            if (!omittedList.length) return '';
            const rows = omittedList.map(e => {
                const icon = e.icon ? `<img class="omit-icon" src="${e.icon}" alt="" />` : '';
                const reason = { text: e.reason, link: e.reasonUrl };
                const website = { icons: WEBSITE_ICON, link: e.website };
                return `<li>${icon}<strong>${e.name}</strong>: ${badgeText(reason)} ${badge(website)}</li>`;
            }).join('');
            return `
                    <h2 class="compare__heading">Editors omitted</h2>
                    <p class="compare__note">Editors that are not listed here:</p>
                    <ul class="compare__note compare__benefits">${rows}</ul>`;
        }

        // Some WYSIWYG editors also ship a plain code/Markdown source mode that these
        // demos don't surface. Listed here (from each editor's optional `codeVersion`)
        // so the omission is explicit. Ordered like the table (by weekly downloads).
        function codeVersionSectionHtml() {
            const withCode = editorList.filter(e => e.codeVersion);
            if (!withCode.length) return '';
            const rows = withCode.map(e => {
                const icon = e.icon ? `<img class="omit-icon" src="${e.icon}" alt="" />` : '';
                const label = badgeText({ text: e.codeVersion.via, link: e.codeVersion.url });
                return `<li>${icon}<strong>${e.name}</strong>${label ? `: ${label}` : ''}</li>`;
            }).join('');
            return `
                    <h2 class="compare__heading">Notes</h2>
                    <p class="compare__note">These editors also have a code or Markdown style version, which has been omitted in the table for simplicity:</p>
                    <ul class="compare__note compare__benefits">${rows}</ul>`;
        }

        // The comparison view. Every arena shares the top part — the caption
        // and the sortable table, whose Demo buttons pick the owning arena's
        // editor — but only the PRIMARY arena gets the toggles and the notes
        // sections below it; an extra arena shows just this trimmed table.
        function renderComparison(arena) {
            // Tear down any editor that was previously mounted in the viewport.
            teardownDemo(arena);
            const isPrimary = arena === arenas[0];

            // Caption + table, common to both views. The compact-view setting
            // is global, so every arena's table honours it at build time.
            const tableHtml = `
                    <p class="compare__caption">Press <strong>Demo</strong> to view a live editor.</p>
                    <div class="compare__scroll">
                    <table class="compare-table${compactView ? ' is-compact' : ''}">
                        <thead>
                            <tr>${compareHeadHtml(arena)}</tr>
                        </thead>
                        <tbody>${compareRowsHtml(arena)}</tbody>
                    </table>
                    </div>`;

            arena.viewport.innerHTML = `
                <div class="compare">${tableHtml}${!isPrimary ? '' : `
                    <div class="compare__controls">
                        <label class="compare-toggle">
                            <input type="checkbox" class="compare-toggle__input" id="show-inactive"${showInactive ? ' checked' : ''}>
                            <span class="compare-toggle__track"><span class="compare-toggle__thumb"></span></span>
                            <span class="compare-toggle__label">Show inactive</span>
                        </label>
                        <span class="compare__controls-hint">(Last release &gt; 1 year)</span>
                    </div>
                    <div class="compare__controls">
                        <label class="compare-toggle">
                            <input type="checkbox" class="compare-toggle__input" id="compact-view"${compactView ? ' checked' : ''}>
                            <span class="compare-toggle__track"><span class="compare-toggle__thumb"></span></span>
                            <span class="compare-toggle__label">Compact view</span>
                        </label>
                    </div>
                    <h2 class="compare__heading">Formatting</h2>
                    <p class="compare__note">
                        The editors format markdown as you type: <code>**bold**</code>
                        either turns into <strong>bold</strong> text or is highlighted as <strong>**bold**</strong>.
                    </p>
                    <h2 class="compare__heading">Benefits of Markdown</h2>
                    <ul class="compare__note compare__benefits">
                        <li><strong>Future-proof</strong>: store markdown in your database and you can switch editors later without converting any data.</li>
                        <li><strong>Versionable</strong>: diffs and merges nicely in version control.</li>
                        <li><strong>AI-ready</strong>: markdown is the native format LLMs read and write, so AI features just work.</li>
                    </ul>
                    ${omittedSectionHtml()}
                    ${codeVersionSectionHtml()}
                    <h2 class="compare__heading">Card game</h2>
                    <p class="compare__note">There's also a <a class="compare-link" href="game/">card game</a>: play your deck's stats against the computer.</p>
                    <h2 class="compare__heading">Feedback</h2>
                    <p class="compare__note">I've created this website when I was looking for a markdown editor myself.<br>Please let me know any additional features / missing editors / other feedback.</p>
                    <ul class="compare__note compare__benefits">
                        <li><a class="compare-link" href="https://github.com/wilmersdorf/MarkdownArena" target="_blank" rel="noopener">Open an issue on GitHub</a></li>
                        <li><a class="compare-link" href="mailto:info@markdownarena.com">Mail info@markdownarena.com</a></li>
                        <li><a class="compare-link" href="https://x.com/wilmers_dorf" target="_blank" rel="noopener">Message me on X</a></li>
                    </ul>`}
                </div>`;

            wireCompareTable(arena);

            if (!isPrimary) return;   // the toggles below exist only in the full view

            // The controls live outside the table, so refreshCompareTable() (which
            // only redraws thead/tbody) leaves them intact — wire them once here.
            // Both settings are global: a change re-applies to EVERY arena that
            // currently shows a compare table (arenas showing a demo have no
            // table and are skipped — they pick the state up when they return
            // to the compare view).
            primaryViewport.querySelector('#show-inactive').addEventListener('change', (e) => {
                showInactive = e.target.checked;
                storage.set('show-inactive', showInactive ? '1' : '0');
                arenas.forEach(refreshCompareTable);   // its !table guard skips demos
                // The dropdowns list the same filtered set — rebuild each arena's
                // options, re-marking whatever selection the new list still contains
                // (an arena showing a now-hidden inactive demo keeps its label; its
                // option simply drops out of the menu).
                arenas.forEach(a => {
                    const selected = a.dropdown.options.find(o => o.classList.contains('is-selected'))?.dataset.value;
                    a.dropdown.setOptions(visibleEditors(), { withCompare: true });
                    if (selected) a.dropdown.setSelected(selected);
                });
            });

            // Compact view is pure presentation (CSS hides the tagged columns), so we
            // just toggle the class on each table — no need to rebuild the rows.
            primaryViewport.querySelector('#compact-view').addEventListener('change', (e) => {
                compactView = e.target.checked;
                storage.set('compact-view', compactView ? '1' : '0');
                arenas.forEach(a => {
                    const table = a.viewport.querySelector('.compare-table');
                    if (table) table.classList.toggle('is-compact', compactView);
                });
            });
        }

        /* ---------- Editor loading ---------- */
        // Every demo runs in its own same-origin <iframe>: a separate document
        // with its own module registry and its own <script type="importmap">,
        // parsed before any of the demo's modules load — exactly as if the
        // standalone page were opened directly. Demos therefore can't interfere
        // with each other or with this page (no shared globals, no shared module
        // cache, any import map welcome), and no import map is ever added to an
        // already-running document — which is what used to log "an import map is
        // added after module script load" warnings on every switch.
        // A fresh frame is created per view (never reusing one via .src), so
        // switching adds no iframe history entries and Back/Forward stay on the
        // ?editor=<slug> routing above.
        function loadEditor(arena, targetPath) {
            teardownDemo(arena);   // removing the previous frame disposes that demo

            const frame = document.createElement('iframe');
            frame.className = 'demo-frame';
            frame.src = demoPath(targetPath);
            frame.addEventListener('load', () => {
                const doc = frame.contentDocument;
                if (!doc || !doc.documentElement) return;

                // Grow the frame with the demo's content so the window scrolls
                // as one page (the frame never gets an inner scrollbar of its
                // own). The observer re-fits on every reflow inside the demo —
                // editors mount asynchronously from a CDN and resize as you type.
                const fit = () => {
                    frame.style.height = doc.documentElement.scrollHeight + 'px';
                };
                arena.frameObserver = new ResizeObserver(fit);
                arena.frameObserver.observe(doc.documentElement);
                if (doc.body) arena.frameObserver.observe(doc.body);
                fit();

                // Keyboard shortcuts + dropdown click-away must keep working
                // while the user is typing/clicking inside the demo document.
                wireAppShortcuts(doc);
                // Any arena's menu may be open while this iframe is interacted
                // with (the outer document's click-away listeners never see
                // clicks inside an iframe), so close whichever one is open.
                doc.addEventListener('mousedown', closeAllMenus, true);
            });
            arena.viewport.appendChild(frame);
        }

        /* ---------- Share button ---------- */
        // Use the native share sheet when available (mostly mobile); otherwise
        // copy the page URL to the clipboard and flash a confirmation.
        const shareBtn = document.getElementById('share-btn');
        shareBtn.addEventListener('click', async () => {
            const url = location.href;
            if (navigator.share) {
                try {
                    await navigator.share({ title: document.title, url });
                } catch (err) { /* user dismissed the share sheet */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(url);
            } catch (err) {
                prompt('Copy this link:', url);
                return;
            }
            shareBtn.classList.add('is-copied');
            shareBtn.title = 'Link copied!';
            setTimeout(() => {
                shareBtn.classList.remove('is-copied');
                shareBtn.title = 'Share';
            }, 1500);
        });

        init();
    </script>

</body>
</html>
