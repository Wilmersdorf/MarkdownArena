<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lexical Standalone</title>
    <style>
        body { margin: 0; }
        .lex-editor { padding-left: 1rem; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="lexical-target" class="lex-editor" contenteditable="true" spellcheck="false"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="lexical-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "@lexical/code": "https://ga.jspm.io/npm:@lexical/code@0.46.0/dist/LexicalCode.prod.mjs",
            "@lexical/history": "https://ga.jspm.io/npm:@lexical/history@0.46.0/dist/LexicalHistory.prod.mjs",
            "@lexical/link": "https://ga.jspm.io/npm:@lexical/link@0.46.0/dist/LexicalLink.prod.mjs",
            "@lexical/list": "https://ga.jspm.io/npm:@lexical/list@0.46.0/dist/LexicalList.prod.mjs",
            "@lexical/markdown": "https://ga.jspm.io/npm:@lexical/markdown@0.46.0/dist/LexicalMarkdown.prod.mjs",
            "@lexical/rich-text": "https://ga.jspm.io/npm:@lexical/rich-text@0.46.0/dist/LexicalRichText.prod.mjs",
            "lexical": "https://ga.jspm.io/npm:lexical@0.46.0/dist/Lexical.prod.mjs"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "@lexical/clipboard": "https://ga.jspm.io/npm:@lexical/clipboard@0.46.0/dist/LexicalClipboard.prod.mjs",
                "@lexical/code-core": "https://ga.jspm.io/npm:@lexical/code-core@0.46.0/dist/LexicalCodeCore.prod.mjs",
                "@lexical/code-prism": "https://ga.jspm.io/npm:@lexical/code-prism@0.46.0/dist/LexicalCodePrism.prod.mjs",
                "@lexical/dragon": "https://ga.jspm.io/npm:@lexical/dragon@0.46.0/dist/LexicalDragon.prod.mjs",
                "@lexical/extension": "https://ga.jspm.io/npm:@lexical/extension@0.46.0/dist/LexicalExtension.prod.mjs",
                "@lexical/html": "https://ga.jspm.io/npm:@lexical/html@0.46.0/dist/LexicalHtml.prod.mjs",
                "@lexical/selection": "https://ga.jspm.io/npm:@lexical/selection@0.46.0/dist/LexicalSelection.prod.mjs",
                "@lexical/utils": "https://ga.jspm.io/npm:@lexical/utils@0.46.0/dist/LexicalUtils.prod.mjs",
                "prismjs": "https://ga.jspm.io/npm:prismjs@1.30.0/prism.js",
                "prismjs/components/": "https://ga.jspm.io/npm:prismjs@1.30.0/components/"
            }
        }
    }
    </script>

    <script type="module">
        // Lexical is framework-agnostic at its core, so this demo wires it up with
        // vanilla JS (no React). Every `@lexical/*` package must share ONE copy of
        // the `lexical` core — node identity is checked with `instanceof`, so two
        // copies would break rich-text/list/code/markdown handling. The import map
        // above pins the whole graph to a single copy of each package.
        import { createEditor, $setSelection } from 'lexical';
        import { registerRichText, HeadingNode, QuoteNode } from '@lexical/rich-text';
        import { registerHistory, createEmptyHistoryState } from '@lexical/history';
        import { ListNode, ListItemNode, registerList } from '@lexical/list';
        import { CodeNode, CodeHighlightNode, registerCodeHighlighting } from '@lexical/code';
        import { LinkNode } from '@lexical/link';
        import {
            $convertFromMarkdownString,
            $convertToMarkdownString,
            TRANSFORMERS,
            registerMarkdownShortcuts,
        } from '@lexical/markdown';

        const output = document.getElementById('lexical-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // No `theme` config: Lexical renders semantic tags (<h1>, <strong>, <ul>, …)
        // on its own; a theme would only add CSS class hooks this unstyled demo
        // doesn't use.
        const editor = createEditor({
            namespace: 'markdown-arena-lexical',
            // Nodes the markdown transformers produce must be registered up front.
            nodes: [HeadingNode, QuoteNode, ListNode, ListItemNode, CodeNode, CodeHighlightNode, LinkNode],
            onError: (error) => { throw error; },
        });

        editor.setRootElement(document.getElementById('lexical-target'));

        // Rich-text behaviour, undo/redo, list keyboard handling, code syntax
        // highlighting, and live Markdown shortcuts (type `## ` etc.).
        registerRichText(editor);
        registerHistory(editor, createEmptyHistoryState(), 300);
        registerList(editor);
        registerCodeHighlighting(editor);
        registerMarkdownShortcuts(editor, TRANSFORMERS);

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Parse Markdown into the editor. We import on every textarea keystroke,
        // which rebuilds the whole document. That marks Lexical's selection dirty,
        // and the reconciler would then force it into the DOM — stealing focus from
        // the textarea (so the next Enter lands in the editor instead). Clearing the
        // selection leaves nothing to reconcile, so focus stays in the textarea.
        const importMarkdown = (md) => {
            $convertFromMarkdownString(md, TRANSFORMERS);
            $setSelection(null);
        };

        // Seed the document from the starting Markdown.
        editor.update(() => importMarkdown(content));

        // Editor -> markdown: re-serialise on every change.
        editor.registerUpdateListener(({ editorState }) => {
            if (syncing) return;
            editorState.read(() => {
                output.value = $convertToMarkdownString(TRANSFORMERS);
            });
        });

        // Markdown -> editor: re-parse the edited text back into the document.
        // The `syncing` flag keeps the update listener from clobbering the textarea
        // (and the caret) while we are the ones driving the change.
        output.addEventListener('input', () => {
            syncing = true;
            editor.update(
                () => importMarkdown(output.value),
                { onUpdate: () => { syncing = false; } },
            );
        });
    </script>

</body>
</html>
