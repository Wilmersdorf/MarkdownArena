<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quill Standalone</title>
    <style>
        body { margin: 0; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="quill-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="quill-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "quill": "https://ga.jspm.io/npm:quill@2.0.3/quill.js",
            "quilljs-markdown": "https://ga.jspm.io/npm:quilljs-markdown@1.2.0/index.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "eventemitter3": "https://ga.jspm.io/npm:eventemitter3@5.0.4/index.mjs",
                "fast-diff": "https://ga.jspm.io/npm:fast-diff@1.3.0/diff.js",
                "lodash-es": "https://ga.jspm.io/npm:lodash-es@4.18.1/lodash.js",
                "lodash.clonedeep": "https://ga.jspm.io/npm:lodash.clonedeep@4.5.0/index.js",
                "lodash.isequal": "https://ga.jspm.io/npm:lodash.isequal@4.5.0/index.js",
                "parchment": "https://ga.jspm.io/npm:parchment@3.0.0/dist/parchment.js",
                "quill-delta": "https://ga.jspm.io/npm:quill-delta@5.1.0/dist/Delta.js",
                "regenerator-runtime": "https://ga.jspm.io/npm:regenerator-runtime@0.13.11/runtime.js"
            }
        }
    }
    </script>
    <script type="module">
        import Quill from 'quill';
        import { marked } from 'marked';
        import TurndownService from 'turndown';
        // Quill has no built-in Markdown shortcuts; this module adds the as-you-type
        // conversion (**x** -> bold, # -> heading, etc.). It only formats the
        // instance passed in below.
        import QuillMarkdown from 'quilljs-markdown';

        // Quill ships its theme as a separate stylesheet, injected from JS. It stays
        // on jsDelivr — the import map above only covers JS modules.
        const themeLink = document.createElement('link');
        themeLink.rel = 'stylesheet';
        themeLink.href = 'https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css';
        document.head.appendChild(themeLink);

        const output = document.getElementById('quill-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // Quill has no native Markdown format — it edits a rich "Delta" document.
        // So we bridge both directions with general-purpose converters:
        //   markdown -> HTML (marked) -> Delta (Quill's own clipboard parser)
        //   Delta -> semantic HTML (Quill) -> markdown (turndown)
        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
        });

        // No toolbar — editing is via keyboard/Markdown only.
        const quill = new Quill('#quill-target', {
            theme: 'snow',
            modules: { toolbar: false },
        });

        // Enable as-you-type Markdown shortcuts (bold, italic, inline code, lists…).
        new QuillMarkdown(quill, {});

        const mdToDelta = (md) => quill.clipboard.convert({ html: marked.parse(md) });

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Quill -> Markdown: serialize the document to semantic HTML, then to Markdown.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown(quill.getSemanticHTML()).trim();
        };

        quill.setContents(mdToDelta(content));
        quill.on('text-change', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        output.addEventListener('input', () => {
            syncing = true;
            quill.setContents(mdToDelta(output.value));
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
