<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill Full</title>
    <!-- Snow theme stylesheet; raw exact-version file from jsDelivr. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
    <!-- KaTeX typesets the formula format; raw exact-version CSS from jsDelivr (fonts load relative to this URL). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <style>
        body { margin: 0; }

        /* Editor grows with the page — no inner scroll. The native snow chrome
           (bordered toolbar + container) sits flush at the edges; the toolbar and
           .ql-editor keep their own inside padding. */
        .ql-container.ql-snow { height: auto; }
        .ql-editor { overflow-y: visible; }
        .ql-editor > :first-child { margin-top: 0; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
    <!-- The formula format needs window.katex before the editor initializes;
         load KaTeX as a classic script (runs during parse, before the module). -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
</head>
<body>

    <div id="quill-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="quill-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "quill": "https://ga.jspm.io/npm:quill@2.0.3/quill.js",
            "quilljs-markdown": "https://ga.jspm.io/npm:quilljs-markdown@1.2.0/index.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "eventemitter3": "https://ga.jspm.io/npm:eventemitter3@5.0.4/index.mjs",
                "fast-diff": "https://ga.jspm.io/npm:fast-diff@1.3.0/diff.js",
                "lodash-es": "https://ga.jspm.io/npm:lodash-es@4.18.1/lodash.js",
                "lodash.clonedeep": "https://ga.jspm.io/npm:lodash.clonedeep@4.5.0/index.js",
                "lodash.isequal": "https://ga.jspm.io/npm:lodash.isequal@4.5.0/index.js",
                "parchment": "https://ga.jspm.io/npm:parchment@3.0.0/dist/parchment.js",
                "quill-delta": "https://ga.jspm.io/npm:quill-delta@5.1.0/dist/Delta.js",
                "regenerator-runtime": "https://ga.jspm.io/npm:regenerator-runtime@0.13.11/runtime.js"
            }
        }
    }
    </script>
    <script type="module">
        import Quill from 'quill';
        import { marked } from 'marked';
        import TurndownService from 'turndown';
        // Quill has no built-in Markdown shortcuts; this module adds the as-you-type
        // conversion (**x** -> bold, # -> heading, etc.). It only formats the
        // instance passed in below.
        import QuillMarkdown from 'quilljs-markdown';

        const output = document.getElementById('quill-markdown-output');

        // Quill edits a Delta (a JSON document), not Markdown or HTML, so we bridge
        // both directions with general-purpose converters:
        //   markdown -> HTML (marked) -> Delta (Quill's own clipboard parser)
        //   Delta -> semantic HTML (Quill) -> markdown (turndown)
        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
        });
        // Quill serializes strike as <s>; keep it in the markdown round-trip.
        turndown.addRule('strikethrough', {
            filter: ['del', 's', 'strike'],
            replacement: (content) => '~~' + content + '~~',
        });

        // Official "Full" toolbar (quilljs.com/docs/modules/toolbar). Quill's toolbar
        // module builds this markup itself and styles it via quill.snow.css.
        const toolbarOptions = [
            ['bold', 'italic', 'underline', 'strike'],
            ['blockquote', 'code-block'],
            ['link', 'image', 'video', 'formula'],

            [{ 'header': 1 }, { 'header': 2 }],
            [{ 'list': 'ordered' }, { 'list': 'bullet' }, { 'list': 'check' }],
            [{ 'script': 'sub' }, { 'script': 'super' }],
            [{ 'indent': '-1' }, { 'indent': '+1' }],
            [{ 'direction': 'rtl' }],

            [{ 'size': ['small', false, 'large', 'huge'] }],
            [{ 'header': [1, 2, 3, 4, 5, 6, false] }],

            [{ 'color': [] }, { 'background': [] }],
            [{ 'font': [] }],
            [{ 'align': [] }],

            ['clean'],
        ];

        const quill = new Quill('#quill-target', {
            theme: 'snow',
            modules: { toolbar: toolbarOptions },
        });

        // Enable as-you-type Markdown shortcuts (bold, italic, inline code, lists…).
        new QuillMarkdown(quill, {});

        // Quill maps <s> to strike; marked emits <del> for ~~text~~, so normalize it.
        const mdToDelta = (md) => {
            const html = marked.parse(md).replace(/<del>/g, '<s>').replace(/<\/del>/g, '</s>');
            return quill.clipboard.convert({ html });
        };

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Quill -> Markdown: serialize the document to semantic HTML, then to Markdown.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown(quill.getSemanticHTML()).trim();
        };

        const content = [
            '# Quill full demo',
            '',
            'A paragraph with **bold**, *italic*, <u>underline</u>, ~~strike~~, `inline code`,',
            'and a [link](https://quilljs.com).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '### Quote and code',
            '',
            '> A blockquote to make a point.',
            '',
            '```js',
            "console.log('Hello, Quill!')",
            '```',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            'Below: formats Markdown can’t carry, inserted through the Quill API.',
        ].join('\n');

        quill.setContents(mdToDelta(content));

        // Showcase formats with no Markdown syntax (color, background, sub/super,
        // size, font, align, formula, check list) by appending them via the API.
        // A newline's attributes format the line preceding it, so each line ends
        // with an endLine() carrying that line's block format.
        let i = quill.getLength() - 1;
        const put = (text, fmt) => { quill.insertText(i, text, fmt || {}, 'api'); i += text.length; };
        const endLine = (fmt) => { quill.insertText(i, '\n', fmt || {}, 'api'); i += 1; };

        endLine({});
        put('Rich inline formats: ', { bold: true });
        put('color', { color: '#e60000' });
        put(' · ', {});
        put('background', { background: '#ffff00' });
        put(' · H', {});
        put('2', { script: 'sub' });
        put('O · E = mc', {});
        put('2', { script: 'super' });
        endLine({});

        put('Centered · large · serif', { size: 'large', font: 'serif' });
        endLine({ align: 'center' });

        put('Euler’s identity: ', {});
        quill.insertEmbed(i, 'formula', 'e^{i\\pi}+1=0', 'api'); i += 1;
        endLine({});

        put('Ship the demo', {});
        endLine({ list: 'checked' });
        put('Add more features', {});
        endLine({ list: 'unchecked' });

        quill.on('text-change', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        output.addEventListener('input', () => {
            syncing = true;
            quill.setContents(mdToDelta(output.value));
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
