        // React plus the novel package as bare specifiers, resolved through the
        // import map above to one exact-version copy of every package in the
        // graph. Novel ships no Markdown parser/serializer of its own, so the
        // community tiptap-markdown extension rides along in the same editor.
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { EditorRoot, EditorContent, StarterKit, TiptapLink, Placeholder } from 'novel';
        import { Markdown } from 'tiptap-markdown';

        const h = React.createElement;
        const output = document.getElementById('novel-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',

            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // StarterKit (re-exported by novel) supplies the schema plus the '# ',
        // '- ', '**bold**' input rules — but not links, so TiptapLink joins it;
        // tiptap-markdown parses Markdown into the document and serializes it back.
        const extensions = [
            StarterKit,
            TiptapLink,
            Placeholder.configure({ placeholder: 'Write Markdown…' }),
            Markdown,
        ];

        let tiptap = null; // the TipTap editor behind Novel's provider
        const renderMarkdown = (editor) => {
            output.value = editor.storage.markdown.getMarkdown();
        };

        function App() {
            return h(EditorRoot, null,
                h(EditorContent, {
                    extensions,
                    initialContent: content, // parsed as Markdown by the extension
                    onCreate: ({ editor }) => { tiptap = editor; renderMarkdown(editor); },
                    onUpdate: ({ editor }) => renderMarkdown(editor),
                }),
            );
        }

        createRoot(document.getElementById('novel-target')).render(h(App));

        // Markdown -> editor: re-parse the edited text back into the document.
        // emitUpdate stays false, so onUpdate never fires and nothing echoes back
        // into the textarea (which would clobber the caret mid-typing).
        output.addEventListener('input', () => {
            if (tiptap) tiptap.commands.setContent(output.value, false);
        });
    </script>

</body>
</html>
