             live --mantine-* CSS variables are injected at runtime by BlockNote's
             MantineProvider; this bundle also carries static fallbacks).
           - @blocknote/core dist/style.css: core editor + default light/dark theme vars.
           - @blocknote/react dist/style.css: the React view (side menu, content, etc.).
         The mantine-specific BlockNote rules (.bn-mantine toolbar/menu/panel styling) live
         only in @blocknote/mantine/src/blocknoteStyles.css, which is fetched and injected
         from the module script below (its one bare @import can't resolve via a <link>). -->

        html {

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body { margin: 0; }

        /* BlockNote grows with the page; keep the editor from imposing its own scroll. */
        .bn-container, .bn-editor { height: auto; }

        /* BlockNote's hover side menu (drag handle + "+") sits in the editor's left
           padding gutter; the native 54px leaves it only ~6px from the viewport
           edge, so widen the left pad just enough for it to clear >= 1rem. */
        .bn-editor { padding-left: 68px; }

        /* Markdown round-trip panel — matches the other editor demos. */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>

    <script type="module">
        // @blocknote/react provides the useCreateBlockNote() hook; @blocknote/mantine
        // provides BlockNoteView — the OFFICIAL default theme with the full built-in UI
        // (selection formatting toolbar, "/" slash menu, hover side menu + drag handle,
        // link toolbar, image panel, table handles, emoji picker). The import map pins
        // one shared react/react-dom, so createRoot and BlockNote share a single copy.
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { useCreateBlockNote } from '@blocknote/react';
        import { BlockNoteView } from '@blocknote/mantine';

        const { useEffect, useRef, useState, useCallback } = React;
        const h = React.createElement;

        // The mantine-specific BlockNote UI rules (.bn-mantine toolbar/menu/panel/table
        // handles) ship only in @blocknote/mantine/src/blocknoteStyles.css. That file's
        // first line is a bare `@import "@blocknote/react/style.css"` that a browser can't
        // resolve (it 404s, which would be a console error), so fetch the file, drop the
        // @import line — @blocknote/react's styles already load via the <link> above — and
        // inject the rest as a <style>.
        fetch('https://cdn.jsdelivr.net/npm/@blocknote/mantine@0.51.4/src/blocknoteStyles.css')
            .then((r) => r.text())
            .then((css) => {
                const style = document.createElement('style');
                style.textContent = css.replace(/@import[^;]+;/g, '');
                document.head.appendChild(style);
            });

        /* Rich seed document exercising the full default schema: headings, every inline
           style (bold/italic/underline/strike/code + text & background color), links,
           bullet/numbered lists with nesting, a check list, a table, an image with a
           caption, a quote, and a syntax-highlighted code block. */
        const initialContent = [
            { type: 'heading', props: { level: 1 }, content: 'BlockNote full demo' },
            {
                type: 'paragraph',
                content: [
                    { type: 'text', text: 'A paragraph with ', styles: {} },
                    { type: 'text', text: 'bold', styles: { bold: true } },
                    { type: 'text', text: ', ', styles: {} },
                    { type: 'text', text: 'italic', styles: { italic: true } },
                    { type: 'text', text: ', ', styles: {} },
                    { type: 'text', text: 'underline', styles: { underline: true } },
                    { type: 'text', text: ', ', styles: {} },
                    { type: 'text', text: 'strike', styles: { strike: true } },
                    { type: 'text', text: ', ', styles: {} },
                    { type: 'text', text: 'code', styles: { code: true } },
                    { type: 'text', text: ', ', styles: {} },
                    { type: 'text', text: 'colored text', styles: { textColor: 'red', backgroundColor: 'blue' } },
                    { type: 'text', text: ', and a ', styles: {} },
                    { type: 'link', href: 'https://www.blocknotejs.org', content: [{ type: 'text', text: 'link', styles: {} }] },
                    { type: 'text', text: '.', styles: {} },
                ],
            },
            { type: 'heading', props: { level: 2 }, content: 'Lists' },
            {
                type: 'bulletListItem',
                content: 'Bullet one',
                children: [{ type: 'bulletListItem', content: 'Nested bullet' }],
            },
            { type: 'bulletListItem', content: 'Bullet two' },
            { type: 'numberedListItem', content: 'First' },
            { type: 'numberedListItem', content: 'Second' },
            { type: 'checkListItem', props: { checked: true }, content: 'Write the demo' },
            { type: 'checkListItem', props: { checked: false }, content: 'Ship it' },
            { type: 'heading', props: { level: 2 }, content: 'Table' },
            {
                type: 'table',
                content: {
                    type: 'tableContent',
                    rows: [
                        { cells: ['Name', 'Role', 'Age'] },
                        { cells: ['Ada', 'Engineer', '36'] },
                        { cells: ['Alan', 'Mathematician', '41'] },
                    ],
                },
            },
            { type: 'heading', props: { level: 2 }, content: 'Media, quote & code' },
            { type: 'image', props: { url: 'https://markdownarena.com/600x200.png', caption: 'A placeholder image' } },
            { type: 'quote', content: 'A blockquote with a point to make.' },
            { type: 'codeBlock', props: { language: 'javascript' }, content: "console.log('Hello, Markdown!')" },
            { type: 'paragraph', content: 'Type "/" for the slash menu, or select text for the formatting toolbar.' },
        ];

        /* ===================== Markdown <-> BlockNote =====================
           BlockNote's first-party (deliberately "lossy") converters bridge Markdown both
           ways: blocksToMarkdownLossy() blocks -> Markdown and tryParseMarkdownToBlocks()
           Markdown -> blocks. Both are async, so the echo is guarded with `syncing`.
           Lossy round-trips are expected — text/background color, the underline mark and
           image captions have no Markdown representation and drop on serialize. */

        function App() {
            const editor = useCreateBlockNote({ initialContent });
            const syncing = useRef(false);
            const [md, setMd] = useState('');

            // editor document -> Markdown (skipped while a textarea-driven edit is in flight).
            const serialize = useCallback(async () => {
                const out = await editor.blocksToMarkdownLossy(editor.document);
                if (!syncing.current) setMd(out);
            }, [editor]);

            // Fill the textarea from the seeded document once, after mount.
            useEffect(() => {
                let alive = true;
                (async () => {
                    const out = await editor.blocksToMarkdownLossy(editor.document);
                    if (alive) setMd(out);
                })();
                return () => { alive = false; };
            }, [editor]);

            // editor -> textarea
            const onChange = useCallback(() => {
                if (!syncing.current) serialize();
            }, [serialize]);

            // textarea -> editor: re-parse the edited Markdown back into the document.
            const onMarkdownInput = useCallback((event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                (async () => {
                    const blocks = await editor.tryParseMarkdownToBlocks(text);
                    editor.replaceBlocks(editor.document, blocks);
                    // Release the guard after the resulting onChange has flushed so the
                    // editor's own edits resume updating the textarea.
                    requestAnimationFrame(() => { syncing.current = false; });
                })();
            }, [editor]);

            return h(React.Fragment, null,
                h(BlockNoteView, { editor, onChange, theme: 'light' }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'blocknote-markdown-output',
                    rows: 16,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('blocknote-target')).render(h(App));
    </script>

</body>
