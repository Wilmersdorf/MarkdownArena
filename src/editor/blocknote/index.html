    <script type="module">
        // @blocknote/react@0.51.4 exports BOTH the useCreateBlockNote() hook AND the
        // unstyled <BlockNoteViewRaw> view, so this single package covers the editor —
        // no @blocknote/mantine (BlockNoteViewRaw has no Mantine chrome to style).
        // The import map above resolves these bare specifiers and pins one shared
        // react/react-dom@19.1.0, so createRoot and BlockNote share ONE react and
        // ONE react-dom.
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { useCreateBlockNote, BlockNoteViewRaw } from '@blocknote/react';

        const BN = '0.51.4';

        // BlockNote ships its CSS separately and jsDelivr does not inject it, so append
        // it from JS as <link>s. jsDelivr serves raw tarball paths — the package
        // export map's "style.css"/"fonts/inter.css" aliases don't exist there, so link
        // the real dist/src files. @blocknote/core dist/style.css carries the structural
        // styles + the default light/dark theme CSS variables; @blocknote/react
        // dist/style.css styles the React view (BlockNoteViewRaw); plus the Inter font
        // (its url()s resolve relative to src/fonts/, which jsDelivr serves in place).
        [
            `https://cdn.jsdelivr.net/npm/@blocknote/core@${BN}/dist/style.css`,
            `https://cdn.jsdelivr.net/npm/@blocknote/react@${BN}/dist/style.css`,
            `https://cdn.jsdelivr.net/npm/@blocknote/core@${BN}/src/fonts/inter.css`,
        ].forEach((href) => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        });

        const { useEffect, useRef, useState, useCallback } = React;
        const h = React.createElement;

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        /* ===================== Markdown <-> BlockNote =====================
           BlockNote's own (first-party, deliberately "lossy") converters bridge
           Markdown both ways: tryParseMarkdownToBlocks() Markdown -> blocks, and
           blocksToMarkdownLossy() blocks -> Markdown. Both are async, so seeding
           happens in an effect after mount and the echo is guarded with `syncing`. */

        function App() {
            // This demo turns the slash menu off (slashMenu: false below), so override
            // the empty-block placeholder to drop BlockNote's default "type '/' for
            // commands" hint. The editor merges this over its dictionary's placeholders,
            // so only `default` (also the empty-document fallback) needs changing.
            const editor = useCreateBlockNote({ placeholders: { default: 'Enter text…' } });
            const syncing = useRef(false);
            const [md, setMd] = useState('');

            // editor document -> Markdown (skip while a textarea-driven edit is in flight).
            const serialize = useCallback(async () => {
                const out = await editor.blocksToMarkdownLossy(editor.document);
                if (!syncing.current) setMd(out);
            }, [editor]);

            // Seed the sample document after mount. Parsing Markdown is async so it
            // can't be the editor's initialContent — replace the doc once parsed and
            // guard the echo so the resulting onChange doesn't fight the seed.
            useEffect(() => {
                let alive = true;
                (async () => {
                    const blocks = await editor.tryParseMarkdownToBlocks(content);
                    if (!alive) return;
                    syncing.current = true;
                    editor.replaceBlocks(editor.document, blocks);
                    const out = await editor.blocksToMarkdownLossy(editor.document);
                    if (alive) setMd(out);
                    syncing.current = false;
                })();
                return () => { alive = false; };
            }, [editor]);

            // editor -> textarea
            const onChange = useCallback(() => {
                if (syncing.current) return;
                serialize();
            }, [serialize]);

            // textarea -> editor: re-parse the edited Markdown back into the document.
            const onMarkdownInput = useCallback((event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                (async () => {
                    const blocks = await editor.tryParseMarkdownToBlocks(text);
                    editor.replaceBlocks(editor.document, blocks);
                    // Release the guard once the resulting onChange has flushed so the
                    // editor's own edits resume updating the textarea.
                    requestAnimationFrame(() => { syncing.current = false; });
                })();
            }, [editor]);

            return h(React.Fragment, null,
                h(BlockNoteViewRaw, {
                    editor,
                    onChange,
                    theme: 'light',
                    // No toolbars / button bars — keyboard + Markdown only.
                    // BlockNoteViewRaw has no Mantine components suite behind it,
                    // so every default UI overlay is switched off; Markdown input rules
                    // (typing "# ", "- ", "> ", "```", **bold**, etc.) live in the
                    // ProseMirror layer and keep working without any of them.
                    formattingToolbar: false,
                    sideMenu: false,
                    linkToolbar: false,
                    slashMenu: false,
                    emojiPicker: false,
                    filePanel: false,
                    tableHandles: false,
                }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'blocknote-markdown-output',
                    rows: 14,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('blocknote-target')).render(h(App));
    </script>
