<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor.js Full</title>
    <!-- PT Mono is the monospace typeface of Editor.js's official demo page; raw
         exact-version file from jsDelivr (used for code blocks + inline code). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pt-mono@5.2.8/400.css">
    <style>
        /* Editor.js's official example page: white background, system sans stack,
           ~16px content, and a narrow content column Editor.js centers itself. */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                "Helvetica Neue", sans-serif;
            font-size: 16px;
            color: #000;
            background: #fff;
        }

        /* Editor.js caps its content column at 650px and centers it (margin: auto),
           hanging its hover toolbox (the "+" and tune buttons) in the gutter to that
           column's LEFT. Uncap and left-align the column, then pad the holder so the
           toolbox (~58px wide) clears the viewport edge with room to spare. */
        .ce-block__content,
        .ce-toolbar__content { max-width: none; margin-left: 0; margin-right: 0; }
        #editorjs-target { padding: 0 1rem 0 4.75rem; }

        /* Match the official page's monospace choice for code + inline code. */
        .ce-code__textarea,
        code.inline-code {
            font-family: 'PT Mono', Menlo, Monaco, Consolas, 'Courier New', monospace;
        }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: 'PT Mono', Menlo, Monaco, Consolas, 'Courier New', monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="editorjs-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="editorjs-markdown-output" rows="16" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "@editorjs/checklist": "https://ga.jspm.io/npm:@editorjs/checklist@1.6.0/dist/checklist.mjs",
            "@editorjs/code": "https://ga.jspm.io/npm:@editorjs/code@2.9.4/dist/code.mjs",
            "@editorjs/delimiter": "https://ga.jspm.io/npm:@editorjs/delimiter@1.4.2/dist/delimiter.mjs",
            "@editorjs/editorjs": "https://ga.jspm.io/npm:@editorjs/editorjs@2.31.6/dist/editorjs.mjs",
            "@editorjs/header": "https://ga.jspm.io/npm:@editorjs/header@2.8.9/dist/header.mjs",
            "@editorjs/inline-code": "https://ga.jspm.io/npm:@editorjs/inline-code@1.5.2/dist/inline-code.mjs",
            "@editorjs/list": "https://ga.jspm.io/npm:@editorjs/list@1.10.0/dist/list.mjs",
            "@editorjs/marker": "https://ga.jspm.io/npm:@editorjs/marker@1.4.0/dist/marker.mjs",
            "@editorjs/quote": "https://ga.jspm.io/npm:@editorjs/quote@2.7.6/dist/quote.mjs",
            "@editorjs/simple-image": "https://ga.jspm.io/npm:@editorjs/simple-image@1.6.0/dist/simple-image.mjs",
            "@editorjs/table": "https://ga.jspm.io/npm:@editorjs/table@2.4.5/dist/table.mjs",
            "@editorjs/underline": "https://ga.jspm.io/npm:@editorjs/underline@1.2.1/dist/underline.mjs",
            "@editorjs/warning": "https://ga.jspm.io/npm:@editorjs/warning@1.4.1/dist/warning.mjs",
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        }
    }
    </script>
    <script type="module">
        // Editor.js is a block-styled editor whose native format is JSON blocks,
        // NOT Markdown. This "full" demo unions the official kitchen-sink example's
        // tool set (github.com/codex-team/editor.js -> example/example.html): header,
        // simple-image, delimiter, list, checklist, quote, code, table, warning,
        // marker, inline-code — plus underline. The block <-> Markdown mapping is
        // hand-written; Editor.js has no first-party Markdown support.
        import EditorJS from '@editorjs/editorjs';
        import Header from '@editorjs/header';
        // Pin list v1.x: its block data uses plain-string `items`, which round-trips
        // cleanly. (v2 switched to nested { content, items, meta } objects.)
        import List from '@editorjs/list';
        import Checklist from '@editorjs/checklist';
        import Quote from '@editorjs/quote';
        import Warning from '@editorjs/warning';
        import CodeTool from '@editorjs/code';
        import Delimiter from '@editorjs/delimiter';
        import Table from '@editorjs/table';
        import SimpleImage from '@editorjs/simple-image';
        import Marker from '@editorjs/marker';
        import InlineCode from '@editorjs/inline-code';
        import Underline from '@editorjs/underline';
        // General-purpose bridges: marked (md -> HTML) helps build blocks, turndown
        // (HTML -> md) turns each block's inline HTML back into Markdown.
        import { marked } from 'marked';
        import TurndownService from 'turndown';

        const output = document.getElementById('editorjs-markdown-output');

        // Seeded directly as blocks (not Markdown) so every tool is exercised on
        // load — several block types have no Markdown syntax to seed from.
        const seedBlocks = [
            { type: 'header', data: { text: 'Editor.js', level: 1 } },
            { type: 'paragraph', data: { text: 'Meet the block-styled editor. This demo unites its official tools — try editing, press the <b>+</b> button to add a block, or select text for the inline toolbar.' } },
            { type: 'header', data: { text: 'Inline formatting', level: 2 } },
            { type: 'paragraph', data: { text: 'A paragraph with <b>bold</b>, <i>italic</i>, <mark class="cdx-marker">marker highlight</mark>, <u>underline</u>, <code class="inline-code">inline code</code>, and a <a href="https://editorjs.io">link</a>.' } },
            { type: 'header', data: { text: 'Lists', level: 2 } },
            { type: 'list', data: { style: 'unordered', items: ['Block-styled editing', 'Clean JSON output', 'Extensible plugin API'] } },
            { type: 'list', data: { style: 'ordered', items: ['First step', 'Second step', 'Third step'] } },
            { type: 'header', data: { text: 'Checklist', level: 2 } },
            { type: 'checklist', data: { items: [ { text: 'Ship the minimal demo', checked: true }, { text: 'Ship the full demo', checked: false }, { text: 'Celebrate', checked: false } ] } },
            { type: 'header', data: { text: 'Quote', level: 2 } },
            { type: 'quote', data: { text: 'The block-styled editor for the modern web.', caption: 'CodeX', alignment: 'left' } },
            { type: 'header', data: { text: 'Warning', level: 2 } },
            { type: 'warning', data: { title: 'Heads up', message: 'Blocks without a Markdown equivalent (warning, checklist, table) round-trip loosely.' } },
            { type: 'header', data: { text: 'Code', level: 2 } },
            { type: 'code', data: { code: "const editor = new EditorJS({\n  holder: 'editorjs',\n  tools: { header: Header, table: Table }\n});" } },
            { type: 'header', data: { text: 'Table', level: 2 } },
            { type: 'table', data: { withHeadings: true, content: [ ['Tool', 'Purpose'], ['Header', 'Section titles'], ['Table', 'Tabular data'] ] } },
            { type: 'delimiter', data: {} },
            { type: 'header', data: { text: 'Image', level: 2 } },
            { type: 'image', data: { url: 'https://markdownarena.com/600x200.png', caption: 'A placeholder image', withBorder: false, withBackground: false, stretched: false } },
        ];

        // ---- Markdown -> Editor.js blocks -------------------------------------
        // Parse Markdown to HTML with marked, then map each top-level element to a
        // block. Editor.js keeps only a fixed set of inline tags on save, so
        // normalise marked's output to the tags its inline tools emit:
        //   <strong> -> <b>   <em> -> <i>   inline <code> -> <code class="inline-code">
        // <mark class="cdx-marker"> (marker) and <u> (underline) pass through as-is.
        const scratch = document.createElement('div');

        const renameTag = (node, tag) => {
            const el = document.createElement(tag);
            while (node.firstChild) el.appendChild(node.firstChild);
            node.replaceWith(el);
        };

        const normalizeInline = (el) => {
            el.querySelectorAll('strong').forEach((n) => renameTag(n, 'b'));
            el.querySelectorAll('em').forEach((n) => renameTag(n, 'i'));
            el.querySelectorAll('code').forEach((n) => { n.className = 'inline-code'; });
            return el.innerHTML.trim();
        };

        // A list <li> is tight in the sample (bare text); if marked wraps it in a
        // <p> (loose lists), unwrap that so the item is inline HTML, not a block.
        const itemHTML = (li) => {
            const clone = li.cloneNode(true);
            clone.querySelectorAll('input').forEach((n) => n.remove());
            const only = clone.children.length === 1 && clone.firstElementChild && clone.firstElementChild.tagName === 'P'
                ? clone.firstElementChild : clone;
            return normalizeInline(only);
        };

        const cellsOf = (row) => Array.from(row.children).map((c) => normalizeInline(c));

        const mdToBlocks = (md) => {
            scratch.innerHTML = marked.parse(md);
            const blocks = [];
            for (const el of Array.from(scratch.children)) {
                const tag = el.tagName;
                if (/^H[1-6]$/.test(tag)) {
                    blocks.push({ type: 'header', data: { text: normalizeInline(el), level: Math.min(+tag[1], 4) } });
                } else if (tag === 'UL' || tag === 'OL') {
                    const items = Array.from(el.children);
                    // GFM task list (checkbox items) -> checklist; otherwise a list.
                    if (items.some((li) => li.querySelector('input[type="checkbox"]'))) {
                        blocks.push({ type: 'checklist', data: { items: items.map((li) => ({
                            text: itemHTML(li),
                            checked: !!li.querySelector('input[type="checkbox"]:checked, input[type="checkbox"][checked]'),
                        })) } });
                    } else {
                        blocks.push({ type: 'list', data: { style: tag === 'OL' ? 'ordered' : 'unordered', items: items.map(itemHTML) } });
                    }
                } else if (tag === 'BLOCKQUOTE') {
                    const raw = el.textContent.trim();
                    // GitHub-style admonition round-trips back into a warning block.
                    if (/^\[!WARNING\]/i.test(raw)) {
                        const lines = raw.split('\n');
                        blocks.push({ type: 'warning', data: {
                            title: lines[0].replace(/^\[!WARNING\]\s*/i, ''),
                            message: lines.slice(1).join('\n').trim(),
                        } });
                    } else {
                        const inner = el.querySelector('p') || el;
                        blocks.push({ type: 'quote', data: { text: normalizeInline(inner), caption: '', alignment: 'left' } });
                    }
                } else if (tag === 'PRE') {
                    const code = el.querySelector('code') || el;
                    blocks.push({ type: 'code', data: { code: code.textContent.replace(/\n$/, '') } });
                } else if (tag === 'HR') {
                    blocks.push({ type: 'delimiter', data: {} });
                } else if (tag === 'TABLE') {
                    const rows = [];
                    el.querySelectorAll('tr').forEach((tr) => rows.push(cellsOf(tr)));
                    blocks.push({ type: 'table', data: { withHeadings: !!el.querySelector('thead'), content: rows } });
                } else if (tag === 'IMG' || (tag === 'P' && el.children.length === 1 && el.firstElementChild.tagName === 'IMG' && !el.textContent.trim())) {
                    const img = tag === 'IMG' ? el : el.firstElementChild;
                    blocks.push({ type: 'image', data: { url: img.getAttribute('src') || '', caption: img.getAttribute('alt') || '', withBorder: false, withBackground: false, stretched: false } });
                } else if (el.textContent.trim() || el.querySelector('img')) {
                    blocks.push({ type: 'paragraph', data: { text: normalizeInline(el) } });
                }
            }
            return blocks.length ? blocks : [{ type: 'paragraph', data: { text: '' } }];
        };

        // ---- Editor.js blocks -> Markdown -------------------------------------
        const turndown = new TurndownService({
            headingStyle: 'atx',
            bulletListMarker: '-',
            codeBlockStyle: 'fenced',
            emDelimiter: '*',
        });
        // Marks with no Markdown syntax survive as raw inline HTML.
        turndown.keep(['mark', 'u']);
        // Serialize an inline HTML fragment to Markdown (turndown returns a block,
        // so trim). Empty/undefined -> empty string.
        const inlineMd = (html) => turndown.turndown(html || '').trim();

        const blocksToMd = (blocks) => {
            const out = [];
            for (const b of blocks || []) {
                const d = b.data || {};
                switch (b.type) {
                    case 'header': {
                        const lvl = Math.min(Math.max(+d.level || 1, 1), 6);
                        out.push('#'.repeat(lvl) + ' ' + inlineMd(d.text));
                        break;
                    }
                    case 'paragraph':
                        out.push(inlineMd(d.text));
                        break;
                    case 'list': {
                        const ordered = d.style === 'ordered';
                        // v1 items are strings; guard for v2 { content } objects too.
                        const items = (d.items || []).map((it) => typeof it === 'string' ? it : (it && it.content) || '');
                        out.push(items.map((it, i) => (ordered ? `${i + 1}. ` : '- ') + inlineMd(it)).join('\n'));
                        break;
                    }
                    case 'checklist':
                        out.push((d.items || []).map((it) => `- [${it.checked ? 'x' : ' '}] ` + inlineMd(it.text)).join('\n'));
                        break;
                    case 'quote': {
                        // Caption/alignment have no Markdown syntax and are dropped.
                        const text = inlineMd(d.text) || '';
                        out.push(text.split('\n').map((l) => '> ' + l).join('\n'));
                        break;
                    }
                    case 'warning': {
                        // Serialized as a GitHub-style admonition so it round-trips.
                        const lines = ['> [!WARNING] ' + (d.title || '').replace(/\n/g, ' ')];
                        (d.message || '').split('\n').forEach((l) => lines.push('> ' + l));
                        out.push(lines.join('\n'));
                        break;
                    }
                    case 'code':
                        // @editorjs/code stores no language, so the ```js info-string
                        // does not survive the round-trip (emitted as a bare fence).
                        out.push('```\n' + (d.code || '') + '\n```');
                        break;
                    case 'delimiter':
                        out.push('---');
                        break;
                    case 'table': {
                        const rows = (d.content || []).filter((r) => r && r.length);
                        if (!rows.length) break;
                        const cell = (c) => inlineMd(c).replace(/\|/g, '\\|').replace(/\n/g, ' ');
                        const width = rows[0].length;
                        const line = (r) => '| ' + r.map(cell).join(' | ') + ' |';
                        const md = [line(rows[0]), '| ' + Array(width).fill('---').join(' | ') + ' |'];
                        rows.slice(1).forEach((r) => md.push(line(r)));
                        out.push(md.join('\n'));
                        break;
                    }
                    case 'image':
                        out.push(`![${(d.caption || '').replace(/\n/g, ' ')}](${d.url || ''})`);
                        break;
                    default:
                        if (d.text) out.push(inlineMd(d.text));
                }
            }
            return out.join('\n\n');
        };

        // ---- Editor + two-way sync --------------------------------------------
        let syncing = false;      // guards the editor -> md -> editor echo
        let renderTimer;

        // Editor -> textarea. Skip while the user is typing IN the textarea
        // (activeElement) or while we're programmatically re-rendering the editor.
        const renderMarkdown = async () => {
            if (syncing || document.activeElement === output) return;
            const data = await editor.save();
            output.value = blocksToMd(data.blocks);
        };
        const scheduleRender = () => { clearTimeout(renderTimer); renderTimer = setTimeout(renderMarkdown, 250); };

        const editor = new EditorJS({
            holder: 'editorjs-target',
            minHeight: 40,
            // Editor.js's own "+" toolbox, block tunes and selection inline toolbar
            // ARE its interface — no hand-built menu bar needed. Tools + configs
            // mirror the official example (linkTool omitted: it needs a backend).
            tools: {
                header: { class: Header, inlineToolbar: ['marker', 'link'], config: { placeholder: 'Header', levels: [1, 2, 3, 4], defaultLevel: 2 }, shortcut: 'CMD+SHIFT+H' },
                image: SimpleImage,
                list: { class: List, inlineToolbar: true, shortcut: 'CMD+SHIFT+L' },
                checklist: { class: Checklist, inlineToolbar: true },
                quote: { class: Quote, inlineToolbar: true, config: { quotePlaceholder: 'Enter a quote', captionPlaceholder: "Quote's author" }, shortcut: 'CMD+SHIFT+O' },
                warning: Warning,
                marker: { class: Marker, shortcut: 'CMD+SHIFT+M' },
                code: { class: CodeTool, shortcut: 'CMD+SHIFT+C' },
                delimiter: Delimiter,
                inlineCode: { class: InlineCode },
                underline: { class: Underline },
                table: { class: Table, inlineToolbar: true, shortcut: 'CMD+ALT+T' },
            },
            data: { blocks: seedBlocks },
            onChange: scheduleRender,
        });

        await editor.isReady;
        renderMarkdown();

        // Textarea -> editor. Debounce, then rebuild the blocks. `syncing` (held a
        // beat past the async render) swallows the onChange this triggers.
        let inputTimer;
        output.addEventListener('input', () => {
            clearTimeout(inputTimer);
            inputTimer = setTimeout(async () => {
                syncing = true;
                try {
                    await editor.render({ blocks: mdToBlocks(output.value) });
                } finally {
                    setTimeout(() => { syncing = false; }, 80);
                }
            }, 250);
        });
    </script>

</body>
</html>
