        import { languages } from '@codemirror/language-data';

        const output = document.getElementById('cm-markdown-output');

        const content = [
            '# CodeMirror — full Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, ~~strikethrough~~,',
            'and a [link](https://example.com).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '## Table',
            '',
            '| Name | Role          | Age |',
            '| ---- | ------------- | --- |',
            '| Ada  | Engineer      | 36  |',
            '| Alan | Mathematician | 41  |',
            '',
            '## Blockquote and image',
            '',
            '> A blockquote with a point to make.',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Math (plain source)',
            '',
            'The identity $e^{i\\pi} + 1 = 0$ is famous, and $\\sqrt{2}$ stays inline.',
            '',
            '$$\\int_a^b x^2 \\,dx$$',
            '',
            '## Fenced code — highlighted per language',
            '',
            '```js',
            'const greet = (name) => `Hello, ${name}!`;',
            "console.log(greet('Markdown'));",
            '```',
            '',
            '```python',
            'def greet(name):',
            '    return f"Hello, {name}!"',
            '',
            'print(greet("Markdown"))',
            '```',
            '',
            '```latex',
            '\\documentclass{article}',
            '\\begin{document}',
            '\\[ E = mc^2 \\]',
            '\\end{document}',
            '```',
            '',
            '---',
        ].join('\n');

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // CodeMirror edits plain text, so the document *is* the Markdown export.
        const renderMarkdown = (state) => {
            if (syncing) return;
            output.value = state.doc.toString();
        };

        const view = new EditorView({
            doc: content,
            extensions: [
                basicSetup,
                // GFM base highlights tables/task lists/strikethrough; language-data
                // lazy-loads a highlighter per fenced-code language (js, python, latex…).
                markdown({ base: markdownLanguage, codeLanguages: languages }),
                EditorView.lineWrapping,
                EditorView.updateListener.of((update) => {
                    if (update.docChanged) renderMarkdown(update.state);
                }),
            ],
            parent: document.getElementById('cm-target'),
        });

        // Markdown -> editor: replace the whole document with the edited text.
        output.addEventListener('input', () => {
            syncing = true;
            view.dispatch({
                changes: { from: 0, to: view.state.doc.length, insert: output.value },
            });
            syncing = false;
        });

        renderMarkdown(view.state);
    </script>

</body>
</html>
