<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeMirror Standalone</title>
    <style>
        body { margin: 0; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="cm-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="cm-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "@codemirror/lang-markdown": "https://ga.jspm.io/npm:@codemirror/lang-markdown@6.5.0/dist/index.js",
            "codemirror": "https://ga.jspm.io/npm:codemirror@6.0.2/dist/index.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "@codemirror/autocomplete": "https://ga.jspm.io/npm:@codemirror/autocomplete@6.20.3/dist/index.js",
                "@codemirror/commands": "https://ga.jspm.io/npm:@codemirror/commands@6.10.4/dist/index.js",
                "@codemirror/lang-css": "https://ga.jspm.io/npm:@codemirror/lang-css@6.3.1/dist/index.js",
                "@codemirror/lang-html": "https://ga.jspm.io/npm:@codemirror/lang-html@6.4.11/dist/index.js",
                "@codemirror/lang-javascript": "https://ga.jspm.io/npm:@codemirror/lang-javascript@6.2.5/dist/index.js",
                "@codemirror/language": "https://ga.jspm.io/npm:@codemirror/language@6.12.4/dist/index.js",
                "@codemirror/lint": "https://ga.jspm.io/npm:@codemirror/lint@6.9.7/dist/index.js",
                "@codemirror/search": "https://ga.jspm.io/npm:@codemirror/search@6.7.1/dist/index.js",
                "@codemirror/state": "https://ga.jspm.io/npm:@codemirror/state@6.7.0/dist/index.js",
                "@codemirror/view": "https://ga.jspm.io/npm:@codemirror/view@6.43.5/dist/index.js",
                "@lezer/common": "https://ga.jspm.io/npm:@lezer/common@1.5.2/dist/index.js",
                "@lezer/css": "https://ga.jspm.io/npm:@lezer/css@1.3.4/dist/index.js",
                "@lezer/highlight": "https://ga.jspm.io/npm:@lezer/highlight@1.2.3/dist/index.js",
                "@lezer/html": "https://ga.jspm.io/npm:@lezer/html@1.3.13/dist/index.js",
                "@lezer/javascript": "https://ga.jspm.io/npm:@lezer/javascript@1.5.4/dist/index.js",
                "@lezer/lr": "https://ga.jspm.io/npm:@lezer/lr@1.4.10/dist/index.js",
                "@lezer/markdown": "https://ga.jspm.io/npm:@lezer/markdown@1.6.4/dist/index.js",
                "@marijn/find-cluster-break": "https://ga.jspm.io/npm:@marijn/find-cluster-break@1.0.3/src/index.js",
                "crelt": "https://ga.jspm.io/npm:crelt@1.0.7/index.js",
                "style-mod": "https://ga.jspm.io/npm:style-mod@4.1.3/src/style-mod.js",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
            }
        }
    }
    </script>

    <script type="module">
        import { EditorView, basicSetup } from 'codemirror';
        import { markdown } from '@codemirror/lang-markdown';

        const output = document.getElementById('cm-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // CodeMirror edits plain text, so the document *is* the Markdown export.
        const renderMarkdown = (state) => {
            if (syncing) return;
            output.value = state.doc.toString();
        };

        const view = new EditorView({
            doc: content,
            extensions: [
                basicSetup,
                markdown(),
                EditorView.lineWrapping,
                EditorView.updateListener.of((update) => {
                    if (update.docChanged) renderMarkdown(update.state);
                }),
            ],
            parent: document.getElementById('cm-target'),
        });

        // Markdown -> editor: replace the whole document with the edited text.
        output.addEventListener('input', () => {
            syncing = true;
            view.dispatch({
                changes: { from: 0, to: view.state.doc.length, insert: output.value },
            });
            syncing = false;
        });

        renderMarkdown(view.state);
    </script>

</body>
</html>
