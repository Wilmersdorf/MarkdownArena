    <title>Milkdown Standalone</title>
    <style>
        body { margin: 0; }
        /* @milkdown/kit is headless — it ships no stylesheet — so a few local rules
           give the ProseMirror document it renders a plain, readable look. */
        .milkdown .ProseMirror { padding: 0.25rem 1rem; outline: none; }
        .milkdown .ProseMirror h1 { font-size: 1.6em; }
        .milkdown .ProseMirror h2 { font-size: 1.35em; }
        .milkdown .ProseMirror h3 { font-size: 1.15em; }
        .milkdown .ProseMirror ul, .milkdown .ProseMirror ol { padding-left: 1.5rem; }
        .milkdown .ProseMirror li > p { margin: 0.25em 0; }
        .milkdown .ProseMirror blockquote { border-left: 4px solid #d0d7de; margin-left: 0; padding-left: 1rem; color: #57606a; }
        .milkdown .ProseMirror code { background: #f6f8fa; padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.9em; }
        .milkdown .ProseMirror pre { background: #f6f8fa; padding: 0.75rem 1rem; border-radius: 6px; overflow-x: auto; }
        .milkdown .ProseMirror pre code { background: none; padding: 0; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>

    <script type="module">
        // Milkdown is a plugin-driven WYSIWYG Markdown framework on ProseMirror. The
        // kit's core boots the editor, the commonmark preset supplies the schema plus
        // as-you-type input rules ('# ', '- ', '> ', '**bold**' …), the listener
        // plugin reports every change as serialized Markdown, and the utils macros
        // (getMarkdown / replaceAll) read and replace the document as Markdown.
        import { Editor, rootCtx, defaultValueCtx, remarkStringifyOptionsCtx } from '@milkdown/kit/core';
        import { commonmark } from '@milkdown/kit/preset/commonmark';
        import { listener, listenerCtx } from '@milkdown/kit/plugin/listener';
        import { getMarkdown, replaceAll } from '@milkdown/kit/utils';

        // ProseMirror's base editing styles (white-space, selection, cursor) ship as
        // a separate stylesheet, injected from JS so the demo's CDN references all
        // live together beside the imports above.
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = 'https://cdn.jsdelivr.net/npm/prosemirror-view@1.42.0/style/prosemirror.css';
        document.head.appendChild(cssLink);

        const output = document.getElementById('milkdown-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // Guards against the editor -> markdown -> editor update echoing back into the
        // textarea while the user is typing there.
        let syncing = false;
        let release;

        const editor = await Editor.make()
            .config((ctx) => {
                ctx.set(rootCtx, document.getElementById('milkdown-target'));
                ctx.set(defaultValueCtx, content);
                // Milkdown serializes through remark-stringify: '-' bullets to match
                // the '- ' the input rules accept, plus a join fix — the bullet-list
                // node stores its spread attr as the *string* "false", which mdast
                // reads as truthy and pads every tight list with blank lines.
                ctx.update(remarkStringifyOptionsCtx, (opts) => ({
                    ...opts,
                    bullet: '-',
                    join: [(left, right, parent) => (parent.type === 'list' && String(parent.spread) !== 'true' ? 0 : undefined)],
                }));
                // Editor -> Markdown: the listener hands every document change over
                // already serialized.
                ctx.get(listenerCtx).markdownUpdated((_, md) => {
                    if (syncing) return;
                    output.value = md.trim();
                });
            })
            .use(commonmark)
            .use(listener)
            .create();

        // markdownUpdated only fires on changes, so seed the panel from the initial
        // document via the getMarkdown macro.
        output.value = editor.action(getMarkdown()).trim();

        // Markdown -> editor: the replaceAll macro re-parses the edited text into the
        // document. The listener serializes on a 200 ms debounce, so hold the guard
        // past that window, re-armed on every keystroke.
        output.addEventListener('input', () => {
            syncing = true;
            editor.action(replaceAll(output.value));
            clearTimeout(release);
            release = setTimeout(() => { syncing = false; }, 300);
        });
    </script>
