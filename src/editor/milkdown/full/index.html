    <style>
        body { margin: 0; }

        /* The editor grows with the page and never scrolls on its own. */
        #crepe .milkdown { height: auto; }
        #crepe .milkdown .ProseMirror { outline: none; }

        /* The frame theme centers the writing column with a symmetric 60px/120px
           pad; left-anchor it instead. Crepe's hover drag handle (the + / drag
           buttons) hangs ~82px to the block's left, so hold a left gutter wide
           enough that it clears the viewport edge (>= 1rem), let the right run
           free, and trim the theme's ~100px top pad. Narrower viewports ease the
           top/right gutters while keeping the left gutter for the handle. */
        #crepe .milkdown .ProseMirror { padding: 1.5rem 2rem 3rem 6.5rem; }
        @media (max-width: 900px) {
            #crepe .milkdown .ProseMirror { padding: 1.25rem 1.5rem 2.5rem 6.5rem; }
        }
        @media (max-width: 560px) {
            #crepe .milkdown .ProseMirror { padding: 1rem 1rem 1.5rem 6.5rem; }
        }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }

                "trough": "https://ga.jspm.io/npm:trough@2.2.0/index.js",
                "unified": "https://ga.jspm.io/npm:unified@11.0.5/index.js",
                "unist-util-is": "https://ga.jspm.io/npm:unist-util-is@6.0.1/index.js",
                "unist-util-stringify-position": "https://ga.jspm.io/npm:unist-util-stringify-position@4.0.0/index.js",
                "unist-util-visit": "https://ga.jspm.io/npm:unist-util-visit@5.1.0/index.js",
                "unist-util-visit-parents": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/index.js",
                "unist-util-visit-parents/do-not-use-color": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/lib/color.js",
                "vfile": "https://ga.jspm.io/npm:vfile@6.0.3/index.js",
                "vfile-message": "https://ga.jspm.io/npm:vfile-message@4.0.3/index.js",
                "vue": "https://ga.jspm.io/npm:vue@3.5.39/dist/vue.esm-browser.prod.js",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js",
                "zwitch": "https://ga.jspm.io/npm:zwitch@2.0.4/index.js"
            },
            "https://ga.jspm.io/npm:micromark-extension-math@3.1.0/": {
                "katex": "https://ga.jspm.io/npm:katex@0.16.47/dist/katex.mjs"
            }
        }
    }
    </script>

    <script type="module">
        // Crepe is Milkdown's official batteries-included editor (the milkdown.dev
        // playground): with default features it ships the selection toolbar, the
        // "/" slash menu, block drag handle, GFM tables, task/list items, a
        // CodeMirror code block with a language picker, image block, link tooltip,
        // LaTeX math and placeholder. The listener plugin (bundled by Crepe) reports
        // changes as Markdown; the replaceAll macro re-parses Markdown into the doc.
        import { Crepe } from '@milkdown/crepe';
        import { replaceAll } from '@milkdown/kit/utils';

        // Crepe's official theme CSS (common component styles + the "frame" theme,
        // the milkdown.dev getting-started default). The published common CSS pulls
        // its base stylesheets via bundler-style bare @imports that 404 when served
        // raw, so fetch each part, drop those @imports (the bases are <link>ed in
        // <head>), and inject the rest in the official order.
        const THEME = 'https://cdn.jsdelivr.net/npm/@milkdown/crepe@7.21.2/lib/theme';
        const agg = await (await fetch(`${THEME}/common/style.css`)).text();
        const parts = [...agg.matchAll(/@import\s+'\.\/([^']+)'/g)].map((m) => m[1]);
        const commonCss = (await Promise.all(parts.map(async (p) => {
            const css = await (await fetch(`${THEME}/common/${p}`)).text();
            return css.replace(/@import\s+[^;]+;/g, '');
        }))).join('\n');
        const frameCss = await (await fetch(`${THEME}/frame/style.css`)).text();
        const themeStyle = document.createElement('style');
        themeStyle.textContent = `${commonCss}\n${frameCss}`;
        document.head.appendChild(themeStyle);

        const output = document.getElementById('milkdown-markdown-output');

        const content = [
            '# Full feature demo',
            '',
            'A paragraph with **bold**, *italic*, ~~strikethrough~~, `inline code`,',
            'and a [link](https://milkdown.dev).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '## Table',
            '',
            '| Name | Role | Age |',
            '| --- | --- | --- |',
            '| Ada | Engineer | 36 |',
            '| Alan | Mathematician | 41 |',
            '',
            '## Image',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Blockquote and code',
            '',
            '> Milkdown is a plugin-driven WYSIWYG Markdown editor framework.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
            '',
            '## Mathematics',
            '',
            'The identity $e^{i\\pi} + 1 = 0$ is famous, and inline $\\sqrt{2}$ typesets live.',
            '',
            '$$\\int_a^b x^2 \\,dx = \\frac{b^3 - a^3}{3}$$',
            '',
            '---',
        ].join('\n');

        // Guard against the editor -> markdown -> editor sync echoing back into the
        // textarea while the user is typing there.
        let syncing = false;
        let release;

        const crepe = new Crepe({
            root: document.getElementById('crepe'),
            defaultValue: content,
        });

        // Editor -> Markdown: register before create() so Crepe wires the listener
        // during setup. It hands every document change over already serialized.
        crepe.on((listener) => {
            listener.markdownUpdated((_, md) => {
                if (syncing) return;
                output.value = md;
            });
        });

        await crepe.create();

        // markdownUpdated only fires on changes, so seed the panel from the initial
        // document via getMarkdown.
        output.value = crepe.getMarkdown();

        // Markdown -> editor: the replaceAll macro re-parses the edited text into
        // the document. Crepe's listener serializes on a debounce, so hold the guard
        // past that window, re-armed on every keystroke.
        output.addEventListener('input', () => {
            syncing = true;
            crepe.editor.action(replaceAll(output.value));
            clearTimeout(release);
            release = setTimeout(() => { syncing = false; }, 300);
        });
    </script>

</body>
