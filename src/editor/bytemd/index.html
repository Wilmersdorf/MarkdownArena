<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ByteMD Standalone</title>
    <style>
        body { margin: 0; }
        /* Toolbar/status bar hidden; the whole height chain forced to auto so
           the editor grows with its content (pairs with viewportMargin:
           Infinity below). .CodeMirror-scroll must use overflow: clip, not
           hidden: CodeMirror 5 reserves 50px past the last line, and hidden
           still lets a bottom-edge click script-scroll that phantom range
           into view (jumping the text); clip also disables that scrolling. */
        #bytemd-target .bytemd-toolbar,
        #bytemd-target .bytemd-status { display: none; }
        #bytemd-target .bytemd,
        #bytemd-target .bytemd-body,
        #bytemd-target .bytemd-editor,
        #bytemd-target .CodeMirror { height: auto; }
        #bytemd-target .CodeMirror-scroll {
            overflow: clip !important;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        /* ByteMD caps the single source column at 800px and centers it
           (.CodeMirror-lines: max-width + auto margins). Uncap and left-align it
           so it grows with the viewport; the widget's own border sits flush at
           the edges. */
        #bytemd-target .CodeMirror .CodeMirror-lines { max-width: none; margin-left: 0; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>

                "word-count": "https://ga.jspm.io/npm:word-count@0.2.2/index.js",

    </script>
    <script type="module">
        // ByteMD's UI is Svelte compiled to a framework-agnostic class: new
        // Editor() mounts a CodeMirror 5 Markdown source pane.
        import { Editor } from 'bytemd';

        // ByteMD ships its stylesheet (CodeMirror theme included) as a
        // separate CSS file, injected from JS so the demo's CDN references
        // all live together beside the import above.
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = 'https://cdn.jsdelivr.net/npm/bytemd@1.22.0/dist/index.css';
        document.head.appendChild(cssLink);

        const output = document.getElementById('bytemd-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // ByteMD is a Markdown *source* editor — the document it holds already
        // IS the Markdown, highlighted (not rendered) as you type. 'split' (or
        // 'auto') mode would add a live-rendered preview pane beside the
        // source, but the "MARKDOWN 2-WAY EDITABLE" textarea below already
        // round-trips the raw Markdown, making that preview redundant here.
        // 'tab' mode mounts only the write pane, full width — its write/
        // preview toggle lives in the toolbar, which the CSS above hides, so
        // no switcher ever appears and the preview pane is never rendered.
        // The status bar 'tab' also mounts is hidden by that same CSS.
        const editor = new Editor({
            target: document.getElementById('bytemd-target'),
            props: {
                value: content,
                mode: 'tab',
                // Pairs with the CSS above: height: auto only sizes the
                // editor to whatever CodeMirror has actually rendered, and
                // CodeMirror normally only renders lines near its last
                // known viewport, so tell it to render the whole document
                // up front instead.
                editorConfig: { viewportMargin: Infinity },
            },
        });

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // ByteMD is a controlled component: nothing updates the value prop by
        // itself, so every change event writes the new value back with $set.
        // The value already is Markdown, so it goes straight to the textarea.
        editor.$on('change', (e) => {
            editor.$set({ value: e.detail.value });
            if (syncing) return;
            output.value = e.detail.value;
        });

        // Markdown -> editor: replace the document with the edited text. $set
        // applies on a microtask and the resulting CodeMirror change event
        // echoes into the handler above, so release the guard on a macrotask.
        output.addEventListener('input', () => {
            syncing = true;
            editor.$set({ value: output.value });
            setTimeout(() => { syncing = false; }, 0);
        });

        output.value = content;
    </script>

</body>
</html>
