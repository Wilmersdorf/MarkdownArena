    <!-- Editor chrome + preview typography + code theme + math, all raw
         exact-version files from jsDelivr, pinned to the versions the import
         map resolves. Order and choices mirror ByteMD's official playground:
         github-markdown-css for the preview, highlight.js "vs" theme, then
         KaTeX last so it overrides code padding. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bytemd@1.22.0/dist/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <style>
        body { margin: 0; }

        /* Grow with the page: force the whole ByteMD height chain to auto so the
           split editor + preview expand to their content instead of scrolling
           internally (pairs with viewportMargin: Infinity, which makes
           CodeMirror render every line up front). .CodeMirror-scroll uses
           overflow: clip, not hidden: CodeMirror 5 reserves 50px past the last
           line and hidden still lets a bottom-edge click script-scroll that
           phantom range into view (jumping the text); clip disables it. */
        #bytemd-target .bytemd,
        #bytemd-target .bytemd-body,
        #bytemd-target .bytemd-editor,
        #bytemd-target .bytemd-preview,
        #bytemd-target .CodeMirror { height: auto; }
        #bytemd-target .bytemd-preview { overflow: visible; }
        #bytemd-target .CodeMirror-scroll {
            overflow: clip !important;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        /* ByteMD caps the source column and preview body at 800px and centers
           them — uncap both so they grow with their panes. Plus a little
           breathing room on the left of the source pane. */
        #bytemd-target .CodeMirror-lines { max-width: none; padding-left: 0.5rem; }
        #bytemd-target .bytemd-preview .markdown-body { max-width: none; padding: 1rem 1.5rem; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>

## Markdown Basic Syntax

I just love **bold text**. Italicized text is the _cat's meow_. At the command prompt, type `nano`.

My favorite markdown editor is [ByteMD](https://github.com/bytedance/bytemd).

> Dorothy followed her through many of the beautiful rooms in her castle.

```js
import gfm from '@bytemd/plugin-gfm'
import { Editor, Viewer } from 'bytemd'

const plugins = [
  gfm(),
  // Add more plugins here
]

const editor = new Editor({
  target: document.body, // DOM to render
  props: {
    value: '',
    plugins,
  },
})

editor.on('change', (e) => {
  editor.$set({ value: e.detail.value })
})
```

    <script type="module">
        // ByteMD's UI is Svelte compiled to a framework-agnostic class. The full
        // demo mirrors the official playground: the built-in toolbar plus its
        // eight official plugins, in a split source/preview view.
        import { Editor } from 'bytemd';
        import gfm from '@bytemd/plugin-gfm';
        import breaks from '@bytemd/plugin-breaks';
        import frontmatter from '@bytemd/plugin-frontmatter';
        import gemoji from '@bytemd/plugin-gemoji';
        import highlight from '@bytemd/plugin-highlight';
        import math from '@bytemd/plugin-math';
        import mediumZoom from '@bytemd/plugin-medium-zoom';
        import mermaid from '@bytemd/plugin-mermaid';

        const output = document.getElementById('bytemd-markdown-output');
        const content = document.getElementById('seed').textContent.trim();

        // Same plugin set and options as bytemd.js.org/playground.
        const plugins = [
            gfm(),
            breaks(),
            frontmatter(),
            gemoji(),
            highlight(),
            math({ katexOptions: { output: 'html' } }),
            mediumZoom(),
            mermaid(),
        ];

        const editor = new Editor({
            target: document.getElementById('bytemd-target'),
            props: {
                value: content,
                plugins,
                // Split shows the highlighted source beside a live-rendered
                // preview (where math, mermaid, tables, emoji actually render).
                mode: 'split',
                // Pairs with the height: auto CSS above: tell CodeMirror to render
                // the whole document up front so the source pane sizes to content.
                editorConfig: { viewportMargin: Infinity },
            },
        });

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // ByteMD is a controlled component: nothing updates the value prop by
        // itself, so every change writes the new value back with $set. The value
        // already is Markdown, so it goes straight to the textarea.
        editor.$on('change', (e) => {
            editor.$set({ value: e.detail.value });
            if (syncing) return;
            output.value = e.detail.value;
        });

        // Markdown -> editor: replace the document with the edited text. $set
        // applies on a microtask and the resulting change event echoes back into
        // the handler above, so release the guard on a macrotask.
        output.addEventListener('input', () => {
            syncing = true;
            editor.$set({ value: output.value });
            setTimeout(() => { syncing = false; }, 0);
        });

        output.value = content;
    </script>
