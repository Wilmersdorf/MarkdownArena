<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Summernote Standalone</title>
    <style>
        body { margin: 0; }
        /* Keyboard/Markdown editing only: the toolbar and popovers are configured
           empty below, so hide their leftover containers plus the statusbar with
           its resize grip. */
        .note-toolbar, .note-statusbar, .note-resizebar, .note-popover { display: none !important; }

        /* The bordered frame sits flush to the viewport edges. summernote-lite.css
           pads the editable only 10px; bring the text's left edge out to 1rem
           inside that frame. The lite rule has the same class specificity and loads
           after this block, so the `body` prefix is needed to win. */
        body .note-editor.note-frame .note-editing-area .note-editable { padding-left: 1rem; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>

    <!-- Summernote ships as a classic jQuery plugin script. The Lite build is
         self-contained (no Bootstrap); it, jQuery, and the stylesheet load as raw
         exact-version files, and the icon-font URLs inside the CSS resolve
         relative to the CDN path on their own. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.js"></script>
</head>
<body>

    <div id="summernote-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="summernote-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: pins marked/turndown and their
         deps to exact versions on JSPM. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        }
    }
    </script>

    <script type="module">
        // Summernote has no Markdown format — it edits HTML — so we bridge both
        // directions with general-purpose converters:
        //   markdown -> HTML (marked) on load / textarea edits
        //   HTML -> markdown (turndown) on every editor change
        import { marked } from 'marked';
        import TurndownService from 'turndown';

        // The classic <script>s above are parser-blocking and this module is
        // deferred, so jQuery and the `$.fn.summernote` plugin it hosts are
        // guaranteed to be registered by the time we run.
        const $ = window.jQuery;

        const output = document.getElementById('summernote-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
            emDelimiter: '*',
        });

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Summernote -> Markdown: serialize the editable's HTML on every change.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown($editor.summernote('code')).trim();
        };

        const $editor = $('#summernote-target');
        $editor.summernote({
            // No chrome — keyboard/Markdown editing only. Summernote always builds
            // its toolbar and selection popovers, so give it empty button lists
            // for all of them instead of turning them off.
            toolbar: [],
            popover: { image: [], link: [], table: [], air: [] },
            airMode: false,
            // Let the editable grow with the document instead of collapsing.
            minHeight: 180,
            callbacks: { onChange: renderMarkdown },
        });

        // Seed the editor from the starting Markdown.
        $editor.summernote('code', marked.parse(content));

        // Markdown -> editor: re-parse the edited text back into the document.
        // Loading code fires onChange itself, so release the guard on a macrotask —
        // that echo is suppressed, but genuine later edits still render.
        output.addEventListener('input', () => {
            syncing = true;
            $editor.summernote('code', marked.parse(output.value));
            setTimeout(() => { syncing = false; }, 0);
        });

        renderMarkdown();
    </script>

</body>
</html>
