<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summernote Full</title>

    <!-- Summernote ships as a classic jQuery plugin script. The self-contained
         Lite build (no Bootstrap), jQuery, and the stylesheet load as raw
         exact-version files; the icon-font URLs inside the CSS resolve relative
         to the CDN path (dist/font/summernote.*) on their own. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.js"></script>

    <style>
        body { margin: 0; }

        /* Autogrow: no fixed `height` is configured, so the editable follows its
           content. Force it to never scroll on its own, and give the text ≥1rem
           of left padding inside the native bordered frame (which sits flush to
           the viewport edges); the lite build pads the editable 10px, so match its
           specificity to win. */
        .note-editor.note-frame .note-editing-area .note-editable { overflow: visible; height: auto; padding-left: 1rem; }
        /* Hide the statusbar drag-resize grip — a manual resize implies a fixed,
           inner-scrolling height, which the autogrow convention forbids. */
        .note-statusbar { display: none !important; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="summernote-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="summernote-markdown-output" rows="16" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: pins marked/turndown and the
         turndown GFM plugin (tables/strikethrough) to exact versions on JSPM. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js",
            "turndown-plugin-gfm": "https://ga.jspm.io/npm:turndown-plugin-gfm@1.0.2/lib/turndown-plugin-gfm.cjs.js"
        }
    }
    </script>

    <script type="module">
        // Summernote has no Markdown format — it edits HTML — so we bridge both
        // directions with general-purpose converters:
        //   markdown -> HTML (marked) on load / textarea edits
        //   HTML -> markdown (turndown + GFM) on every editor change
        import { marked } from 'marked';
        import TurndownService from 'turndown';
        import { gfm } from 'turndown-plugin-gfm';

        // The classic <script>s above are parser-blocking and this module is
        // deferred, so jQuery and the `$.fn.summernote` plugin are registered by
        // the time we run.
        const $ = window.jQuery;

        const output = document.getElementById('summernote-markdown-output');

        // Seed exercises every enabled feature. Marks without markdown syntax
        // (underline, sub/superscript) are seeded as inline HTML — marked passes
        // it through and summernote renders it as a real mark.
        const content = [
            '# Summernote — full feature demo',
            '',
            '## Inline formatting',
            '',
            'A paragraph with **bold**, *italic*, <u>underline</u>, ~~strikethrough~~, ' +
                '`inline code`, and an [external link](https://summernote.org). ' +
                'Water is H<sub>2</sub>O and Einstein wrote E = mc<sup>2</sup>.',
            '',
            '### Smaller heading',
            '',
            'Use the **style** dropdown for H1–H6 and paragraph, plus font name, size, ' +
                'text/background color, line height, and alignment.',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '    - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '3. Third',
            '',
            '## Table',
            '',
            '| Feature | Supported | Notes |',
            '| --- | --- | --- |',
            '| Headings | Yes | H1–H6 |',
            '| Tables | Yes | via toolbar |',
            '| Images | Yes | URL or upload |',
            '',
            '## Media',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Blockquote',
            '',
            '> A blockquote making an important point.',
            '',
            '## Code',
            '',
            '```js',
            'function greet(name) {',
            '  console.log(`Hello, ${name}!`);',
            '}',
            '```',
            '',
            '---',
        ].join('\n');

        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
            emDelimiter: '*',
        });
        // GFM adds table + strikethrough (~~) rules; keep the inline-HTML-only
        // marks as literal HTML so they round-trip back through marked.
        turndown.use(gfm);
        turndown.keep(['u', 'sub', 'sup']);

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Summernote -> Markdown: serialize the editable's HTML on every change.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown($editor.summernote('code')).trim();
        };

        const $editor = $('#summernote-target');
        $editor.summernote({
            // Full documented toolbar: style, all inline marks, font name/size,
            // color, line height, lists + paragraph (alignment/indent), table,
            // insert (link/picture/video/hr), and view (fullscreen/codeview/help).
            // Summernote's built-in toolbar and selection popovers ARE the official
            // UI, so both are left at their defaults.
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'strikethrough', 'superscript', 'subscript', 'clear']],
                ['fontname', ['fontname']],
                ['fontsize', ['fontsize']],
                ['color', ['color']],
                ['height', ['height']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture', 'video', 'hr']],
                ['view', ['fullscreen', 'codeview', 'help']],
            ],
            // No fixed height — the editable grows with the document.
            minHeight: 320,
            callbacks: { onChange: renderMarkdown },
        });

        // Seed the editor from the starting Markdown.
        $editor.summernote('code', marked.parse(content));

        // Markdown -> editor: re-parse the edited text back into the document.
        // Loading code fires onChange itself, so release the guard on a macrotask —
        // that echo is suppressed, but genuine later edits still render.
        output.addEventListener('input', () => {
            syncing = true;
            $editor.summernote('code', marked.parse(output.value));
            setTimeout(() => { syncing = false; }, 0);
        });

        renderMarkdown();
    </script>

</body>
</html>
