<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProseMirror Standalone</title>
    <style>
        body { margin: 0; }
        /* prosemirror-view's editor CSS and the gapcursor CSS are loaded from the CDN
           in the script below. These example-setup rules stay inline: the stock
           stylesheet scopes its hr rules to .ProseMirror-example-setup-style, a class
           this surface doesn't carry, so they are rewritten to .ProseMirror. */
        .ProseMirror hr { padding: 2px 10px; border: none; margin: 1em 0; }
        .ProseMirror hr:after { content: ""; display: block; height: 1px; background-color: silver; line-height: 2px; }
        .ProseMirror ul, .ProseMirror ol { padding-left: 30px; }
        .ProseMirror blockquote { padding-left: 1em; border-left: 3px solid #eee; margin-left: 0; margin-right: 0; }

        .ProseMirror { padding-left: 1rem; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="editor"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="pm-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "prosemirror-example-setup": "https://ga.jspm.io/npm:prosemirror-example-setup@1.2.3/dist/index.js",
            "prosemirror-markdown": "https://ga.jspm.io/npm:prosemirror-markdown@1.13.4/dist/index.js",
            "prosemirror-state": "https://ga.jspm.io/npm:prosemirror-state@1.4.4/dist/index.js",
            "prosemirror-view": "https://ga.jspm.io/npm:prosemirror-view@1.41.9/dist/index.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "crelt": "https://ga.jspm.io/npm:crelt@1.0.7/index.js",
                "entities": "https://ga.jspm.io/npm:entities@4.5.0/lib/esm/index.js",
                "linkify-it": "https://ga.jspm.io/npm:linkify-it@5.0.2/index.mjs",
                "markdown-it": "https://ga.jspm.io/npm:markdown-it@14.3.0/index.mjs",
                "mdurl": "https://ga.jspm.io/npm:mdurl@2.0.0/index.mjs",
                "orderedmap": "https://ga.jspm.io/npm:orderedmap@2.1.1/dist/index.js",
                "prosemirror-commands": "https://ga.jspm.io/npm:prosemirror-commands@1.7.1/dist/index.js",
                "prosemirror-dropcursor": "https://ga.jspm.io/npm:prosemirror-dropcursor@1.8.2/dist/index.js",
                "prosemirror-gapcursor": "https://ga.jspm.io/npm:prosemirror-gapcursor@1.4.1/dist/index.js",
                "prosemirror-history": "https://ga.jspm.io/npm:prosemirror-history@1.5.0/dist/index.js",
                "prosemirror-inputrules": "https://ga.jspm.io/npm:prosemirror-inputrules@1.5.1/dist/index.js",
                "prosemirror-keymap": "https://ga.jspm.io/npm:prosemirror-keymap@1.2.3/dist/index.js",
                "prosemirror-menu": "https://ga.jspm.io/npm:prosemirror-menu@1.3.2/dist/index.js",
                "prosemirror-model": "https://ga.jspm.io/npm:prosemirror-model@1.25.9/dist/index.js",
                "prosemirror-schema-list": "https://ga.jspm.io/npm:prosemirror-schema-list@1.5.1/dist/index.js",
                "prosemirror-transform": "https://ga.jspm.io/npm:prosemirror-transform@1.12.0/dist/index.js",
                "punycode.js": "https://ga.jspm.io/npm:punycode.js@2.3.1/punycode.es6.js",
                "rope-sequence": "https://ga.jspm.io/npm:rope-sequence@1.3.4/dist/index.js",
                "uc.micro": "https://ga.jspm.io/npm:uc.micro@2.1.0/index.mjs",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
            }
        }
    }
    </script>

    <script type="module">
        import { EditorState } from 'prosemirror-state';
        import { EditorView } from 'prosemirror-view';
        import { schema, defaultMarkdownParser, defaultMarkdownSerializer } from 'prosemirror-markdown';
        import { exampleSetup } from 'prosemirror-example-setup';

        // prosemirror-view's editor CSS + the gapcursor CSS ship as standalone
        // stylesheets, loaded here from the CDN beside the imports that need them.
        [
            'https://cdn.jsdelivr.net/npm/prosemirror-view@1.41.9/style/prosemirror.css',
            'https://cdn.jsdelivr.net/npm/prosemirror-gapcursor@1.3.2/style/gapcursor.css',
        ].forEach((href) => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        });

        const output = document.getElementById('pm-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // prosemirror-markdown serializes the current document back to Markdown.
        const syncMarkdown = () => {
            output.value = defaultMarkdownSerializer.serialize(view.state.doc);
        };

        const view = new EditorView(document.getElementById('editor'), {
            state: EditorState.create({
                doc: defaultMarkdownParser.parse(content),
                // No menu bar — editing is via keyboard/Markdown only. exampleSetup
                // provides the keymaps, history and the block-level Markdown input
                // rules (headings, lists, blockquote, code fence).
                plugins: exampleSetup({ schema, menuBar: false }),
            }),
            dispatchTransaction(tr) {
                view.updateState(view.state.apply(tr));
                if (tr.docChanged) syncMarkdown();
            },
        });

        // Markdown -> editor: re-parse the edited text into a fresh document.
        // This goes through updateState (not a transaction), so dispatchTransaction
        // never fires and there's nothing to echo back to the textarea.
        output.addEventListener('input', () => view.updateState(EditorState.create({
            doc: defaultMarkdownParser.parse(output.value),
            plugins: view.state.plugins,
        })));

        syncMarkdown();
    </script>

</body>
</html>
