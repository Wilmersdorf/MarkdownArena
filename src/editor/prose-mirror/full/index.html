<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProseMirror Full</title>

    <!-- Source Sans Pro is the typeface of ProseMirror's demo site; raw exact-version files from jsDelivr. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-pro@5.2.5/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-pro@5.2.5/400-italic.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-pro@5.2.5/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-pro@5.2.5/700.css">

    <!-- Official editor, menu, gap-cursor and example-setup stylesheets as raw exact-version files. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-view@1.41.9/style/prosemirror.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-menu@1.3.2/style/menu.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-gapcursor@1.4.1/style/gapcursor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prosemirror-example-setup@1.2.3/style/style.css">

    <!-- KaTeX typesets the math nodes; katex CSS pinned to the version the import map resolves (fonts load relative to it). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@benrbray/prosemirror-math@1.0.0/dist/prosemirror-math.css">

    <style>
        html {
            font-family: 'Source Sans Pro', ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.45;
        }
        body { margin: 0; background: #fff; color: #000; }

        /* Editor border flush to the top/left edges; grows with the viewport. */
        .page { margin: 0; padding: 0 1.5rem 1.5rem 0; }

        #editor {
            border: 2px solid rgba(0, 0, 0, 0.2); border-radius: 4px;
            background: #fff; margin-bottom: 1.5rem;
        }
        .ProseMirror { padding: 8px 12px 8px 1rem; outline: none; }
        .ProseMirror :first-child { margin-top: 0; }
        .ProseMirror img { max-width: 100%; height: auto; }
        .ProseMirror pre {
            background: #f5f5f5; border-radius: 4px; padding: 0.5em 0.75em; white-space: pre-wrap;
        }
        .ProseMirror code { background: rgba(0, 0, 0, 0.05); border-radius: 3px; padding: 0 0.25em; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div class="page">
        <div id="editor"></div>

        <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
        <textarea class="md-export-output" id="pm-markdown-output" rows="14" spellcheck="false"></textarea>
    </div>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. The scoped katex entry is
         hand-pinned to the ESM build; the CJS-interop build drops KaTeX's
         built-in functions and renders red parse errors. -->
    <script type="importmap">
    {
        "imports": {
            "@benrbray/prosemirror-math": "https://ga.jspm.io/npm:@benrbray/prosemirror-math@1.0.0/dist/prosemirror-math.js",
            "@vscode/markdown-it-katex": "https://ga.jspm.io/npm:@vscode/markdown-it-katex@1.1.2/dist/index.js",
            "katex": "https://ga.jspm.io/npm:katex@0.16.47/dist/katex.mjs",
            "prosemirror-commands": "https://ga.jspm.io/npm:prosemirror-commands@1.7.1/dist/index.js",
            "prosemirror-example-setup": "https://ga.jspm.io/npm:prosemirror-example-setup@1.2.3/dist/index.js",
            "prosemirror-inputrules": "https://ga.jspm.io/npm:prosemirror-inputrules@1.5.1/dist/index.js",
            "prosemirror-keymap": "https://ga.jspm.io/npm:prosemirror-keymap@1.2.3/dist/index.js",
            "prosemirror-markdown": "https://ga.jspm.io/npm:prosemirror-markdown@1.13.4/dist/index.js",
            "prosemirror-model": "https://ga.jspm.io/npm:prosemirror-model@1.25.9/dist/index.js",
            "prosemirror-state": "https://ga.jspm.io/npm:prosemirror-state@1.4.4/dist/index.js",
            "prosemirror-view": "https://ga.jspm.io/npm:prosemirror-view@1.41.9/dist/index.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "crelt": "https://ga.jspm.io/npm:crelt@1.0.7/index.js",
                "entities": "https://ga.jspm.io/npm:entities@4.5.0/lib/esm/index.js",
                "katex": "https://ga.jspm.io/npm:katex@0.16.47/dist/katex.mjs",
                "linkify-it": "https://ga.jspm.io/npm:linkify-it@5.0.2/index.mjs",
                "markdown-it": "https://ga.jspm.io/npm:markdown-it@14.3.0/index.mjs",
                "mdurl": "https://ga.jspm.io/npm:mdurl@2.0.0/index.mjs",
                "orderedmap": "https://ga.jspm.io/npm:orderedmap@2.1.1/dist/index.js",
                "prosemirror-dropcursor": "https://ga.jspm.io/npm:prosemirror-dropcursor@1.8.2/dist/index.js",
                "prosemirror-gapcursor": "https://ga.jspm.io/npm:prosemirror-gapcursor@1.4.1/dist/index.js",
                "prosemirror-history": "https://ga.jspm.io/npm:prosemirror-history@1.5.0/dist/index.js",
                "prosemirror-menu": "https://ga.jspm.io/npm:prosemirror-menu@1.3.2/dist/index.js",
                "prosemirror-schema-list": "https://ga.jspm.io/npm:prosemirror-schema-list@1.5.1/dist/index.js",
                "prosemirror-transform": "https://ga.jspm.io/npm:prosemirror-transform@1.12.0/dist/index.js",
                "punycode.js": "https://ga.jspm.io/npm:punycode.js@2.3.1/punycode.es6.js",
                "rope-sequence": "https://ga.jspm.io/npm:rope-sequence@1.3.4/dist/index.js",
                "uc.micro": "https://ga.jspm.io/npm:uc.micro@2.1.0/index.mjs",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
            }
        }
    }
    </script>

    <script type="module">
        import { EditorState } from 'prosemirror-state';
        import { EditorView } from 'prosemirror-view';
        import { Schema } from 'prosemirror-model';
        import { keymap } from 'prosemirror-keymap';
        import { inputRules } from 'prosemirror-inputrules';
        import { chainCommands, deleteSelection, joinBackward, selectNodeBackward } from 'prosemirror-commands';
        import { exampleSetup } from 'prosemirror-example-setup';
        import {
            schema as markdownSchema,
            defaultMarkdownParser,
            defaultMarkdownSerializer,
            MarkdownParser,
            MarkdownSerializer,
        } from 'prosemirror-markdown';
        import {
            mathPlugin, mathBackspaceCmd, insertMathCmd, mathSerializer,
            makeInlineMathInputRule, makeBlockMathInputRule,
            REGEX_INLINE_MATH_DOLLARS, REGEX_BLOCK_MATH_DOLLARS,
        } from '@benrbray/prosemirror-math';
        import mdKatexImport from '@vscode/markdown-it-katex';

        const mdKatex = mdKatexImport.default || mdKatexImport;

        // The default markdown schema plus the two nodes prosemirror-math renders.
        // The space-separated groups keep them valid wherever inline/block content is.
        const schema = new Schema({
            nodes: markdownSchema.spec.nodes
                .addToEnd('math_inline', {
                    group: 'inline math', content: 'text*', inline: true, atom: true,
                    toDOM: () => ['math-inline', { class: 'math-node' }, 0],
                    parseDOM: [{ tag: 'math-inline' }],
                })
                .addToEnd('math_display', {
                    group: 'block math', content: 'text*', atom: true, code: true,
                    toDOM: () => ['math-display', { class: 'math-node' }, 0],
                    parseDOM: [{ tag: 'math-display' }],
                }),
            marks: markdownSchema.spec.marks,
        });

        // Teach the markdown parser about $…$ / $$…$$: reuse the default tokenizer with
        // the KaTeX markdown-it plugin, then map its math tokens onto the math nodes.
        const tokenizer = defaultMarkdownParser.tokenizer.use(mdKatex);
        const markdownParser = new MarkdownParser(schema, tokenizer, {
            ...defaultMarkdownParser.tokens,
            math_inline: { block: 'math_inline', noCloseToken: true },
            math_block: { block: 'math_display', noCloseToken: true },
            math_inline_bare_block: { block: 'math_inline', noCloseToken: true },
        });

        // Serialize the math nodes back to $…$ / $$…$$.
        const markdownSerializer = new MarkdownSerializer({
            ...defaultMarkdownSerializer.nodes,
            math_inline(state, node) { state.write('$' + node.textContent + '$'); },
            math_display(state, node) {
                state.write('$$\n');
                state.text(node.textContent, false);
                state.ensureNewLine();
                state.write('$$');
                state.closeBlock(node);
            },
        }, defaultMarkdownSerializer.marks);

        const output = document.getElementById('pm-markdown-output');

        const content = [
            '# ProseMirror Full',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://prosemirror.net).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '    - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '## Blockquote and code',
            '',
            '> ProseMirror keeps the document in a well-defined, structured state.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Mathematics',
            '',
            'The identity $e^{i\\pi} + 1 = 0$ is famous, and inline $\\sqrt{2}$ typesets live.',
            '',
            '$$',
            '\\int_a^b x^2 \\,dx = \\frac{b^3 - a^3}{3}',
            '$$',
            '',
            '---',
        ].join('\n');

        const inlineMathInputRule = makeInlineMathInputRule(REGEX_INLINE_MATH_DOLLARS, schema.nodes.math_inline);
        const blockMathInputRule = makeBlockMathInputRule(REGEX_BLOCK_MATH_DOLLARS, schema.nodes.math_display);

        // Math plugins go ahead of exampleSetup so the math Backspace and $…$ input
        // rules get first crack; exampleSetup then adds the official menu bar,
        // input rules, keymaps, drop/gap cursors and history.
        const plugins = [
            mathPlugin,
            keymap({
                'Mod-Space': insertMathCmd(schema.nodes.math_inline),
                'Backspace': chainCommands(deleteSelection, mathBackspaceCmd, joinBackward, selectNodeBackward),
            }),
            inputRules({ rules: [inlineMathInputRule, blockMathInputRule] }),
            ...exampleSetup({ schema, menuBar: true }),
        ];

        const syncMarkdown = () => { output.value = markdownSerializer.serialize(view.state.doc); };

        const view = new EditorView(document.getElementById('editor'), {
            state: EditorState.create({ doc: markdownParser.parse(content), plugins }),
            clipboardTextSerializer: (slice) => mathSerializer.serializeSlice(slice),
            dispatchTransaction(tr) {
                view.updateState(view.state.apply(tr));
                if (tr.docChanged) syncMarkdown();
            },
        });

        // Markdown -> editor: re-parse the edited text into a fresh document. This goes
        // through updateState (not a transaction), so dispatchTransaction never fires
        // and there's nothing to echo back to the textarea.
        output.addEventListener('input', () => view.updateState(EditorState.create({
            doc: markdownParser.parse(output.value),
            plugins: view.state.plugins,
        })));

        syncMarkdown();
    </script>

</body>
</html>
