    <title>MDXEditor Full</title>
    <!-- MDXEditor ships its full UI (toolbar, dialogs, code-block chrome) and content
         styling as one plain stylesheet with a system font stack — this IS the
         official look. Load the exact-version raw file from jsDelivr. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdxeditor/editor@4.0.4/dist/style.css">
    <style>
        body { margin: 0; }

        /* Give the content the ≥1rem left gutter and let it grow with the page. */
        .editor-content { padding-left: 1rem; }
        .mdxeditor { --spacing-5: 1rem; }

        /* Markdown round-trip panel. */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>

    <div id="mdxeditor-target"></div>

    <!-- MDXEditor is Lexical-based and its dependency graph pulls in prismjs; keep
         Prism manual so its load-time requestAnimationFrame highlightAll never
         touches the live editor DOM. -->
    <script>window.Prism = { manual: true };</script>

    <!-- JSPM serves each package's own ESM build unmodified, and one of MDXEditor's
         dependencies (downshift) reads the Node global process.env.NODE_ENV at load
         time, so define it before any module evaluates. -->
    <script>window.process = { env: { NODE_ENV: 'production' } };</script>

         pulls the whole editor graph — this map pins every kitchen-sink dependency
         (toolbar, dialogs, table, image, frontmatter, directives, diff/source).
         Regenerating needs resolutions: {

                "unist-util-stringify-position": "https://ga.jspm.io/npm:unist-util-stringify-position@4.0.0/index.js",
                "unist-util-visit": "https://ga.jspm.io/npm:unist-util-visit@5.1.0/index.js",
                "unist-util-visit-parents": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/index.js",
                "unist-util-visit-parents/do-not-use-color": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/lib/color.js",
                "use-callback-ref": "https://ga.jspm.io/npm:use-callback-ref@1.3.3/dist/es2015/index.js",
                "use-sidecar": "https://ga.jspm.io/npm:use-sidecar@1.1.3/dist/es2015/index.js",
                "uvu/assert": "https://ga.jspm.io/npm:uvu@0.5.6/assert/index.mjs",
                "uvu/diff": "https://ga.jspm.io/npm:uvu@0.5.6/diff/index.mjs",
                "vfile-message": "https://ga.jspm.io/npm:vfile-message@4.0.3/index.js",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js",
                "zwitch": "https://ga.jspm.io/npm:zwitch@2.0.4/index.js"
            },
            "https://ga.jspm.io/npm:acorn-jsx@5.3.2/": {
                "acorn": "https://ga.jspm.io/npm:acorn@8.17.0/dist/acorn.js"
            }
        }
    }
    </script>

    <script type="module">
        // MDXEditor is a React WYSIWYG markdown editor built on Lexical. This full
        // demo mirrors the project's own kitchen-sink example (src/examples/
        // _boilerplate.tsx ALL_PLUGINS + KitchenSinkToolbar) — the union of every
        // official plugin, translated to React.createElement (no JSX, no build step).
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            MDXEditor,
            toolbarPlugin,
            KitchenSinkToolbar,
            listsPlugin,
            quotePlugin,
            headingsPlugin,
            linkPlugin,
            linkDialogPlugin,
            imagePlugin,
            tablePlugin,
            thematicBreakPlugin,
            frontmatterPlugin,
            codeBlockPlugin,
            codeMirrorPlugin,
            directivesPlugin,
            AdmonitionDirectiveDescriptor,
            diffSourcePlugin,
            markdownShortcutPlugin,
        } from '@mdxeditor/editor';

        const { useRef, useState } = React;
        const h = React.createElement;

        // Seed exercises every kitchen-sink feature: frontmatter, headings (1-3, the
        // allowed levels), every mark, all three list kinds, quote, table, image,
        // code blocks (js + css, rendered/edited by CodeMirror), admonition, link,
        // thematic break.
        const content = [
            '---',
            'title: Kitchen sink',
            'description: MDXEditor full-feature demo',
            '---',
            '',
            '# Heading 1',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, ~~strikethrough~~, ==highlight==, <u>underline</u>, H<sub>2</sub>O, x<sup>2</sup>, and [a link](https://mdxeditor.dev "MDXEditor").',
            '',
            '## Heading 2',
            '',
            '### Heading 3',
            '',
            '- Bullet one *italic*',
            '- Bullet two **bold**',
            '    - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '> A blockquote with **bold** and *italic* text.',
            '',
            '| Name | Role | Age |',
            '| --- | --- | --- |',
            '| Ada | Engineer | 36 |',
            '| Alan | Mathematician | 41 |',
            '',
            ':::info',
            'An info admonition with **bold** text.',
            ':::',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '```js',
            'export default function App() {',
            '  return "Hello world from a markdown"',
            '}',
            '```',
            '',
            '```css',
            'html, body {',
            '  font-weight: 400;',
            '}',
            '```',
            '',
            '---',
        ].join('\n');

        // Self-contained image upload: read the picked file as a data URL rather than
        // POSTing to a backend (the official example uploads to a server).
        const imageUploadHandler = (image) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(image);
        });

        function App() {
            // MDXEditor is uncontrolled after mount: `markdown` is only the initial
            // document, later updates go through the ref's setMarkdown().
            const editorRef = useRef(null);
            const syncing = useRef(false);
            const [md, setMd] = useState(content);

            // Editor -> Markdown: MDXEditor serializes the document itself and hands
            // onChange the markdown string (once at mount too, normalized).
            const onEditorChange = (markdown) => {
                if (!syncing.current) setMd(markdown);
            };

            // Markdown -> editor: push the edited text into the document. While the
            // user is mid-edit the text is often momentarily invalid (an unclosed
            // fence, a half-typed tag) and setMarkdown throws on it — catch and keep
            // the last good document until the text parses again. The guard stops the
            // change event setMarkdown fires from overwriting the textarea with
            // re-serialized markdown while the user is typing there; release it on a
            // macrotask so genuine later edits still render.
            const onMarkdownInput = (event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                try {
                    editorRef.current.setMarkdown(text);
                } catch (err) { /* invalid markdown mid-edit; keep last good document */ }
                setTimeout(() => { syncing.current = false; }, 0);
            };

            return h(React.Fragment, null,
                h(MDXEditor, {
                    ref: editorRef,
                    markdown: content,
                    onChange: onEditorChange,
                    contentEditableClassName: 'editor-content',
                    plugins: [
                        // The toolbar plugin renders MDXEditor's own kitchen-sink
                        // toolbar — the editor's official full UI.
                        toolbarPlugin({ toolbarContents: () => h(KitchenSinkToolbar) }),
                        listsPlugin(),
                        quotePlugin(),
                        headingsPlugin({ allowedHeadingLevels: [1, 2, 3] }),
                        linkPlugin(),
                        linkDialogPlugin(),
                        imagePlugin({
                            imageAutocompleteSuggestions: ['https://markdownarena.com/600x200.png'],
                            imageUploadHandler,
                        }),
                        tablePlugin(),
                        thematicBreakPlugin(),
                        frontmatterPlugin(),
                        codeBlockPlugin({ defaultCodeBlockLanguage: '' }),
                        codeMirrorPlugin({
                            codeBlockLanguages: { js: 'JavaScript', css: 'CSS', txt: 'Plain Text', tsx: 'TypeScript', '': 'Unspecified' },
                        }),
                        // Admonition directives (:::note / :::info / …) power the
                        // toolbar's InsertAdmonition and ChangeAdmonitionType controls.
                        directivesPlugin({ directiveDescriptors: [AdmonitionDirectiveDescriptor] }),
                        // Rich-text / diff / source toggle (the toolbar's Source view).
                        diffSourcePlugin({ viewMode: 'rich-text', diffMarkdown: content }),
                        // Typing '## ', '- ', '**bold**' etc. converts as you type.
                        markdownShortcutPlugin(),
                    ],
                }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'mdxeditor-markdown-output',
                    rows: 18,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('mdxeditor-target')).render(h(App));
    </script>

</body>
</html>
