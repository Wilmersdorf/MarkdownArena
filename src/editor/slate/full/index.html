    <!-- Material Icons ligature font — the typeface Slate's official examples use for
         toolbar icons; raw exact-version files from jsDelivr (fonts load relative to this URL). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons@1.13.14/iconfont/material-icons.css">
    <style>
        body {
            margin: 0; color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }

        /* Toolbar — the official Slate examples' Toolbar/Button/Icon look:
           icon-only borderless buttons, 15px apart, dark when active. */
        .slate-shell { padding: 12px 20px 28px; }
        .slate-toolbar { border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 16px; }
        .slate-toolbar > * { display: inline-block; vertical-align: middle; }
        .slate-toolbar > * + * { margin-left: 15px; }
        .slate-btn { border: none; background: none; padding: 0; cursor: pointer; color: #ccc; }
        .slate-btn.is-active { color: #000; }
        .material-icons { font-size: 18px; vertical-align: text-bottom; }

        /* Editor content — grows with the page, ≥1rem left padding via the shell. */
        [data-slate-editor="true"] { outline: none; }
        [data-slate-editor="true"] > :first-child { margin-top: 0; }
        [data-slate-editor="true"] h1 { font-size: 1.6rem; }
        [data-slate-editor="true"] h2 { font-size: 1.3rem; }
        [data-slate-editor="true"] blockquote {
            border-left: 2px solid #ddd; margin: 1em 0; margin-left: 0;
            padding-left: 10px; color: #aaa; font-style: italic;
        }
        [data-slate-editor="true"] code {
            background: #f2f2f2; border-radius: 3px; padding: 0.1em 0.3em; font-size: 0.9em;
        }
        .slate-code { background: #1f1f1f; color: #fff; border-radius: 4px; padding: 0.75rem 1rem; overflow-x: auto; }
        .slate-code code { background: none; color: inherit; padding: 0; }

        /* Tables (from the official tables example) */
        .slate-table { border-collapse: collapse; margin: 1em 0; }
        .slate-table td { border: 1px solid #ddd; padding: 6px 10px; min-width: 3em; vertical-align: top; }

        /* Check lists (from the official check-lists example) */
        .slate-check { display: flex; flex-direction: row; align-items: center; }
        .slate-check + .slate-check { margin-top: 0; }
        .slate-check-box { margin-right: 0.75em; }
        .slate-check-text { flex: 1; }
        .slate-check-text:focus { outline: none; }
        .slate-check-text.checked { opacity: 0.666; text-decoration: line-through; }

        /* Images (from the official images example) */
        .slate-img-wrap { position: relative; }
        .slate-img { display: block; max-width: 100%; max-height: 20em; margin: 0.5em 0; }
        .slate-img.sel { box-shadow: 0 0 0 3px #b4d5ff; }
        .slate-img-del { position: absolute; top: 0.5em; left: 0.5em; background: #fff; color: #000; padding: 2px; border-radius: 2px; }
        .slate-img-del.hidden { display: none; }

        /* Links (from the official inlines example) */
        .slate-link.sel { box-shadow: 0 0 0 3px #ddd; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>

    <script type="module">
        // Slate is a React framework with no UI of its own, so we pull React plus
        // the slate packages as bare specifiers, resolved through the import map
        // above to one exact-version copy of every package in the graph.
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            createEditor, Editor, Transforms, Node, Range, Point, Element as SlateElement,
        } from 'slate';
        import {
            Slate as SlateProvider, Editable, withReact, ReactEditor,
            useSlate, useSlateStatic, useSelected, useFocused, useReadOnly,
        } from 'slate-react';
        import { withHistory } from 'slate-history';
        import { unified } from 'unified';
        import remarkParse from 'remark-parse';
        import remarkStringify from 'remark-stringify';
        import { remarkToSlate, slateToRemark } from 'remark-slate-transformer';

        const { useMemo, useRef, useState } = React;
        const h = React.createElement;

        const LIST_TYPES = ['numbered-list', 'bulleted-list'];
        const ALIGN_TYPES = ['left', 'center', 'right', 'justify'];
        const MARK_HOTKEYS = { b: 'strong', i: 'emphasis', u: 'underline' };

        // Seed value exercising every feature (a union of Slate's official examples:
        // richtext, check-lists, images, links/inlines, tables). The transformer's
        // native mark keys are strong / emphasis / inlineCode; underline has no
        // Markdown form (kept as a rich-text-only mark).
        const initialValue = [
            { type: 'heading-one', children: [{ text: 'Slate full demo' }] },
            {
                type: 'paragraph',
                children: [
                    { text: 'This is editable ' },
                    { text: 'rich', strong: true },
                    { text: ' text, ' },
                    { text: 'much', emphasis: true },
                    { text: ' better than a ' },
                    { text: '<textarea>', inlineCode: true },
                    { text: '! You can ' },
                    { text: 'underline', underline: true },
                    { text: ' too, and add a ' },
                    { type: 'link', url: 'https://slatejs.org', children: [{ text: 'hyperlink' }] },
                    { text: '.' },
                ],
            },
            { type: 'heading-two', children: [{ text: 'Lists' }] },
            {
                type: 'bulleted-list',
                children: [
                    { type: 'list-item', children: [{ text: 'Bulleted item one' }] },
                    { type: 'list-item', children: [{ text: 'Bulleted item two' }] },
                ],
            },
            {
                type: 'numbered-list',
                children: [
                    { type: 'list-item', children: [{ text: 'Numbered item one' }] },
                    { type: 'list-item', children: [{ text: 'Numbered item two' }] },
                ],
            },
            { type: 'check-list-item', checked: true, children: [{ text: 'Slide to the left.' }] },
            { type: 'check-list-item', checked: true, children: [{ text: 'Slide to the right.' }] },
            { type: 'check-list-item', checked: false, children: [{ text: 'Criss-cross.' }] },
            { type: 'block-quote', children: [{ text: 'A wise quote.' }] },
            { type: 'paragraph', align: 'center', children: [{ text: 'Centered with the toolbar.' }] },
            { type: 'paragraph', align: 'right', children: [{ text: 'Right aligned.' }] },
            {
                type: 'table',
                children: [
                    {
                        type: 'table-row',
                        children: [
                            { type: 'table-cell', children: [{ text: '' }] },
                            { type: 'table-cell', children: [{ text: 'Human', strong: true }] },
                            { type: 'table-cell', children: [{ text: 'Dog', strong: true }] },
                            { type: 'table-cell', children: [{ text: 'Cat', strong: true }] },
                        ],
                    },
                    {
                        type: 'table-row',
                        children: [
                            { type: 'table-cell', children: [{ text: '# of Feet', strong: true }] },
                            { type: 'table-cell', children: [{ text: '2' }] },
                            { type: 'table-cell', children: [{ text: '4' }] },
                            { type: 'table-cell', children: [{ text: '4' }] },
                        ],
                    },
                    {
                        type: 'table-row',
                        children: [
                            { type: 'table-cell', children: [{ text: '# of Lives', strong: true }] },
                            { type: 'table-cell', children: [{ text: '1' }] },
                            { type: 'table-cell', children: [{ text: '1' }] },
                            { type: 'table-cell', children: [{ text: '9' }] },
                        ],
                    },
                ],
            },
            { type: 'paragraph', children: [{ text: 'An image — select it to reveal the delete cross:' }] },
            { type: 'image', url: 'https://markdownarena.com/600x200.png', children: [{ text: '' }] },
            { type: 'paragraph', children: [{ text: 'Try it out for yourself!' }] },
        ];

        /* ===================== Markdown <-> Slate =====================
           Slate ships no Markdown support, so remark-slate-transformer walks the
           mdast tree to / from Slate nodes. `overrides` map its default node shapes
           onto this demo's element types. Some rich features have no CommonMark form
           and round-trip lossily (expected): text-align is dropped, underline is
           dropped, check-list items serialize to a "[x]"-prefixed line, and the
           table serializes to a fenced code block of its cells. */

        // Flatten a list-item / blockquote's block children (paragraphs) down to the
        // inline content this demo stores directly under those elements.
        const toInline = (children) => {
            const out = [];
            (children || []).forEach((c) => { if (c && c.type === 'paragraph') out.push(...c.children); else out.push(c); });
            return out.length ? out : [{ text: '' }];
        };

        // mdast -> this demo's Slate element types.
        const MD_TO_SLATE = {
            heading:    (n, next) => ({ type: (n.depth || 1) <= 1 ? 'heading-one' : 'heading-two', children: next(n.children) }),
            blockquote: (n, next) => ({ type: 'block-quote', children: toInline(next(n.children)) }),
            list:       (n, next) => ({ type: n.ordered ? 'numbered-list' : 'bulleted-list', children: next(n.children) }),
            listItem:   (n, next) => ({ type: 'list-item', children: toInline(next(n.children)) }),
            paragraph:  (n, next) => {
                const kids = n.children || [];
                if (kids.length === 1 && kids[0].type === 'image') {
                    const img = kids[0];
                    return { type: 'image', url: img.url, alt: img.alt || '', children: [{ text: '' }] };
                }
                return { type: 'paragraph', children: next(kids) };
            },
        };

        // Render a Slate table's cells as pipe-delimited text rows.
        const tableToText = (table) =>
            (table.children || []).map((row) =>
                '| ' + (row.children || []).map((cell) => Node.string(cell)).join(' | ') + ' |'
            ).join('\n');

        // This demo's element types -> mdast (list-item / blockquote inline content
        // is wrapped back into a paragraph, mdast's required shape).
        const SLATE_TO_MD = {
            'heading-one':    (n, next) => ({ type: 'heading', depth: 1, children: next(n.children) }),
            'heading-two':    (n, next) => ({ type: 'heading', depth: 2, children: next(n.children) }),
            'block-quote':    (n, next) => ({ type: 'blockquote', children: [{ type: 'paragraph', children: next(n.children) }] }),
            'bulleted-list':  (n, next) => ({ type: 'list', ordered: false, spread: false, children: next(n.children) }),
            'numbered-list':  (n, next) => ({ type: 'list', ordered: true, spread: false, children: next(n.children) }),
            'list-item':      (n, next) => ({ type: 'listItem', spread: false, children: [{ type: 'paragraph', children: next(n.children) }] }),
            'check-list-item': (n, next) => ({ type: 'paragraph', children: [{ type: 'text', value: n.checked ? '[x] ' : '[ ] ' }, ...next(n.children)] }),
            image:            (n) => ({ type: 'paragraph', children: [{ type: 'image', url: n.url, title: null, alt: n.alt || '' }] }),
            table:            (n) => ({ type: 'code', lang: null, meta: null, value: tableToText(n) }),
        };

        // Markdown output style: '-' bullets, tight lists.
        const STRINGIFY_OPTS = { bullet: '-', listItemIndent: 'one', fences: true, rule: '-' };

        function markdownToSlate(md) {
            try {
                const nodes = unified().use(remarkParse).use(remarkToSlate, { overrides: MD_TO_SLATE }).processSync(md || '').result;
                return nodes.length ? nodes : [{ type: 'paragraph', children: [{ text: '' }] }];
            } catch (err) {
                return [{ type: 'paragraph', children: [{ text: md || '' }] }];
            }
        }

        function slateToMarkdown(value) {
            try {
                const processor = unified().use(remarkStringify, STRINGIFY_OPTS);
                return processor.stringify(processor.runSync(slateToRemark(value || [], { overrides: SLATE_TO_MD }))).trim();
            } catch (err) {
                return '';
            }
        }

        /* ===================== Editor plugins ===================== */
        const looksLikeImageUrl = (url) => /^https?:\/\/\S+\.(png|jpe?g|gif|svg|webp|bmp|avif)(\?\S*)?$/i.test(url || '');

        const insertImage = (editor, url) => {
            Transforms.insertNodes(editor, { type: 'image', url, children: [{ text: '' }] });
            Transforms.insertNodes(editor, { type: 'paragraph', children: [{ text: '' }] });
        };

        const isType = (type) => (n) => !Editor.isEditor(n) && SlateElement.isElement(n) && n.type === type;

        // Union of the official examples' editor behaviors: link is inline, image is a
        // void block, empty check-list items unset to paragraphs, table cells trap
        // backspace/delete/enter, and pasted image URLs become images.
        const withPlugins = (editor) => {
            const { isInline, isVoid, deleteBackward, deleteForward, insertBreak, insertData } = editor;

            editor.isInline = (el) => el.type === 'link' || isInline(el);
            editor.isVoid = (el) => el.type === 'image' || isVoid(el);

            editor.deleteBackward = (unit) => {
                const { selection } = editor;
                if (selection && Range.isCollapsed(selection)) {
                    const [cell] = Editor.nodes(editor, { match: isType('table-cell') });
                    if (cell && Point.equals(selection.anchor, Editor.start(editor, cell[1]))) return;

                    const [check] = Editor.nodes(editor, { match: isType('check-list-item') });
                    if (check && Point.equals(selection.anchor, Editor.start(editor, check[1]))) {
                        Transforms.setNodes(editor, { type: 'paragraph' }, { match: isType('check-list-item') });
                        return;
                    }
                }
                deleteBackward(unit);
            };

            editor.deleteForward = (unit) => {
                const { selection } = editor;
                if (selection && Range.isCollapsed(selection)) {
                    const [cell] = Editor.nodes(editor, { match: isType('table-cell') });
                    if (cell && Point.equals(selection.anchor, Editor.end(editor, cell[1]))) return;
                }
                deleteForward(unit);
            };

            editor.insertBreak = () => {
                if (editor.selection) {
                    const [table] = Editor.nodes(editor, { match: isType('table') });
                    if (table) return;
                }
                insertBreak();
            };

            editor.insertData = (data) => {
                const text = data.getData('text/plain');
                if (text && looksLikeImageUrl(text)) { insertImage(editor, text); return; }
                insertData(data);
            };

            return editor;
        };

        /* ===================== Marks & blocks (from the richtext example) ===================== */
        const isMarkActive = (editor, format) => {
            const marks = Editor.marks(editor);
            return marks ? marks[format] === true : false;
        };

        const toggleMark = (editor, format) => {
            if (isMarkActive(editor, format)) Editor.removeMark(editor, format);
            else Editor.addMark(editor, format, true);
        };

        const isAlignType = (format) => ALIGN_TYPES.includes(format);
        const isListType = (format) => LIST_TYPES.includes(format);
        const isAlignElement = (el) => 'align' in el;

        const isBlockActive = (editor, format, blockType = 'type') => {
            const { selection } = editor;
            if (!selection) return false;
            const [match] = Array.from(Editor.nodes(editor, {
                at: Editor.unhangRange(editor, selection),
                match: (n) => {
                    if (!Editor.isEditor(n) && SlateElement.isElement(n)) {
                        if (blockType === 'align' && isAlignElement(n)) return n.align === format;
                        return n.type === format;
                    }
                    return false;
                },
            }));
            return !!match;
        };

        const toggleBlock = (editor, format) => {
            const isActive = isBlockActive(editor, format, isAlignType(format) ? 'align' : 'type');
            const isList = isListType(format);

            Transforms.unwrapNodes(editor, {
                match: (n) => !Editor.isEditor(n) && SlateElement.isElement(n) && isListType(n.type) && !isAlignType(format),
                split: true,
            });

            let newProperties;
            if (isAlignType(format)) {
                newProperties = { align: isActive ? undefined : format };
            } else {
                newProperties = { type: isActive ? 'paragraph' : isList ? 'list-item' : format };
            }
            Transforms.setNodes(editor, newProperties);

            if (!isActive && isList) {
                Transforms.wrapNodes(editor, { type: format, children: [] });
            }
        };

        /* ===================== Inline link helpers (from the inlines example) ===================== */
        const isLinkActive = (editor) => !!Editor.nodes(editor, { match: isType('link') }).next().value;

        const unwrapLink = (editor) => Transforms.unwrapNodes(editor, { match: isType('link') });

        const wrapLink = (editor, url) => {
            if (isLinkActive(editor)) unwrapLink(editor);
            const { selection } = editor;
            const isCollapsed = selection && Range.isCollapsed(selection);
            const link = { type: 'link', url, children: isCollapsed ? [{ text: url }] : [] };
            if (isCollapsed) {
                Transforms.insertNodes(editor, link);
            } else {
                Transforms.wrapNodes(editor, link, { split: true });
                Transforms.collapse(editor, { edge: 'end' });
            }
        };

        /* ===================== Rendering ===================== */
        const renderElement = (props) => {
            const { attributes, children, element } = props;
            const style = element.align ? { textAlign: element.align } : undefined;
            switch (element.type) {
                case 'heading-one': return h('h1', { ...attributes, style }, children);
                case 'heading-two': return h('h2', { ...attributes, style }, children);
                case 'block-quote': return h('blockquote', { ...attributes, style }, children);
                case 'bulleted-list': return h('ul', { ...attributes, style }, children);
                case 'numbered-list': return h('ol', { ...attributes, style }, children);
                case 'list-item': return h('li', { ...attributes, style }, children);
                case 'check-list-item': return h(CheckListItem, props);
                case 'image': return h(ImageElement, props);
                case 'link': return h(LinkElement, props);
                case 'table': return h('table', { className: 'slate-table' }, h('tbody', attributes, children));
                case 'table-row': return h('tr', attributes, children);
                case 'table-cell': return h('td', attributes, children);
                case 'code': return h('pre', { ...attributes, className: 'slate-code' }, h('code', null, children));
                default: return h('p', { ...attributes, style }, children);
            }
        };

        const renderLeaf = ({ attributes, children, leaf }) => {
            let el = children;
            if (leaf.inlineCode) el = h('code', null, el);
            if (leaf.emphasis) el = h('em', null, el);
            if (leaf.underline) el = h('u', null, el);
            if (leaf.strong) el = h('strong', null, el);
            return h('span', attributes, el);
        };

        const CheckListItem = ({ attributes, children, element }) => {
            const editor = useSlateStatic();
            const readOnly = useReadOnly();
            const { checked } = element;
            return h('div', { ...attributes, className: 'slate-check' },
                h('span', { contentEditable: false, className: 'slate-check-box' },
                    h('input', {
                        type: 'checkbox',
                        checked: !!checked,
                        onChange: (event) => {
                            const path = ReactEditor.findPath(editor, element);
                            Transforms.setNodes(editor, { checked: event.target.checked }, { at: path });
                        },
                    }),
                ),
                h('span', {
                    contentEditable: !readOnly,
                    suppressContentEditableWarning: true,
                    className: 'slate-check-text' + (checked ? ' checked' : ''),
                }, children),
            );
        };

        const ImageElement = ({ attributes, children, element }) => {
            const editor = useSlateStatic();
            const active = useSelected() && useFocused();
            return h('div', attributes,
                children,
                h('div', { contentEditable: false, className: 'slate-img-wrap' },
                    h('img', { src: element.url, className: 'slate-img' + (active ? ' sel' : '') }),
                    h('button', {
                        type: 'button',
                        className: 'slate-btn slate-img-del' + (active ? '' : ' hidden'),
                        onPointerDown: (e) => e.preventDefault(),
                        onClick: () => Transforms.removeNodes(editor, { at: ReactEditor.findPath(editor, element) }),
                    }, h('span', { className: 'material-icons' }, 'delete')),
                ),
            );
        };

        // Non-editable zero-width span around inline children (Chromium caret bugfix).
        const InlineBugfix = () => h('span', { contentEditable: false, style: { fontSize: 0 } }, String.fromCodePoint(160));

        const LinkElement = ({ attributes, children, element }) => {
            const selected = useSelected();
            return h('a', { ...attributes, href: element.url, className: 'slate-link' + (selected ? ' sel' : '') },
                h(InlineBugfix), children, h(InlineBugfix));
        };

        /* ===================== Toolbar (from the components example) ===================== */
        const ToolBtn = ({ active, onClick, icon }) => h('button', {
            type: 'button',
            className: 'slate-btn' + (active ? ' is-active' : ''),
            onPointerDown: (e) => e.preventDefault(),
            onClick,
        }, h('span', { className: 'material-icons' }, icon));

        const MarkButton = ({ format, icon }) => {
            const editor = useSlate();
            return h(ToolBtn, { active: isMarkActive(editor, format), icon, onClick: () => toggleMark(editor, format) });
        };

        const BlockButton = ({ format, icon }) => {
            const editor = useSlate();
            return h(ToolBtn, {
                active: isBlockActive(editor, format, isAlignType(format) ? 'align' : 'type'),
                icon,
                onClick: () => toggleBlock(editor, format),
            });
        };

        const AddLinkButton = () => {
            const editor = useSlate();
            return h(ToolBtn, {
                active: isLinkActive(editor), icon: 'link',
                onClick: () => { const url = window.prompt('Enter the URL of the link:'); if (url && editor.selection) wrapLink(editor, url); },
            });
        };

        const RemoveLinkButton = () => {
            const editor = useSlate();
            return h(ToolBtn, {
                active: isLinkActive(editor), icon: 'link_off',
                onClick: () => { if (isLinkActive(editor)) unwrapLink(editor); },
            });
        };

        const InsertImageButton = () => {
            const editor = useSlateStatic();
            return h(ToolBtn, {
                active: false, icon: 'image',
                onClick: () => { const url = window.prompt('Enter the URL of the image:'); if (url) insertImage(editor, url); },
            });
        };

        const Toolbar = () => h('div', { className: 'slate-toolbar' },
            h(MarkButton, { format: 'strong', icon: 'format_bold' }),
            h(MarkButton, { format: 'emphasis', icon: 'format_italic' }),
            h(MarkButton, { format: 'underline', icon: 'format_underlined' }),
            h(MarkButton, { format: 'inlineCode', icon: 'code' }),
            h(BlockButton, { format: 'heading-one', icon: 'looks_one' }),
            h(BlockButton, { format: 'heading-two', icon: 'looks_two' }),
            h(BlockButton, { format: 'block-quote', icon: 'format_quote' }),
            h(BlockButton, { format: 'numbered-list', icon: 'format_list_numbered' }),
            h(BlockButton, { format: 'bulleted-list', icon: 'format_list_bulleted' }),
            h(BlockButton, { format: 'check-list-item', icon: 'check_box' }),
            h(BlockButton, { format: 'left', icon: 'format_align_left' }),
            h(BlockButton, { format: 'center', icon: 'format_align_center' }),
            h(BlockButton, { format: 'right', icon: 'format_align_right' }),
            h(BlockButton, { format: 'justify', icon: 'format_align_justify' }),
            h(AddLinkButton),
            h(RemoveLinkButton),
            h(InsertImageButton),
        );

        /* ===================== App ===================== */
        // Replace the whole document with freshly-parsed nodes (used when the
        // Markdown textarea is edited). The Slate component is uncontrolled, so we
        // drive it through the editor instance rather than a value prop.
        function resetNodes(editor, nodes) {
            Editor.withoutNormalizing(editor, () => {
                const count = editor.children.length;
                for (let i = count - 1; i >= 0; i--) Transforms.removeNodes(editor, { at: [i] });
                Transforms.insertNodes(editor, nodes, { at: [0] });
            });
            try { Transforms.select(editor, Editor.start(editor, [])); } catch (err) { /* empty doc */ }
        }

        function App() {
            const editor = useMemo(() => withPlugins(withHistory(withReact(createEditor()))), []);
            const initial = useMemo(() => initialValue, []);
            const syncing = useRef(false);
            const [md, setMd] = useState(() => slateToMarkdown(initialValue));

            const onChange = () => {
                const isAstChange = editor.operations.some((op) => op.type !== 'set_selection');
                if (isAstChange && !syncing.current) setMd(slateToMarkdown(editor.children));
                syncing.current = false;
            };

            const onMarkdownInput = (event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                resetNodes(editor, markdownToSlate(text));
            };

            const onKeyDown = (event) => {
                if (!(event.ctrlKey || event.metaKey)) return;
                const key = event.key.toLowerCase();
                if (key === '`') { event.preventDefault(); toggleMark(editor, 'inlineCode'); return; }
                if (MARK_HOTKEYS[key]) { event.preventDefault(); toggleMark(editor, MARK_HOTKEYS[key]); }
            };

            return h(React.Fragment, null,
                h(SlateProvider, { editor, initialValue: initial, onChange },
                    h('div', { className: 'slate-shell' },
                        h(Toolbar),
                        h(Editable, {
                            renderElement,
                            renderLeaf,
                            spellCheck: false,
                            placeholder: 'Write something…',
                            onKeyDown,
                        }),
                    ),
                ),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'slate-markdown-output',
                    rows: 16,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('slate-target')).render(h(App));
    </script>

</body>
</html>
