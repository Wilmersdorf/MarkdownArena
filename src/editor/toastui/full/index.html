<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast UI Editor Full</title>

    <!-- Prism ships inside this page (below) for the code-syntax-highlight plugin.
         Set manual mode BEFORE prism-core loads so its auto-highlightAll rAF can't
         walk the live ProseMirror DOM and corrupt the editor. -->
    <script>window.Prism = { manual: true };</script>
    <!-- Full prism build (core + markup/css/clike/javascript), raw exact-version
         file from jsDelivr. Sets window.Prism, which the plugin uses as highlighter. -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.js"></script>

    <!-- Toast UI's own CSS *is* the look — editor + every plugin's stylesheet,
         raw exact-version files from jsDelivr. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/chart@4.6.1/dist/toastui-chart.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor-plugin-code-syntax-highlight@3.1.0/dist/toastui-editor-plugin-code-syntax-highlight.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tui-color-picker@2.2.8/dist/tui-color-picker.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor-plugin-color-syntax@3.1.0/dist/toastui-editor-plugin-color-syntax.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor-plugin-table-merged-cell@3.1.0/dist/toastui-editor-plugin-table-merged-cell.css">

    <style>
        body { margin: 0; }

        /* Grow with the page, no inner scroll. height:'auto' sizes the editor to its
           content; drop the min-heights Toast UI sets for its fixed-height default and
           let the panes and preview expand instead of scrolling internally. */
        .toastui-editor-defaultUI { border-left: none; border-right: none; border-top: none; }
        .toastui-editor-main .toastui-editor-md-splitter { z-index: 1; }
        .toastui-editor-md-container,
        .toastui-editor-ww-container { overflow: visible; }
        .toastui-editor-main,
        .toastui-editor-md-container .toastui-editor,
        .toastui-editor-ww-container .toastui-editor,
        .toastui-editor-md-preview,
        .toastui-editor-contents { min-height: 0; height: auto; }
        .toastui-editor-md-preview { overflow: visible; }
        /* ≥1rem breathing room on the left of the content area. */
        .toastui-editor-md-container .toastui-editor .ProseMirror,
        .toastui-editor-ww-container .toastui-editor-contents { padding-left: 1rem; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="toastui-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="toastui-markdown-output" rows="16" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. Same versions as the minimal demo.
         The plugins are CommonJS bundles; JSPM serves them as ESM default exports. -->
    <script type="importmap">
    {
        "imports": {
            "@toast-ui/editor": "https://ga.jspm.io/npm:@toast-ui/editor@3.2.2/dist/esm/index.js",
            "@toast-ui/editor-plugin-chart": "https://ga.jspm.io/npm:@toast-ui/editor-plugin-chart@3.0.1/dist/toastui-editor-plugin-chart.js",
            "@toast-ui/editor-plugin-code-syntax-highlight": "https://ga.jspm.io/npm:@toast-ui/editor-plugin-code-syntax-highlight@3.1.0/dist/toastui-editor-plugin-code-syntax-highlight.js",
            "@toast-ui/editor-plugin-color-syntax": "https://ga.jspm.io/npm:@toast-ui/editor-plugin-color-syntax@3.1.0/dist/toastui-editor-plugin-color-syntax.js",
            "@toast-ui/editor-plugin-table-merged-cell": "https://ga.jspm.io/npm:@toast-ui/editor-plugin-table-merged-cell@3.1.0/dist/toastui-editor-plugin-table-merged-cell.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "@toast-ui/chart": "https://ga.jspm.io/npm:@toast-ui/chart@4.6.1/dist/toastui-chart.js",
                "orderedmap": "https://ga.jspm.io/npm:orderedmap@2.1.1/dist/index.js",
                "process": "https://ga.jspm.io/npm:@jspm/core@2.1.0/nodelibs/browser/process.js",
                "prosemirror-commands": "https://ga.jspm.io/npm:prosemirror-commands@1.7.1/dist/index.js",
                "prosemirror-history": "https://ga.jspm.io/npm:prosemirror-history@1.5.0/dist/index.js",
                "prosemirror-inputrules": "https://ga.jspm.io/npm:prosemirror-inputrules@1.5.1/dist/index.js",
                "prosemirror-keymap": "https://ga.jspm.io/npm:prosemirror-keymap@1.2.3/dist/index.js",
                "prosemirror-model": "https://ga.jspm.io/npm:prosemirror-model@1.25.9/dist/index.js",
                "prosemirror-state": "https://ga.jspm.io/npm:prosemirror-state@1.4.4/dist/index.js",
                "prosemirror-transform": "https://ga.jspm.io/npm:prosemirror-transform@1.12.0/dist/index.js",
                "prosemirror-view": "https://ga.jspm.io/npm:prosemirror-view@1.42.0/dist/index.js",
                "rope-sequence": "https://ga.jspm.io/npm:rope-sequence@1.3.4/dist/index.js",
                "tui-color-picker": "https://ga.jspm.io/npm:tui-color-picker@2.2.8/dist/tui-color-picker.js",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
            }
        }
    }
    </script>

    <script type="module">
        // Toast UI Editor v3 (ProseMirror-based), markdown-native both ways. The five
        // official plugins mirror ui.toast.com's "all plugins" example: chart ($$chart
        // blocks), code-syntax-highlight (Prism), color-syntax (toolbar color picker),
        // and table-merged-cell (@cols/@rows spanning). The plugins are CommonJS
        // bundles, so each imports as a default export.
        import Editor from '@toast-ui/editor';
        import chart from '@toast-ui/editor-plugin-chart';
        import codeSyntaxHighlight from '@toast-ui/editor-plugin-code-syntax-highlight';
        import colorSyntax from '@toast-ui/editor-plugin-color-syntax';
        import tableMergedCell from '@toast-ui/editor-plugin-table-merged-cell';

        const output = document.getElementById('toastui-markdown-output');

        // Seed exercises every feature: headings, all marks, colored text (color-syntax
        // serializes <span style="color:…">), links, bullet/ordered/task lists,
        // blockquote, a merged-cell table (@cols/@rows), a Prism-highlighted code block,
        // a $$chart column chart, an inline image, and a horizontal rule.
        const content = [
            '# Toast UI Editor — full feature demo',
            '',
            '## Inline formatting',
            '',
            'A paragraph with **bold**, *italic*, ~~strikethrough~~, `inline code`, ' +
                'a [link](https://ui.toast.com/tui-editor), and ' +
                '<span style="color: #e53935">colored text</span> from the color-syntax plugin.',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '    - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '* [x] Write the demo',
            '* [ ] Ship it',
            '',
            '## Blockquote',
            '',
            '> Markdown is the native format — the editor round-trips it both ways.',
            '',
            '## Merged-cell table',
            '',
            '| @cols=2:Merged header spanning two columns | Status |',
            '| --- | --- | --- |',
            '| @rows=2:Spans two rows | Draft | Done |',
            '| Review | Pending |',
            '| Ada | Engineer | Active |',
            '',
            '## Code with syntax highlighting',
            '',
            '```javascript',
            'function greet(name) {',
            '  const greeting = `Hello, ${name}!`;',
            '  return greeting;',
            '}',
            '```',
            '',
            '## Chart',
            '',
            '$$chart',
            ',category1,category2',
            'Jan,21,23',
            'Feb,31,17',
            '',
            'type: column',
            'title: Monthly Revenue',
            'x.title: Amount',
            'y.title: Month',
            'y.min: 1',
            'y.max: 40',
            'y.suffix: $',
            '$$',
            '',
            '## Image',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '---',
        ].join('\n');

        const chartOptions = { minWidth: 100, maxWidth: 600, minHeight: 100, maxHeight: 300 };

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Toast UI keeps a live Markdown model, so getMarkdown() serializes straight
        // to Markdown regardless of the current edit mode.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = editor.getMarkdown();
        };

        // Official ui.toast.com defaults: markdown edit mode with a live vertical
        // preview, the full default toolbar (color-syntax appends its picker button),
        // and the markdown/wysiwyg mode-switch tabs. usageStatistics off — no beacon.
        const editor = new Editor({
            el: document.getElementById('toastui-target'),
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            height: 'auto',
            initialValue: content,
            usageStatistics: false,
            plugins: [
                [chart, chartOptions],
                [codeSyntaxHighlight, { highlighter: window.Prism }],
                colorSyntax,
                tableMergedCell,
            ],
        });

        editor.on('change', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        // Second arg false = don't move the cursor / steal focus.
        output.addEventListener('input', () => {
            syncing = true;
            editor.setMarkdown(output.value, false);
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
