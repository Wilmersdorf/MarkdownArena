<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toast UI Editor Standalone</title>
    <style>
        body { margin: 0; }
        /* NO TOOLBAR rule: toolbarItems:[] + hideModeSwitch already suppress them;
           hide any residual bar / mode-switch tab outright so nothing shows. */
        .toastui-editor-toolbar,
        .toastui-editor-mode-switch { display: none !important; }

        /* Drop the widget's side/top borders (full-bleed surface) and give the
           content ≥1rem breathing room on the left. Scoped to the mount id so the
           overrides outweigh the widget stylesheet whichever order the two load in. */
        #toastui-target .toastui-editor-defaultUI { border-left: none; border-right: none; border-top: none; }
        #toastui-target .toastui-editor-ww-container .toastui-editor-contents { padding-left: 1rem; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="toastui-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="toastui-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. -->
    <script type="importmap">
    {
        "imports": {
            "@toast-ui/editor": "https://ga.jspm.io/npm:@toast-ui/editor@3.2.2/dist/esm/index.js"
        },
        "scopes": {
            "https://ga.jspm.io/": {
                "orderedmap": "https://ga.jspm.io/npm:orderedmap@2.1.1/dist/index.js",
                "prosemirror-commands": "https://ga.jspm.io/npm:prosemirror-commands@1.7.1/dist/index.js",
                "prosemirror-history": "https://ga.jspm.io/npm:prosemirror-history@1.5.0/dist/index.js",
                "prosemirror-inputrules": "https://ga.jspm.io/npm:prosemirror-inputrules@1.5.1/dist/index.js",
                "prosemirror-keymap": "https://ga.jspm.io/npm:prosemirror-keymap@1.2.3/dist/index.js",
                "prosemirror-model": "https://ga.jspm.io/npm:prosemirror-model@1.25.9/dist/index.js",
                "prosemirror-state": "https://ga.jspm.io/npm:prosemirror-state@1.4.4/dist/index.js",
                "prosemirror-transform": "https://ga.jspm.io/npm:prosemirror-transform@1.12.0/dist/index.js",
                "prosemirror-view": "https://ga.jspm.io/npm:prosemirror-view@1.42.0/dist/index.js",
                "rope-sequence": "https://ga.jspm.io/npm:rope-sequence@1.3.4/dist/index.js",
                "w3c-keyname": "https://ga.jspm.io/npm:w3c-keyname@2.2.8/index.js"
            }
        }
    }
    </script>
    <script type="module">
        // Toast UI Editor v3 is built on ProseMirror. Its default export is the
        // Editor class; Markdown is a native, first-party data format both ways.
        import Editor from '@toast-ui/editor';

        // The editor ships its CSS separately. Inject it as a <link> from JS;
        // the raw dist stylesheet stays on jsDelivr (raw files are immutable).
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = 'https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor.css';
        document.head.appendChild(cssLink);

        const output = document.getElementById('toastui-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Toast UI edits in WYSIWYG mode but keeps a live Markdown model, so its
        // own getMarkdown() serializes the document straight to Markdown.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = editor.getMarkdown();
        };

        // WYSIWYG mode so it formats as you type. No toolbar / no mode-switch tab —
        // editing is keyboard + Markdown only.
        const editor = new Editor({
            el: document.getElementById('toastui-target'),
            initialEditType: 'wysiwyg',
            previewStyle: 'tab',
            height: 'auto',
            initialValue: content,
            hideModeSwitch: true,
            toolbarItems: [],
        });

        editor.on('change', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        // Second arg false = don't move the cursor / steal focus.
        output.addEventListener('input', () => {
            syncing = true;
            editor.setMarkdown(output.value, false);
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
