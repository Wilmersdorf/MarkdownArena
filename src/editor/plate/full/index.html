        html {

            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        body { margin: 0; color: #111827; }

        /* Toolbar — white, bottom border, compact ghost buttons, dark accent on active */
        .toolbar {
            position: sticky; top: 0; z-index: 10; background: #fff;
            border-bottom: 1px solid #e5e7eb; padding: 0.5rem 1rem;
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.125rem 0.25rem;
        }
        .toolbar__group { display: flex; flex-wrap: wrap; gap: 0.125rem; }
        .toolbar__group + .toolbar__group { border-left: 1px solid #e5e7eb; margin-left: 0.25rem; padding-left: 0.5rem; }
        .toolbar button {
            background: transparent; border: none; border-radius: 0.375rem;
            color: #374151; cursor: pointer; font-family: inherit; font-size: 0.8125rem;
            font-weight: 500; line-height: 1.2; padding: 0.3rem 0.5rem; white-space: nowrap;
        }
        .toolbar button:hover { background: #f3f4f6; color: #111827; }
        .toolbar button:disabled { color: #9ca3af; cursor: default; background: transparent; }
        .toolbar button.is-active { background: #111827; color: #fff; }

        .plate-doc { padding: 0.5rem 1.5rem 1.5rem; }
        .plate-content { outline: none; line-height: 1.6; }
        .plate-content > * { margin: 0.4em 0; }
        .plate-content h1 { font-size: 1.6rem; line-height: 1.2; margin: 1rem 0 0.5rem; }
        .plate-content h2 { font-size: 1.3rem; line-height: 1.25; margin: 0.9rem 0 0.4rem; }
        .plate-content h3 { font-size: 1.1rem; margin: 0.8rem 0 0.4rem; }
        .plate-content :first-child { margin-top: 0; }

        .plate-content pre, .plate-content code { background: #f6f8fa; border-radius: 4px; }
        .plate-content code { padding: 0.15em 0.35em; font-size: 0.9em; }
        .plate-content pre { padding: 12px; overflow: auto; tab-size: 2; }
        .plate-content pre code { background: none; padding: 0; }
        .plate-content blockquote { padding-left: 0.9rem; border-left: 3px solid #d1d5db; color: #4b5563; margin-left: 0; }
        .plate-content mark { background: #fef08a; border-radius: 3px; padding: 0.05em 0.15em; }
        .plate-content a { color: #2563eb; }
        .plate-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.25rem 0; }
        .plate-content img { display: block; max-width: 100%; height: auto; border-radius: 4px; }
        .img-selected img { outline: 3px solid #93c5fd; }

        /* Todo items (official block-list pattern): no native marker; an absolutely
           positioned checkbox sits in the item's indent gap. */
        .todo-li { list-style: none; }
        .todo-li.is-checked { color: #9ca3af; text-decoration: line-through; }
        .todo-marker { position: absolute; top: 0.25rem; left: -1.5rem; margin: 0; }

        .plate-content table { border-collapse: collapse; margin: 0.75rem 0; width: 100%; }
        .plate-content td, .plate-content th {
            border: 1px solid #d1d5db; padding: 6px 10px; min-width: 2em;
            vertical-align: top; text-align: left;
        }
        .plate-content th { background: #f9fafb; font-weight: 700; }
        .plate-content td > *, .plate-content th > * { margin: 0; }

        .equation-block { text-align: center; padding: 0.5rem 0; cursor: pointer; border-radius: 4px; }
        .equation-block:hover, .equation-inline:hover { background: #f3f4f6; }
        .equation-inline { cursor: pointer; border-radius: 3px; padding: 0 0.1em; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>

                "parse-entities": "https://ga.jspm.io/npm:parse-entities@4.0.2/index.js",
                "proxy-compare": "https://ga.jspm.io/npm:proxy-compare@2.6.0/dist/index.modern.js",
                "react-compiler-runtime": "https://ga.jspm.io/npm:react-compiler-runtime@1.0.0/dist/index.js",
                "react-dom": "https://ga.jspm.io/npm:react-dom@19.1.0/index.js",
                "react-tracked": "https://ga.jspm.io/npm:react-tracked@1.7.14/dist/index.modern.mjs",
                "remark-mdx": "https://ga.jspm.io/npm:remark-mdx@3.1.1/index.js",
                "remark-parse": "https://ga.jspm.io/npm:remark-parse@11.0.0/index.js",
                "remark-stringify": "https://ga.jspm.io/npm:remark-stringify@11.0.0/index.js",
                "scheduler": "https://ga.jspm.io/npm:scheduler@0.26.0/index.js",
                "scroll-into-view-if-needed": "https://ga.jspm.io/npm:scroll-into-view-if-needed@3.1.0/dist/index.js",
                "slate": "https://ga.jspm.io/npm:slate@0.124.1/dist/index.es.js",
                "slate-dom": "https://ga.jspm.io/npm:slate-dom@0.124.1/dist/index.es.js",
                "slate-hyperscript": "https://ga.jspm.io/npm:slate-hyperscript@0.125.0/dist/index.es.js",
                "slate-react": "https://ga.jspm.io/npm:slate-react@0.124.2/dist/index.es.js",
                "stringify-entities": "https://ga.jspm.io/npm:stringify-entities@4.0.4/index.js",
                "tabbable": "https://ga.jspm.io/npm:tabbable@6.5.0/dist/index.esm.js",
                "trough": "https://ga.jspm.io/npm:trough@2.2.0/index.js",
                "unified": "https://ga.jspm.io/npm:unified@11.0.5/index.js",
                "unist-util-is": "https://ga.jspm.io/npm:unist-util-is@6.0.1/index.js",
                "unist-util-position-from-estree": "https://ga.jspm.io/npm:unist-util-position-from-estree@2.0.0/index.js",
                "unist-util-stringify-position": "https://ga.jspm.io/npm:unist-util-stringify-position@4.0.0/index.js",
                "unist-util-visit": "https://ga.jspm.io/npm:unist-util-visit@5.0.0/index.js",
                "unist-util-visit-parents": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/index.js",
                "unist-util-visit-parents/do-not-use-color": "https://ga.jspm.io/npm:unist-util-visit-parents@6.0.2/lib/color.js",
                "use-context-selector": "https://ga.jspm.io/npm:use-context-selector@1.4.4/dist/index.modern.mjs",
                "use-deep-compare": "https://ga.jspm.io/npm:use-deep-compare@1.3.0/dist-web/index.js",
                "use-sync-external-store/shim": "https://ga.jspm.io/npm:use-sync-external-store@1.6.0/shim/index.js",
                "use-sync-external-store/shim/with-selector.js": "https://ga.jspm.io/npm:use-sync-external-store@1.6.0/shim/with-selector.js",
                "vfile": "https://ga.jspm.io/npm:vfile@6.0.3/index.js",
                "vfile-message": "https://ga.jspm.io/npm:vfile-message@4.0.3/index.js",
                "zustand-x": "https://ga.jspm.io/npm:zustand-x@6.2.1/dist/index.mjs",
                "zustand-x/vanilla": "https://ga.jspm.io/npm:zustand-x@6.2.1/dist/lib/index.mjs",
                "zustand/middleware": "https://ga.jspm.io/npm:zustand@5.0.14/esm/middleware.mjs",
                "zustand/traditional": "https://ga.jspm.io/npm:zustand@5.0.14/esm/traditional.mjs",
                "zustand/vanilla": "https://ga.jspm.io/npm:zustand@5.0.14/esm/vanilla.mjs",
                "zwitch": "https://ga.jspm.io/npm:zwitch@2.0.4/index.js",
                "katex/": "https://ga.jspm.io/npm:katex@0.16.22/",
                "katex/dist/katex.min.css": "data:text/javascript,"
            },
            "https://ga.jspm.io/npm:acorn-jsx@5.3.2/": {
                "acorn": "https://ga.jspm.io/npm:acorn@8.17.0/dist/acorn.js"
            }
        }
    }
    </script>

    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plate, PlateContent, PlateElement, PlateLeaf, usePlateEditor, useEditorRef } from 'platejs/react';
        import { MarkdownPlugin, remarkMdx } from '@platejs/markdown';
        import { BasicMarksPlugin, BasicBlocksPlugin, BlockquotePlugin, HorizontalRulePlugin,
                 H1Plugin, H2Plugin, H3Plugin, BoldPlugin, ItalicPlugin, CodePlugin,
                 StrikethroughPlugin, HighlightPlugin } from '@platejs/basic-nodes/react';
        import { ListPlugin, useTodoListElement, useTodoListElementState } from '@platejs/list/react';
        import { IndentPlugin } from '@platejs/indent/react';
        import { CodeBlockPlugin } from '@platejs/code-block/react';
        import { LinkPlugin } from '@platejs/link/react';
        import { TablePlugin, TableRowPlugin, TableCellPlugin, TableCellHeaderPlugin } from '@platejs/table/react';
        import { ImagePlugin } from '@platejs/media/react';
        import { TextAlignPlugin } from '@platejs/basic-styles/react';
        import { EquationPlugin, InlineEquationPlugin } from '@platejs/math/react';
        // Markdown input rules and toolbar transforms live on the base packages —
        // the /react entries don't re-export them.
        import { BoldRules, ItalicRules, CodeRules, StrikethroughRules, HighlightRules,
                 HeadingRules, BlockquoteRules, HorizontalRuleRules } from '@platejs/basic-nodes';
        import { BulletedListRules, OrderedListRules, TaskListRules, isOrderedList, toggleList } from '@platejs/list';
        import { CodeBlockRules } from '@platejs/code-block';
        import { upsertLink } from '@platejs/link';
        import { setAlign } from '@platejs/basic-styles';
        import { getEquationHtml } from '@platejs/math';
        // remark extensions for the markdown round-trip: GFM (tables, strikethrough,
        // task lists), math ($ / $$), and MDX (inline <u>/<sub>/<sup>/<mark> as marks).
        import remarkGfm from 'remark-gfm';
        import remarkMath from 'remark-math';

        const { useRef, useState } = React;
        const h = React.createElement;

        // The highlight mark's default leaf is an unstyled span; render a real <mark>.
        const HighlightLeaf = (props) => h(PlateLeaf, { ...props, as: 'mark' }, props.children);

        // LinkPlugin sets isInline but ships no render component; render it inline.
        const LinkElement = (props) => h(PlateElement, { ...props, as: 'a' }, props.children);

        // @platejs/list stores items as paragraphs with listStyleType / indent props;
        // IndentPlugin renders the indent prop as margin-left and this wrapper (the
        // official block-list, via render.belowNodes) puts a native <ul>/<ol><li>
        // inside each item. Todo items swap the marker for a checkbox driven by the
        // plugin's own hooks.
        const TodoMarker = (props) => {
            const state = useTodoListElementState({ element: props.element });
            const { checkboxProps } = useTodoListElement(state);
            return h('div', { contentEditable: false },
                h('input', {
                    type: 'checkbox',
                    className: 'todo-marker',
                    checked: checkboxProps.checked,
                    onChange: (e) => checkboxProps.onCheckedChange(e.target.checked),
                    onMouseDown: checkboxProps.onMouseDown,
                }),
            );
        };
        const TodoLi = (props) =>
            h('li', { className: 'todo-li' + (props.element.checked ? ' is-checked' : '') }, props.children);
        const listConfig = { todo: { Li: TodoLi, Marker: TodoMarker } };
        const BlockList = (props) => {
            if (!props.element.listStyleType) return;
            return (props) => {
                const { listStart, listStyleType } = props.element;
                const { Li, Marker } = listConfig[listStyleType] ?? {};
                return h(isOrderedList(props.element) ? 'ol' : 'ul',
                    { style: { listStyleType, margin: 0, padding: 0, position: 'relative' }, start: listStart },
                    Marker && h(Marker, props),
                    Li ? h(Li, props) : h('li', null, props.children),
                );
            };
        };

        const ImageElement = (props) => {
            const [selected, setSelected] = useState(false);
            return h(PlateElement, { ...props, className: selected ? 'img-selected' : undefined },
                h('img', {
                    src: props.element.url,
                    alt: '',
                    draggable: false,
                    contentEditable: false,
                    onClick: () => setSelected(s => !s),
                }),
                props.children,
            );
        };

        const TableElement = (props) => h(PlateElement, { ...props, as: 'table' }, h('tbody', null, props.children));
        const TableRowElement = (props) => h(PlateElement, { ...props, as: 'tr' }, props.children);
        const TableCellElement = (props) => h(PlateElement, { ...props, as: 'td' }, props.children);
        const TableCellHeaderElement = (props) => h(PlateElement, { ...props, as: 'th' }, props.children);

        const HrElement = (props) => h(PlateElement, props,
            h('div', { contentEditable: false }, h('hr')), props.children);

        // KaTeX-rendered equations; click to edit the TeX source via prompt (the
        // official demos edit through a popover input).
        const editEquation = (editor, element) => {
            const tex = window.prompt('TeX expression', element.texExpression);
            if (tex !== null) editor.tf.setNodes({ texExpression: tex }, { at: editor.api.findPath(element) });
        };
        const katexHtml = (element) => ({
            __html: getEquationHtml({ element, options: { displayMode: element.type === 'equation', throwOnError: false } }),
        });
        const EquationElement = (props) => {
            const editor = useEditorRef();
            return h(PlateElement, { ...props, className: 'equation-block' },
                h('div', { contentEditable: false, onClick: () => editEquation(editor, props.element),
                           dangerouslySetInnerHTML: katexHtml(props.element) }),
                props.children);
        };
        const InlineEquationElement = (props) => {
            const editor = useEditorRef();
            return h(PlateElement, { ...props, as: 'span', className: 'equation-inline' },
                h('span', { contentEditable: false, onClick: () => editEquation(editor, props.element),
                            dangerouslySetInnerHTML: katexHtml(props.element) }),
                props.children);
        };

        // The markdown serializer (remark) encodes edge-of-line whitespace as character
        // references (&#x20; / &#x9;); that edge whitespace is meaningless here, so drop
        // runs that carry such an entity — never list/code indentation.
        const trimEdgeWhitespace = (md) =>
            md.replace(/^(?:[ \t]|&#x20;|&#x9;)+|(?:[ \t]|&#x20;|&#x9;)+$/gm, (run) =>
                /&#x(?:20|9);/.test(run) ? '' : run);

        const content = [
            '# Plate full demo',
            '',
            'A paragraph with **bold**, *italic*, <u>underline</u>, ~~strike~~, `inline code`, and <mark>highlight</mark>, plus H<sub>2</sub>O and x<sup>2</sup> and a [link](https://example.com).',
            '',
            '## Blocks',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '| Name | Role | Age |',
            '| --- | --- | --- |',
            '| Ada | Engineer | 36 |',
            '| Alan | Mathematician | 41 |',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '> A blockquote with a point to make.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
            '',
            '### Math',
            '',
            'The identity $e^{i\\pi} + 1 = 0$ typesets inline.',
            '',
            '$$',
            '\\int_a^b x^2 \\,dx',
            '$$',
            '',
            '---',
        ].join('\n');

        // Live markdown shortcuts: input rules rewrite markdown syntax as you type.
        // Rules must sit on the concrete leaf plugin that owns the node type, so the
        // nested leaves are reached with configurePlugin.
        const plugins = [
            BasicMarksPlugin
                .configurePlugin(BoldPlugin, { inputRules: [BoldRules.markdown({ variant: '*' }), BoldRules.markdown({ variant: '_' })] })
                .configurePlugin(ItalicPlugin, { inputRules: [ItalicRules.markdown({ variant: '*' }), ItalicRules.markdown({ variant: '_' })] })
                .configurePlugin(CodePlugin, { inputRules: [CodeRules.markdown()] })
                .configurePlugin(StrikethroughPlugin, { inputRules: [StrikethroughRules.markdown()] }),
            HighlightPlugin.configure({ inputRules: [HighlightRules.markdown()], node: { component: HighlightLeaf } }),
            BasicBlocksPlugin
                .configurePlugin(BlockquotePlugin, { inputRules: [BlockquoteRules.markdown()] })
                .configurePlugin(HorizontalRulePlugin, {
                    inputRules: [HorizontalRuleRules.markdown()],
                    render: { node: HrElement },
                }),
            // HeadingRules derives its "#"-prefix from the host plugin's key.
            H1Plugin.configure({ inputRules: [HeadingRules.markdown()] }),
            H2Plugin.configure({ inputRules: [HeadingRules.markdown()] }),
            H3Plugin.configure({ inputRules: [HeadingRules.markdown()] }),
            // Official ListKit pairing: IndentPlugin turns each item's indent prop into
            // margin-left, giving the native marker (or todo checkbox) room on the left.
            IndentPlugin,
            ListPlugin.configure({
                inputRules: [
                    BulletedListRules.markdown({ variant: '-' }),
                    BulletedListRules.markdown({ variant: '*' }),
                    OrderedListRules.markdown({ variant: '.' }),
                    OrderedListRules.markdown({ variant: ')' }),
                    TaskListRules.markdown(),
                ],
                render: { belowNodes: BlockList },
            }),
            CodeBlockPlugin.configure({
                inputRules: [CodeBlockRules.markdown({ on: 'match' })],
                handlers: {
                    // Enter on an empty last code line exits into a fresh paragraph.
                    onKeyDown: ({ editor, event }) => {
                        if (event.key !== 'Enter' || event.shiftKey || event.metaKey || event.ctrlKey || event.altKey) return;
                        if (!editor.selection || !editor.api.isCollapsed()) return;
                        const block = editor.api.above({ match: { type: 'code_block' } });
                        const line = editor.api.above({ match: { type: 'code_line' } });
                        if (!block || !line || block[0].children.length < 2) return;
                        const linePath = line[1];
                        const isLast = linePath[linePath.length - 1] === block[0].children.length - 1;
                        if (!isLast || editor.api.string(linePath) !== '') return;
                        event.preventDefault();
                        const afterBlock = [...block[1].slice(0, -1), block[1][block[1].length - 1] + 1];
                        editor.tf.withoutNormalizing(() => {
                            editor.tf.removeNodes({ at: linePath });
                            editor.tf.insertNodes({ type: 'p', children: [{ text: '' }] }, { at: afterBlock, select: true });
                        });
                    },
                },
            }),
            LinkPlugin.withComponent(LinkElement),
            TablePlugin.withComponent(TableElement),
            TableRowPlugin.withComponent(TableRowElement),
            TableCellPlugin.withComponent(TableCellElement),
            TableCellHeaderPlugin.withComponent(TableCellHeaderElement),
            ImagePlugin.withComponent(ImageElement),
            TextAlignPlugin.configure({
                inject: { targetPlugins: ['p', 'h1', 'h2', 'h3'] },
            }),
            EquationPlugin.withComponent(EquationElement),
            InlineEquationPlugin.withComponent(InlineEquationElement),
            MarkdownPlugin.configure({ options: { remarkPlugins: [remarkMath, remarkGfm, remarkMdx] } }),
        ];

        function App() {
            const syncing = useRef(false);
            const [, setTick] = useState(0);
            const refresh = () => setTick(t => t + 1);

            const editor = usePlateEditor({
                plugins,
                value: (e) => e.getApi(MarkdownPlugin).markdown.deserialize(content),
            });

            const serialize = () => trimEdgeWhitespace(editor.api.markdown.serialize());
            const [markdown, setMarkdown] = useState(serialize);

            // editor -> markdown textarea (guarded against echoing textarea edits back)
            const handleEditorChange = () => {
                if (!syncing.current) setMarkdown(serialize());
                else syncing.current = false;
                refresh();
            };

            // markdown textarea -> editor
            const handleMarkdownInput = (event) => {
                const text = event.target.value;
                setMarkdown(text);
                syncing.current = true;
                editor.tf.setValue(editor.api.markdown.deserialize(text));
            };

            const marks = () => editor.api.marks() || {};
            const inTable = () => !!editor.api.some({ match: { type: 'table' } });
            const mark = (label, key) => ({
                label,
                run: () => editor.tf[key].toggle(),
                active: () => !!marks()[key],
            });
            const block = (label, key) => ({
                label,
                run: () => editor.tf[key].toggle(),
                active: () => !!editor.api.some({ match: { type: key } }),
            });
            const list = (label, styleType) => ({
                label,
                run: () => toggleList(editor, { listStyleType: styleType }),
                active: () => !!editor.api.some({ match: { listStyleType: styleType } }),
            });
            const align = (label, value) => ({
                label,
                run: () => setAlign(editor, value),
                active: () => !!editor.api.some({ match: { align: value } }),
            });
            const promptInsert = (message, fn) => () => {
                const value = window.prompt(message);
                if (value) fn(value);
                editor.tf.focus();
            };

            const groups = [
                [
                    mark('Bold', 'bold'), mark('Italic', 'italic'), mark('Underline', 'underline'),
                    mark('Strike', 'strikethrough'), mark('Code', 'code'), mark('Highlight', 'highlight'),
                    mark('Sub', 'subscript'), mark('Sup', 'superscript'),
                ],
                [
                    { label: 'Paragraph', run: () => editor.tf.toggleBlock('p'), active: () => !!editor.api.some({ match: { type: 'p' } }) },
                    block('H1', 'h1'), block('H2', 'h2'), block('H3', 'h3'),
                    block('Quote', 'blockquote'), block('Code block', 'code_block'),
                    { label: 'HR', run: () => editor.tf.insertNodes([{ type: 'hr', children: [{ text: '' }] }, { type: 'p', children: [{ text: '' }] }]) },
                ],
                [
                    list('Bullet list', 'disc'), list('Numbered list', 'decimal'), list('Task list', 'todo'),
                ],
                [
                    align('Left', 'left'), align('Center', 'center'), align('Right', 'right'), align('Justify', 'justify'),
                ],
                [
                    { label: 'Link', run: promptInsert('URL', (url) => upsertLink(editor, { url })), active: () => !!editor.api.some({ match: { type: 'a' } }) },
                    { label: 'Image', run: promptInsert('Image URL', (url) => editor.tf.insertNodes({ type: 'img', url, children: [{ text: '' }] })) },
                    { label: 'Inline math', run: promptInsert('TeX expression', (tex) => editor.tf.insertNodes({ type: 'inline_equation', texExpression: tex, children: [{ text: '' }] })) },
                    { label: 'Block math', run: promptInsert('TeX expression', (tex) => editor.tf.insertNodes({ type: 'equation', texExpression: tex, children: [{ text: '' }] })) },
                ],
                [
                    { label: 'Insert table', run: () => editor.tf.insert.table({ rowCount: 3, colCount: 3 }, { select: true }) },
                    { label: 'Add row', run: () => editor.tf.insert.tableRow(), can: inTable },
                    { label: 'Add column', run: () => editor.tf.insert.tableColumn(), can: inTable },
                    { label: 'Delete row', run: () => editor.tf.remove.tableRow(), can: inTable },
                    { label: 'Delete column', run: () => editor.tf.remove.tableColumn(), can: inTable },
                    { label: 'Delete table', run: () => editor.tf.remove.table(), can: inTable },
                ],
                [
                    { label: 'Undo', run: () => editor.tf.undo() },
                    { label: 'Redo', run: () => editor.tf.redo() },
                ],
            ];

            const toolbar = h('div', { className: 'toolbar' },
                groups.map((group, i) => h('div', { className: 'toolbar__group', key: i },
                    group.map((def) => h('button', {
                        key: def.label,
                        type: 'button',
                        className: def.active && def.active() ? 'is-active' : undefined,
                        disabled: def.can ? !def.can() : false,
                        onMouseDown: (e) => e.preventDefault(),
                        onClick: def.run,
                    }, def.label)),
                )),
            );

            return h('div', { className: 'plate' },
                toolbar,
                h('div', { className: 'plate-doc' },
                    h(Plate, { editor, onChange: handleEditorChange, onSelectionChange: refresh },
                        h(PlateContent, { className: 'plate-content', placeholder: 'Write something…' }),
                    ),
                ),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'plate-markdown-output',
                    rows: 14,
                    spellCheck: false,
                    value: markdown,
                    onChange: handleMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('plate-target')).render(h(App));
    </script>

</body>
</html>
