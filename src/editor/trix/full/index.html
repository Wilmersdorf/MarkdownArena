<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trix Full</title>
    <style>
        /* Trix's official demo (github.com/basecamp/trix, assets/index.html) is a
           plain writing column with the browser's system font stack; approximate
           it with handwritten CSS. The trix.css default chrome is the official look. */
        * { box-sizing: border-box; }
        html {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI',
                'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body { margin: 0; }

        /* Left-aligned writing column flush to the top/left edges; the toolbar and
           the bordered editor below it grow with the viewport. */
        main { margin: 0; }

        /* trix.css pads the editor only 0.6em; bring the text's left edge out to
           1rem. Qualified with the container id so it outweighs trix.css's bare
           trix-editor rule whichever order the two stylesheets load in. */
        #trix-target trix-editor { padding-left: 1rem; min-height: 12rem; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <main>
        <div id="trix-target"></div>
    </main>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="trix-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: JSPM modules import their deps as
         bare specifiers, so this map pins the demo's whole dependency graph to
         exact versions — one copy of each package. Same versions as the minimal demo. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "trix": "https://ga.jspm.io/npm:trix@2.1.19/dist/trix.esm.min.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        }
    }
    </script>
    <script type="module">
        // Importing Trix registers the <trix-editor>/<trix-toolbar> custom elements
        // and sets window.Trix. Trix is an HTML editor, not a Markdown one.
        import 'trix';
        import { marked } from 'marked';
        import TurndownService from 'turndown';

        // Trix ships its styles as a separate stylesheet, injected from JS so the
        // demo's CDN references all live together beside the imports above.
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = 'https://cdn.jsdelivr.net/npm/trix@2.1.19/dist/trix.css';
        document.head.appendChild(cssLink);

        const output = document.getElementById('trix-markdown-output');

        const content = [
            '# Trix — full feature demo',
            '',
            'A paragraph with **bold**, *italic*, ~~strikethrough~~, `inline code`, and a [link](https://example.com).',
            '',
            '> A blockquote with a point to make.',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet (indent)',
            '',
            '1. First',
            '2. Second',
            '',
            '```',
            "console.log('Hello, Trix!')",
            '```',
            '',
            'Use the paperclip button (or drag a file in) to attach an image.',
        ].join('\n');

        // Trix has no inline-code text format out of the box; register one (mapping to
        // <code>) BEFORE any editor initializes so `inline code` survives the round-trip
        // instead of flattening to plain text. Named codeInline so it never collides
        // with the toolbar's block "code" button (data-trix-attribute="code", a <pre>).
        if (window.Trix?.config) {
            window.Trix.config.textAttributes.codeInline = { tagName: 'code', inheritable: true };
        }

        // Client-side attachment handling (Trix's documented no-backend pattern):
        // read image files as data URLs so they embed inline; reject anything else
        // cleanly so a missing upload endpoint never leaves a broken/perpetually
        // "uploading" attachment. Attachments loaded from HTML (no .file) are left alone.
        document.addEventListener('trix-attachment-add', (event) => {
            const { attachment } = event;
            if (!attachment.file) return;
            if (attachment.file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = () => attachment.setAttributes({ url: reader.result, href: reader.result });
                reader.readAsDataURL(attachment.file);
            } else {
                attachment.remove();
            }
        });

        // Build the editor in JS: a hidden <input> holds Trix's serialized HTML. With no
        // "toolbar" attribute, Trix auto-generates its full default toolbar (bold, italic,
        // strike, link; heading1, quote, code, bullets, numbers, outdent, indent; attach;
        // undo, redo) and inserts it above the editor — exactly the official demo.
        const target = document.getElementById('trix-target');
        const input = document.createElement('input');
        input.id = 'trix-input';
        input.type = 'hidden';
        const editorEl = document.createElement('trix-editor');
        editorEl.setAttribute('input', 'trix-input');
        editorEl.className = 'trix-content'; // trix.css content styles, as on the official page
        target.append(input, editorEl);

        // Trix edits HTML, so bridge both directions with general-purpose converters:
        //   Markdown -> HTML (marked) -> Trix.loadHTML
        //   Trix HTML -> Markdown (turndown)
        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
            emDelimiter: '*',
        });
        // Trix serializes strikethrough as <del>; map it back to GFM ~~...~~
        // (marked parses ~~...~~ -> <del>, so this round-trips).
        turndown.addRule('strikethrough', {
            filter: ['del', 's', 'strike'],
            replacement: (text) => `~~${text}~~`,
        });
        // Trix's code block is a bare <pre> (no inner <code>), which turndown's built-in
        // fenced rule doesn't catch; emit a fenced block from the <pre>'s text.
        turndown.addRule('trixCodeBlock', {
            filter: (node) => node.nodeName === 'PRE',
            replacement: (_content, node) => `\n\n\`\`\`\n${node.textContent.replace(/\n$/, '')}\n\`\`\`\n\n`,
        });

        // Guards against the editor -> markdown -> editor update echoing back into the
        // textarea while the user is typing there.
        let syncing = false;

        // Trix -> Markdown: convert the editor's HTML (kept live in the hidden input).
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown(input.value || '').trim();
        };

        // marked pretty-prints its HTML with newlines between block tags; Trix's HTML
        // parser turns that insignificant whitespace into stray <br>s and empty list
        // items. Drop whitespace-only text nodes that sit strictly between block-level
        // siblings — never the spaces between inline elements, nor code inside <pre>.
        const BLOCK = new Set(['LI', 'UL', 'OL', 'P', 'DIV', 'BLOCKQUOTE', 'PRE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'FIGURE', 'HR', 'TABLE']);
        const isBlockOrNull = (n) => !n || (n.nodeType === 1 && BLOCK.has(n.tagName));
        const normalizeHTML = (html) => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const scrub = (node) => {
                [...node.childNodes].forEach((child) => {
                    if (child.nodeType === 3) {
                        if (!/\S/.test(child.textContent) && isBlockOrNull(child.previousSibling) && isBlockOrNull(child.nextSibling)) child.remove();
                    } else if (child.nodeType === 1) {
                        scrub(child);
                    }
                });
            };
            scrub(doc.body);
            return doc.body.innerHTML;
        };

        // Markdown -> Trix: (re)load the document from the parsed, normalized HTML.
        const loadMarkdown = (md) => {
            editorEl.editor.loadHTML(normalizeHTML(marked.parse(md)));
        };

        // loadHTML needs the editor initialized; wait for trix-initialize, then seed it.
        editorEl.addEventListener('trix-initialize', () => {
            loadMarkdown(content);
            renderMarkdown();
        }, { once: true });

        // Every document change re-renders the Markdown panel.
        editorEl.addEventListener('trix-change', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document. Release
        // the guard on a macrotask so any (sync or microtask) trix-change from loadHTML
        // is suppressed, but genuine later edits still render.
        output.addEventListener('input', () => {
            syncing = true;
            // loadHTML re-selects the reloaded document, which yanks focus onto the
            // editor and would stop typing here after one character. Reload, then hand
            // focus and the caret straight back so the textarea stays editable.
            const { selectionStart, selectionEnd } = output;
            loadMarkdown(output.value);
            output.focus();
            output.setSelectionRange(selectionStart, selectionEnd);
            setTimeout(() => { syncing = false; }, 0);
        });
    </script>

</body>
</html>
