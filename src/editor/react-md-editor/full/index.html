    <!-- react-md-editor ships its editor chrome, toolbar and source-pane styles
         as markdown-editor.css; @uiw/react-markdown-preview's markdown.css styles
         the rendered live-preview pane (and supplies the
         --color-prettylights-syntax-* variables the source-pane highlighting
         reads). Both load as raw exact-version files from jsDelivr. KaTeX CSS
         typesets the math in the preview, pinned to the same version the import
         map resolves (fonts load relative to this URL). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uiw/react-md-editor@4.1.1/markdown-editor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uiw/react-markdown-preview@5.2.1/markdown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <style>
        body { margin: 0; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }

        /* Library default is padding: 10px on all sides, leaving the source text
           flush against the left edge. Widen only the horizontal padding to 1rem,
           matching the textarea below; the overlaid .w-md-editor-text-input
           textarea uses `padding: inherit` and stays aligned with the highlight
           layer underneath. */
        .w-md-editor-text { padding: 10px 1rem; }

        /* The editor otherwise sizes both panes to a fixed pixel height with inner
           scrolling. Let the whole thing grow with its content instead — as tall
           as the taller of the source and preview panes, no inner scroll. In live
           mode the preview is position:absolute over the right half, so lay the
           content out as a flex row and pull the preview back into flow: the two
           panes then sit side by side and stretch to the taller one. The library
           sets the height inline on the root, hence the !important overrides.
           Fullscreen (a toolbar command) is left untouched so its own
           full-viewport sizing and per-pane scrolling keep working. */
        .w-md-editor:not(.w-md-editor-fullscreen) { height: auto !important; }
        .w-md-editor:not(.w-md-editor-fullscreen) .w-md-editor-content {
            height: auto !important; overflow: visible !important; display: flex !important;
        }
        .w-md-editor:not(.w-md-editor-fullscreen) .w-md-editor-input,
        .w-md-editor:not(.w-md-editor-fullscreen) .w-md-editor-area {
            height: auto !important; overflow: visible !important;
        }
        .w-md-editor:not(.w-md-editor-fullscreen) .w-md-editor-preview {
            position: static !important; height: auto !important; overflow: visible !important;
        }
    </style>
</head>

            '## Text formatting',
            '',
            'A paragraph with **bold**, *italic*, ~~strikethrough~~, `inline code`,',
            '<u>underline</u>, <mark>highlight</mark>, plus H<sub>2</sub>O and',
            'E = mc<sup>2</sup>, and a [link](https://uiwjs.github.io/react-md-editor/).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '## Blockquote',
            '',
            '> A blockquote with a point to make.',
            '',
            '## Code block',
            '',
            '```js',
            'function greet(name) {',
            '  return `Hello, ${name}!`;',
            '}',
            '```',
            '',
            '## Table',
            '',
            '| Name | Role          | Age |',
            '| ---- | ------------- | --- |',
            '| Ada  | Engineer      | 36  |',
            '| Alan | Mathematician | 41  |',
            '',
            '## Image',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Math',
            '',
            'Inline math `$$c = \\pm\\sqrt{a^2 + b^2}$$` renders in the flow of text.',
            '',
            '```KaTeX',
            '\\int_a^b x^2 \\,dx = \\frac{b^3 - a^3}{3}',
            '```',
            '',
            '---',
        ].join('\n');

        // Official "Custom KaTeX Preview" example from the react-md-editor README:
        // a preview `code` component that typesets inline `$$…$$` and ```KaTeX
        // fenced blocks with katex.renderToString, and otherwise falls through to
        // the default (Prism-highlighted) code rendering.
        const KatexCode = ({ children = [], className, ...props }) => {
            if (typeof children === 'string' && /^\$\$(.*)\$\$/.test(children)) {
                const html = katex.renderToString(children.replace(/^\$\$(.*)\$\$/, '$1'), { throwOnError: false });
                return h('code', { dangerouslySetInnerHTML: { __html: html }, style: { background: 'transparent' } });
            }
            const code = props.node && props.node.children ? getCodeString(props.node.children) : children;
            if (typeof code === 'string' && typeof className === 'string' && /^language-katex/.test(className.toLowerCase())) {
                const html = katex.renderToString(code, { throwOnError: false });
                return h('code', { style: { fontSize: '150%' }, dangerouslySetInnerHTML: { __html: html } });
            }
            return h('code', { className: String(className) }, children);
        };

        function App() {
            // The editor edits Markdown source directly, so the document already
            // IS the Markdown: one `md` state drives both the editor and the
            // export textarea below (each is a controlled view of it).
            const [md, setMd] = useState(content);

            // Editor -> markdown. onChange reports only edits made inside the
            // editor; the bail on identical text drops any echo of an update the
            // textarea just pushed in.
            const onEditorChange = (next) => {
                const text = next == null ? '' : next;
                setMd((prev) => (text === prev ? prev : text));
            };

            // Markdown -> editor: the shared state re-renders the editor.
            const onMarkdownInput = (event) => setMd(event.target.value);

            return h(React.Fragment, null,
                h(MDEditor, {
                    value: md,
                    onChange: onEditorChange,
                    preview: 'live',           // source + rendered preview side by side
                    visibleDragbar: false,     // auto height, so no height divider to drag
                    previewOptions: { components: { code: KatexCode } },
                    textareaProps: { spellCheck: false, placeholder: 'Write Markdown…' },
                }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'react-md-editor-markdown-output',
                    rows: 18,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('react-md-editor-target')).render(h(App));
    </script>

</body>
