    <meta charset="UTF-8">
    <title>react-md-editor Standalone</title>
    <!-- The editor ships its chrome/source-pane styles as one plain CSS file;
         the second is @uiw/react-markdown-preview's markdown.css, which the
         package layers over the whole editor root (not just a preview pane)
         to supply the --color-prettylights-syntax-* variables the source
         pane's syntax highlighting reads — still needed with the built-in
         preview turned off (preview: 'edit' below). Both load as raw
         exact-version files from jsDelivr. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uiw/react-md-editor@4.1.1/markdown-editor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uiw/react-markdown-preview@5.2.1/markdown.css">
    <style>
        body { margin: 0; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
        /* Library default is padding: 10px on all sides, leaving the source
           text flush against the left edge. Widen only the horizontal
           padding to 1rem, matching the textarea below. The overlaid
           .w-md-editor-text-input textarea uses `padding: inherit` in the
           library CSS and is a direct child of this container, so it picks
           up the same value automatically and stays pixel-aligned with the
           .w-md-editor-text-pre highlight layer underneath. */
        .w-md-editor-text { padding: 10px 1rem; }
        /* The editor otherwise sizes its scroll viewport to a fixed pixel
           height, which for this short document leaves a tall blank gap
           between the source text and the section below. Let it wrap its
           content instead — as tall as the Markdown, growing with it. The
           library sets the height inline on the root, so the override needs
           !important; .w-md-editor-content is height: 100% and follows the
           root's now-auto height. */
        .w-md-editor { height: auto !important; }
    </style>
</head>

    <script type="module">
        // @uiw/react-md-editor is a React Markdown *source* editor: a textarea
        // holding the raw Markdown, syntax-highlighted as you type. Its
        // built-in rendered preview is turned off (preview: 'edit' below)
        // since it would just duplicate the "MARKDOWN 2-WAY EDITABLE"
        // textarea further down. We pull React plus the editor as bare
        // specifiers, resolved through the import map above to one
        // exact-version copy of every package in the graph.
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import MDEditor from '@uiw/react-md-editor';

        const { useState } = React;
        const h = React.createElement;

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        function App() {
            // The editor edits Markdown source directly, so the document
            // already IS the Markdown: one `md` state drives both the editor
            // and the export textarea below (each is a controlled view of it).
            const [md, setMd] = useState(content);

            // Editor -> markdown. MDEditor is controlled — onChange reports
            // only edits made inside the editor, never `value` prop updates —
            // and the bail on identical text drops any echo of an update the
            // textarea just pushed in.
            const onEditorChange = (next) => {
                const text = next == null ? '' : next;
                setMd((prev) => (text === prev ? prev : text));
            };

            // Markdown -> editor: the shared state re-renders the editor with
            // the edited text.
            const onMarkdownInput = (event) => setMd(event.target.value);

            return h(React.Fragment, null,
                h(MDEditor, {
                    value: md,
                    onChange: onEditorChange,
                    preview: 'edit',            // source pane only, no rendered preview
                    hideToolbar: true,          // keyboard/markdown only
                    visibleDragbar: false,      // no split pane, so no divider to drag
                    textareaProps: { spellCheck: false, placeholder: 'Write Markdown…' },
                }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'react-md-editor-markdown-output',
                    rows: 14,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('react-md-editor-target')).render(h(App));
