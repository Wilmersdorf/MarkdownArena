    <!-- Remirror's official stylesheet: the base ProseMirror styles, the .remirror-theme
         CSS variables and every extension's styling (lists, tables, images, blockquote,
         gap cursor and the prism token colours that highlight code blocks). Raw
         exact-version file from jsDelivr — this IS the look of remirror.io's editor. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@remirror/styles@3.0.0/all.css">

    <style>
        html {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            -moz-osx-font-smoothing: grayscale;
            -webkit-font-smoothing: antialiased;
        }
        body { margin: 0; }

        /* Menu bar — declarative button groups, coloured from remirror's own theme
           variables (defined on the wrapping .remirror-theme element). */
        .remirror-toolbar {
            display: flex; flex-wrap: wrap; gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--rmr-color-border, rgba(0, 0, 0, 0.2));
            background: var(--rmr-color-background, #fff);
        }
        .toolbar-group { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .remirror-toolbar button {
            font-family: inherit; font-size: 0.8125rem; font-weight: 500; line-height: 1.2;
            padding: 0.35rem 0.6rem;
            border: 1px solid var(--rmr-color-border, rgba(0, 0, 0, 0.2));
            border-radius: var(--rmr-radius-border, 0.25rem);
            background: #fff; color: var(--rmr-color-text, #252103);
            cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
        }
        .remirror-toolbar button:hover:not(:disabled) { background: var(--rmr-color-muted, #f1f3f5); }
        .remirror-toolbar button:disabled { opacity: 0.4; cursor: default; }
        .remirror-toolbar button.is-active {
            background: var(--rmr-color-primary, #7963d2);
            border-color: var(--rmr-color-primary, #7963d2);
            color: var(--rmr-color-primary-text, #fff);
        }

        /* Editor surface — grows with the page, ample left whitespace, no inner scroll. */
        .remirror-theme .remirror-editor.ProseMirror {
            padding: 1rem 1.25rem 1.5rem; outline: none; box-shadow: none;
        }
        .remirror-editor.ProseMirror:focus { outline: none; box-shadow: none; }
        .remirror-editor.ProseMirror :first-child { margin-top: 0; }
        .remirror-editor.ProseMirror img { max-width: 100%; height: auto; }

        /* Markdown round-trip panel */
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>

    <!-- JSPM serves each package's own ESM build unmodified, and Remirror's builds

    <!-- The code-block extension highlights via refractor, which pulls in
         prismjs/components/prism-core. That module's top-level code auto-schedules a
         one-shot Prism.highlightAll() (through requestAnimationFrame) unless Prism.manual
         is already set when it evaluates — a legacy browser-script behaviour this app
         never wants, since Remirror highlights code blocks itself. Left enabled, that
         auto-scan fires after mount, finds the live .ProseMirror <code> element, runs
         Prism's own highlight path on it and corrupts the block with [object Object]
         text (and, since ProseMirror reconciles unexpected DOM mutations, the document).
         Setting this before the module graph loads suppresses that scheduling. -->
    <script>window.Prism = { manual: true };</script>

        // Remirror is a React toolkit built on top of ProseMirror. This demo models the
        // official WYSIWYG editor (the `wysiwyg` preset / WysiwygEditor component): its
        // full mark/node feature set plus a menu bar and Markdown round-tripping.
        import * as React from 'react';
        import { createRoot } from 'react-dom/client';
        import { Remirror, useRemirror, useRemirrorContext } from '@remirror/react-core';
        import { BoldExtension } from '@remirror/extension-bold';
        import { ItalicExtension } from '@remirror/extension-italic';
        import { UnderlineExtension } from '@remirror/extension-underline';
        import { StrikeExtension } from '@remirror/extension-strike';
        import { CodeExtension } from '@remirror/extension-code';
        import { HeadingExtension } from '@remirror/extension-heading';
        import { BlockquoteExtension } from '@remirror/extension-blockquote';
        import { CodeBlockExtension } from '@remirror/extension-code-block';
        import { BulletListExtension, OrderedListExtension, TaskListExtension } from '@remirror/extension-list';
        import { LinkExtension } from '@remirror/extension-link';
        import { ImageExtension } from '@remirror/extension-image';
        import { HorizontalRuleExtension } from '@remirror/extension-horizontal-rule';
        import { HardBreakExtension } from '@remirror/extension-hard-break';
        import { TableExtension } from '@remirror/extension-tables';
        import { MarkdownExtension } from '@remirror/extension-markdown';

        const { useRef, useState, useEffect, useCallback } = React;
        const h = React.createElement;

        // Seed content exercises every feature. Marks without Markdown syntax
        // (underline) are seeded as inline HTML — marked passes embedded HTML through
        // and the schema turns <u> into a real underline mark.
        const content = [
            '# Remirror full demo',
            '',
            'A paragraph with **bold**, *italic*, <u>underline</u>, ~~strike~~, `inline code`,',
            'and a [link](https://remirror.io).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '',
            '- [x] Write the demo',
            '- [ ] Ship it',
            '',
            '## Table',
            '',
            '| Name | Role | Age |',
            '| --- | --- | --- |',
            '| Ada | Engineer | 36 |',
            '| Alan | Mathematician | 41 |',
            '',
            '## Media and blocks',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '> A blockquote with a point to make.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
            '',
            '---',
        ].join('\n');

        // Each extension contributes a schema node/mark, keymaps and an as-you-type
        // input rule. MarkdownExtension adds the `markdown` string handler (Markdown ->
        // doc via marked) and the `getMarkdown` helper (doc -> Markdown via turndown).
        // History/paragraph/gap-cursor come from the core preset that react-core adds.
        const extensions = () => [
            new BoldExtension({}),
            new ItalicExtension({}),
            new UnderlineExtension({}),
            new StrikeExtension({}),
            new CodeExtension({}),
            new HeadingExtension({}),
            new BlockquoteExtension({}),
            new CodeBlockExtension({}),
            new BulletListExtension({}),
            new OrderedListExtension({}),
            new TaskListExtension({}),
            new LinkExtension({ autoLink: true }),
            new ImageExtension({}),
            new HorizontalRuleExtension({}),
            new HardBreakExtension({}),
            new TableExtension({}),
            new MarkdownExtension({}),
        ];

        // Link / image prompts mirror the official WYSIWYG editor's link + image controls.
        const promptLink = (commands) => {
            const url = window.prompt('Link URL');
            if (url === null) return;
            if (url === '') commands.removeLink();
            else commands.updateLink({ href: url });
        };
        const promptImage = (commands) => {
            const src = window.prompt('Image URL');
            if (src) commands.insertImage({ src });
        };

        // Declarative menu bar (mirrors the official toolbar's groups). Each button
        // carries its command plus optional active/enabled predicates, re-evaluated on
        // every editor state update via useRemirrorContext({ autoUpdate: true }).
        function MenuBar() {
            const { active, commands } = useRemirrorContext({ autoUpdate: true });

            const heading = (level) => ({
                label: `H${level}`,
                run: () => commands.toggleHeading({ level }),
                active: () => active.heading({ level }),
            });

            const groups = [
                [
                    { label: 'Bold', run: () => commands.toggleBold(), active: () => active.bold(), can: () => commands.toggleBold.enabled() },
                    { label: 'Italic', run: () => commands.toggleItalic(), active: () => active.italic(), can: () => commands.toggleItalic.enabled() },
                    { label: 'Underline', run: () => commands.toggleUnderline(), active: () => active.underline(), can: () => commands.toggleUnderline.enabled() },
                    { label: 'Strike', run: () => commands.toggleStrike(), active: () => active.strike(), can: () => commands.toggleStrike.enabled() },
                    { label: 'Code', run: () => commands.toggleCode(), active: () => active.code(), can: () => commands.toggleCode.enabled() },
                ],
                [
                    { label: 'Paragraph', run: () => commands.convertParagraph(), active: () => active.paragraph() },
                    heading(1), heading(2), heading(3),
                    { label: 'Bullet list', run: () => commands.toggleBulletList(), active: () => active.bulletList() },
                    { label: 'Ordered list', run: () => commands.toggleOrderedList(), active: () => active.orderedList() },
                    { label: 'Task list', run: () => commands.toggleTaskList(), active: () => active.taskList() },
                    { label: 'Code block', run: () => commands.toggleCodeBlock({ language: 'js' }), active: () => active.codeBlock() },
                    { label: 'Blockquote', run: () => commands.toggleBlockquote(), active: () => active.blockquote() },
                    { label: 'Horizontal rule', run: () => commands.insertHorizontalRule() },
                    { label: 'Hard break', run: () => commands.insertHardBreak() },
                ],
                [
                    { label: 'Set link', run: () => promptLink(commands), active: () => active.link() },
                    { label: 'Remove link', run: () => commands.removeLink(), can: () => active.link() },
                    { label: 'Add image', run: () => promptImage(commands) },
                ],
                [
                    { label: 'Insert table', run: () => commands.createTable({ rowsCount: 3, columnsCount: 3, withHeaderRow: true }), can: () => commands.createTable.enabled() },
                    { label: 'Add column before', run: () => commands.addTableColumnBefore(), can: () => commands.addTableColumnBefore.enabled() },
                    { label: 'Add column after', run: () => commands.addTableColumnAfter(), can: () => commands.addTableColumnAfter.enabled() },
                    { label: 'Delete column', run: () => commands.deleteTableColumn(), can: () => commands.deleteTableColumn.enabled() },
                    { label: 'Add row before', run: () => commands.addTableRowBefore(), can: () => commands.addTableRowBefore.enabled() },
                    { label: 'Add row after', run: () => commands.addTableRowAfter(), can: () => commands.addTableRowAfter.enabled() },
                    { label: 'Delete row', run: () => commands.deleteTableRow(), can: () => commands.deleteTableRow.enabled() },
                    { label: 'Toggle header', run: () => commands.toggleTableHeader(), can: () => commands.toggleTableHeader.enabled() },
                    { label: 'Delete table', run: () => commands.deleteTable(), can: () => commands.deleteTable.enabled() },
                ],
                [
                    { label: 'Undo', run: () => commands.undo(), can: () => commands.undo.enabled() },
                    { label: 'Redo', run: () => commands.redo(), can: () => commands.redo.enabled() },
                ],
            ];

            return h('div', { className: 'remirror-toolbar' },
                groups.map((group, gi) =>
                    h('div', { className: 'toolbar-group', key: gi },
                        group.map((def, bi) =>
                            h('button', {
                                key: bi,
                                type: 'button',
                                className: def.active && def.active() ? 'is-active' : undefined,
                                disabled: def.can ? !def.can() : false,
                                // Keep the editor selection intact when the button is pressed.
                                onMouseDown: (event) => event.preventDefault(),
                                onClick: () => def.run(),
                            }, def.label),
                        ),
                    ),
                ),
            );
        }

        function App() {
            // Guards against the editor -> markdown -> editor update echoing back.
            const syncing = useRef(false);

            // Controlled editor: `state` is owned by React and advanced through setState
            // in onChange. The `markdown` string handler parses the initial Markdown.
            const { manager, state, setState, getContext } = useRemirror({
                extensions,
                content,
                stringHandler: 'markdown',
            });

            const [md, setMd] = useState(content);

            // Seed the Markdown panel from the editor's own serializer once mounted
            // (getMarkdown needs the framework output, available after the first commit).
            useEffect(() => {
                try {
                    const ctx = getContext();
                    setMd(ctx.helpers.getMarkdown(ctx.getState()));
                } catch (err) { /* keep the raw initial Markdown */ }
            }, [getContext]);

            // editor -> textarea: re-serialize to Markdown on every document change.
            const onChange = useCallback((parameter) => {
                setState(parameter.state);                            // controlled: apply new state
                if (syncing.current) return;                          // change came from the textarea
                if (parameter.tr && !parameter.tr.docChanged) return; // ignore pure selection moves
                try { setMd(getContext().helpers.getMarkdown(parameter.state)); } catch (err) { /* noop */ }
            }, [setState, getContext]);

            // textarea -> editor: re-parse the edited Markdown into a fresh state.
            const onMarkdownInput = (event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                try {
                    setState(manager.createState({ content: text, stringHandler: 'markdown' }));
                } catch (err) { /* incomplete Markdown mid-typing — keep last good doc */ }
                requestAnimationFrame(() => { syncing.current = false; });
            };

            return h(React.Fragment, null,
                // .remirror-theme supplies the CSS variables all.css styles the editor with.
                h('div', { className: 'remirror-theme' },
                    // autoRender:'end' renders the menu bar first, then the editor surface.
                    h(Remirror, { manager, state, onChange, autoRender: 'end' },
                        h(MenuBar),
                    ),
                ),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'remirror-markdown-output',
                    rows: 16,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('remirror-target')).render(h(App));
    </script>

</body>
</html>
