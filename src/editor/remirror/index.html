    <style>

        /* Remirror renders a real .ProseMirror surface but doesn't ship the base
           ProseMirror CSS, so prosemirror-view's editor stylesheet and the gapcursor
           stylesheet are loaded from the CDN in the script below. */
        .ProseMirror { padding-left: 1rem; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>

    <!-- JSPM serves each package's own ESM build unmodified, and Remirror's
         builds read the Node global process.env.NODE_ENV at load time, so
         define it before any module evaluates. -->
    <script>window.process = { env: { NODE_ENV: 'production' } };</script>

    <!-- The code-block extension's syntax highlighting pulls in prismjs/components/
         prism-core as a transitive dependency (via refractor), and that module's
         own top-level code auto-schedules a one-shot Prism.highlightAll() (via
         requestAnimationFrame) unless Prism.manual is already set when it evaluates
         -- a legacy browser-script behavior this app never wants, since Remirror
         already highlights code blocks itself. Left enabled, that auto-scan can
         fire after the editor has mounted, find the live .ProseMirror <code>
         element and call Prism's own highlight/stringify path on it directly
         (bypassing refractor's), corrupting the block and, since ProseMirror
         observes and reconciles unexpected DOM mutations, the document itself.
         Setting this before the module graph loads suppresses that scheduling. -->
    <script>window.Prism = { manual: true };</script>

    <script type="module">
        // Remirror is a React toolkit built on top of ProseMirror.
        import * as React from 'react';
        import { createRoot } from 'react-dom/client';
        import { Remirror, useRemirror } from '@remirror/react-core';
        import { BoldExtension } from '@remirror/extension-bold';
        import { ItalicExtension } from '@remirror/extension-italic';
        import { HeadingExtension } from '@remirror/extension-heading';
        import { BlockquoteExtension } from '@remirror/extension-blockquote';
        import { BulletListExtension, OrderedListExtension } from '@remirror/extension-list';
        import { CodeExtension } from '@remirror/extension-code';
        import { CodeBlockExtension } from '@remirror/extension-code-block';
        import { LinkExtension } from '@remirror/extension-link';
        import { HardBreakExtension } from '@remirror/extension-hard-break';
        import { MarkdownExtension } from '@remirror/extension-markdown';

        // Load prosemirror-view's editor CSS + the gapcursor CSS from the CDN (the
        // view version matches the canonical prosemirror-view in the import map).
        [
            'https://cdn.jsdelivr.net/npm/prosemirror-view@1.42.0/style/prosemirror.css',
            'https://cdn.jsdelivr.net/npm/prosemirror-gapcursor@1.4.1/style/gapcursor.css',
        ].forEach((href) => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        });

        const { useRef, useState, useEffect, useCallback } = React;
        const h = React.createElement;

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        /* ===================== Extensions =====================
           Each extension contributes a schema node/mark, keymaps AND an as-you-type
           input rule (Bold: `**x**`, Heading: `# `, lists: `- `/`1. `, Blockquote:
           `> `, Code: `` `x` ``, CodeBlock: ```` ```lang ````). MarkdownExtension adds
           the `markdown` string handler (Markdown -> doc, via marked) and the
           `getMarkdown` helper (doc -> Markdown, via turndown, configured for ATX
           headings + fenced code blocks). No menu/toolbar extensions are included —
           editing is keyboard + Markdown only. */
        const extensions = () => [
            new BoldExtension({}),
            new ItalicExtension({}),
            new HeadingExtension({}),
            new BlockquoteExtension({}),
            new BulletListExtension({}),
            new OrderedListExtension({}),
            new CodeExtension({}),
            new CodeBlockExtension({}),
            new LinkExtension({ autoLink: true }),
            new HardBreakExtension({}),
            new MarkdownExtension({}),
        ];

        /* ===================== App ===================== */
        function App() {
            // Guards against the editor -> markdown -> editor update echoing back.
            const syncing = useRef(false);

            // Controlled editor: `state` is owned by React and advanced through
            // `setState` in onChange. The `markdown` string handler parses the initial
            // Markdown string into the document.
            const { manager, state, setState, getContext } = useRemirror({
                extensions,
                content,
                stringHandler: 'markdown',
            });

            const [md, setMd] = useState(content);

            // Seed the Markdown panel from the editor's own serializer once mounted
            // (getMarkdown needs the framework output, available after the first commit).
            useEffect(() => {
                try {
                    const ctx = getContext();
                    setMd(ctx.helpers.getMarkdown(ctx.getState()));
                } catch (err) { /* keep the raw initial Markdown */ }
            }, [getContext]);

            // editor -> textarea: re-serialize to Markdown on every document change.
            const onChange = useCallback((parameter) => {
                setState(parameter.state);                 // controlled: apply the new state
                if (syncing.current) return;               // change came from the textarea
                if (parameter.tr && !parameter.tr.docChanged) return; // ignore pure selection moves
                try { setMd(getContext().helpers.getMarkdown(parameter.state)); } catch (err) { /* noop */ }
            }, [setState, getContext]);

            // textarea -> editor: re-parse the edited Markdown into a fresh state.
            const onMarkdownInput = (event) => {
                const text = event.target.value;
                setMd(text);
                syncing.current = true;
                try {
                    setState(manager.createState({ content: text, stringHandler: 'markdown' }));
                } catch (err) { /* incomplete Markdown mid-typing — keep last good doc */ }
                // Re-enable editor->textarea sync after the controlled update settles.
                requestAnimationFrame(() => { syncing.current = false; });
            };

            return h(React.Fragment, null,
                // No children + no autoRender => Remirror auto-renders just the
                // editable .ProseMirror surface (no toolbar).
                h(Remirror, { manager, state, onChange }),
                h('h2', { className: 'md-export-title' }, 'MARKDOWN 2-WAY EDITABLE'),
                h('textarea', {
                    className: 'md-export-output',
                    id: 'remirror-markdown-output',
                    rows: 14,
                    spellCheck: false,
                    value: md,
                    onChange: onMarkdownInput,
                }),
            );
        }

        createRoot(document.getElementById('remirror-target')).render(h(App));
    </script>

</body>
