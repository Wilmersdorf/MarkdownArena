<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyMCE Full</title>
    <style>
        body { margin: 0; }

        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="tinymce-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="tinymce-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: pins marked/turndown and the
         turndown GFM plugin (tables/strikethrough/code) to exact versions on JSPM. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js",
            "turndown-plugin-gfm": "https://ga.jspm.io/npm:turndown-plugin-gfm@1.0.2/lib/turndown-plugin-gfm.cjs.js"
        }
    }
    </script>

    <script type="module">
        // TinyMCE edits HTML, not Markdown, so we bridge both directions:
        //   markdown -> HTML (marked) on load / textarea edits
        //   HTML -> markdown (turndown + GFM) on every editor change
        import { marked } from 'marked';
        import TurndownService from 'turndown';
        import { gfm } from 'turndown-plugin-gfm';

        // TinyMCE ships as a classic global-`tinymce` script (official
        // self-contained build, loaded as a raw exact-version file). It derives its
        // asset base URL from this <script src>, so skin/icons/plugins load from the
        // same CDN path with no extra config.
        const loadScript = (src) => new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error('Failed to load ' + src));
            document.head.appendChild(s);
        });
        await loadScript('https://cdn.jsdelivr.net/npm/tinymce@8.6.0/tinymce.min.js');
        const tinymce = window.tinymce;

        const output = document.getElementById('tinymce-markdown-output');

        const content = [
            '# TinyMCE full feature demo',
            '',
            '## Formatting',
            '',
            'A paragraph with **bold**, *italic*, <u>underline</u>, ~~strikethrough~~,',
            '`inline code`, and a [link](https://example.com).',
            '',
            '## Lists',
            '',
            '- Bullet one',
            '- Bullet two',
            '  - Nested bullet',
            '',
            '1. First',
            '2. Second',
            '3. Third',
            '',
            '## Table',
            '',
            '| Name | Role | Age |',
            '| ---- | ---- | --- |',
            '| Ada | Engineer | 36 |',
            '| Alan | Mathematician | 41 |',
            '',
            '## Media',
            '',
            '![Placeholder image](https://markdownarena.com/600x200.png)',
            '',
            '## Blockquote',
            '',
            '> A blockquote with a point to make.',
            '',
            '## Code',
            '',
            '```js',
            'function greet(name) {',
            '  console.log(`Hello, ${name}!`);',
            '}',
            '```',
            '',
            '---',
        ].join('\n');

        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
        });
        turndown.use(gfm);

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        // Full-featured setup modeled on TinyMCE's official open-source demo,
        // minus every premium plugin/button. Content grows with the page via the
        // autoresize plugin (no fixed height, no inner scroll).
        const [editor] = await tinymce.init({
            target: document.getElementById('tinymce-target'),
            menubar: 'file edit view insert format tools table help',
            toolbar: 'undo redo | accordion accordionremove | blocks fontfamily fontsize | ' +
                'bold italic underline strikethrough | align numlist bullist | ' +
                'link image | table media | lineheight outdent indent | ' +
                'forecolor backcolor removeformat | charmap emoticons | ' +
                'code fullscreen preview | save print | pagebreak anchor codesample | ltr rtl',
            toolbar_mode: 'sliding',
            plugins: 'accordion advlist anchor autolink autoresize autosave charmap code ' +
                'codesample directionality emoticons fullscreen help image importcss ' +
                'insertdatetime link lists media nonbreaking pagebreak preview quickbars ' +
                'save searchreplace table visualblocks visualchars wordcount',
            promotion: false,
            branding: false,
            // Free self-hosted GPL build (required since TinyMCE 7).
            license_key: 'gpl',
            importcss_append: true,
            contextmenu: 'link image table',
            image_caption: true,
            autosave_interval: '30s',
            autosave_retention: '2m',
            autosave_ask_before_unload: false,
            min_height: 480,
            autoresize_bottom_margin: 24,
        });

        // Seed the editor from the starting Markdown.
        editor.setContent(marked.parse(content));

        // TinyMCE -> Markdown: serialize the HTML back to Markdown on every change.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown(editor.getContent()).trim();
        };
        editor.on('input NodeChange SetContent ExecCommand Undo Redo', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        output.addEventListener('input', () => {
            syncing = true;
            editor.setContent(marked.parse(output.value));
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
