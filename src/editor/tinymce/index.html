<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TinyMCE Standalone</title>
    <style>
        body { margin: 0; }
        #tinymce-target { padding-left: 1rem; }
        .md-export-title { border-top: 1px solid #d0d7de; margin: 0; padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.04em; color: #6e7781; background: #f6f8fa; }
        .md-export-output { width: 100%; box-sizing: border-box; padding: 1rem; font-family: monospace; field-sizing: content; border: none; resize: none; }
    </style>
</head>
<body>

    <div id="tinymce-target"></div>

    <h2 class="md-export-title">MARKDOWN 2-WAY EDITABLE</h2>
    <textarea class="md-export-output" id="tinymce-markdown-output" rows="14" spellcheck="false"></textarea>

    <!-- Import map generated by @jspm/generator: pins marked/turndown and their
         deps to exact versions on JSPM. -->
    <script type="importmap">
    {
        "imports": {
            "marked": "https://ga.jspm.io/npm:marked@18.0.5/lib/marked.esm.js",
            "turndown": "https://ga.jspm.io/npm:turndown@7.2.4/lib/turndown.browser.es.js"
        }
    }
    </script>

    <script type="module">
        // TinyMCE has no Markdown format — it edits HTML — so we bridge both
        // directions with general-purpose converters:
        //   markdown -> HTML (marked) on load / textarea edits
        //   HTML -> markdown (turndown) on every editor change
        import { marked } from 'marked';
        import TurndownService from 'turndown';

        // TinyMCE ships as a classic global-`tinymce` script (official
        // self-contained build, loaded as a raw exact-version file). Inject it
        // and await it before mounting. It auto-derives its asset base URL from this
        // <script src>, so skins load from the same CDN path with no extra config.
        const loadScript = (src) => new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error('Failed to load ' + src));
            document.head.appendChild(s);
        });
        await loadScript('https://cdn.jsdelivr.net/npm/tinymce@8.6.0/tinymce.min.js');
        const tinymce = window.tinymce;

        const output = document.getElementById('tinymce-markdown-output');

        const content = [
            '# Markdown demo',
            '',
            'A paragraph with **bold**, *italic*, `inline code`, and a [link](https://example.com).',
            '',
            '- Bullet one',
            '- Bullet two',
            '',
            '1. First',
            '2. Second',
            '',
            '> A blockquote.',
            '',
            '```js',
            "console.log('Hello, Markdown!')",
            '```',
        ].join('\n');

        const turndown = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-',
        });

        // Guards against the editor -> markdown -> editor update echoing back.
        let syncing = false;

        const [editor] = await tinymce.init({
            target: document.getElementById('tinymce-target'),
            // Inline mode edits the target element in place — no iframe — so it
            // lives directly in the page DOM.
            inline: true,
            // No chrome — keyboard/Markdown editing only.
            menubar: false,
            toolbar: false,
            statusbar: false,
            promotion: false,
            branding: false,
            // Free self-hosted GPL build (required since TinyMCE 7).
            license_key: 'gpl',
            plugins: 'lists advlist',
            // Built-in as-you-type Markdown shortcuts (native text_patterns).
            text_patterns: [
                { start: '**', end: '**', format: 'bold' },
                { start: '__', end: '__', format: 'bold' },
                { start: '*', end: '*', format: 'italic' },
                { start: '_', end: '_', format: 'italic' },
                { start: '`', end: '`', format: 'code' },
                { start: '#', format: 'h1', trigger: 'space' },
                { start: '##', format: 'h2', trigger: 'space' },
                { start: '###', format: 'h3', trigger: 'space' },
                { start: '####', format: 'h4', trigger: 'space' },
                { start: '#####', format: 'h5', trigger: 'space' },
                { start: '######', format: 'h6', trigger: 'space' },
                { start: '1.', cmd: 'InsertOrderedList', trigger: 'space' },
                { start: '*', cmd: 'InsertUnorderedList', trigger: 'space' },
                { start: '-', cmd: 'InsertUnorderedList', trigger: 'space' },
                { start: '>', cmd: 'mceBlockQuote', trigger: 'space' },
                { start: '---', cmd: 'InsertHorizontalRule', trigger: 'space' },
            ],
        });

        // Seed the editor from the starting Markdown.
        editor.setContent(marked.parse(content));

        // TinyMCE -> Markdown: serialize the HTML back to Markdown on every change.
        const renderMarkdown = () => {
            if (syncing) return;
            output.value = turndown.turndown(editor.getContent()).trim();
        };
        editor.on('input NodeChange SetContent ExecCommand Undo Redo', renderMarkdown);

        // Markdown -> editor: re-parse the edited text back into the document.
        output.addEventListener('input', () => {
            syncing = true;
            editor.setContent(marked.parse(output.value));
            syncing = false;
        });

        renderMarkdown();
    </script>

</body>
</html>
